<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heldentag – Startbereich</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
    <link rel="stylesheet" href="../jury.css">
    <style>
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .retry-icon {
            width: 0.7rem;
            height: 0.7rem;
            border: 2px solid var(--border);
            border-top-color: var(--muted);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        .presence-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .presence-dot.online {
            background: var(--green);
        }

        #presence-chips {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            align-items: center;
        }

        #presence-overlay {
            position: relative !important;
            inset: unset !important;
            flex: unset !important;
            background: transparent !important;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 0.5rem 1rem;
            padding: 0.75rem 1rem;
            gap: 0.5rem;
            z-index: unset !important;
        }

        .pchip {
            width: 8rem;
            border-radius: 8px;
            background: transparent;
            padding: 0.25rem 0.6rem 0.35rem;
        }

        .pchip.small {
            width: 5.5rem;
            padding: 0.1rem 0.4rem;
        }

        .pchip-label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
        }

        .pchip.small .pchip-label {
            font-size: 0.65rem;
        }

        .pchip-track {
            margin-top: 0.2rem;
            height: 3px;
            border-radius: 999px;
            background: var(--border);
            overflow: hidden;
        }

        .pchip-bar {
            height: 100%;
            transform-origin: left;
            transition: transform 1s linear, background 0.3s;
        }

        .picker-item.done {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }

        .picker-item-done-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--green);
            background: color-mix(in srgb, var(--green) 15%, transparent);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
            white-space: nowrap;
            align-self: center;
        }

        .mode-toggle {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 0.4rem;
            width: 100%;
            box-sizing: border-box;
        }

        .mode-chip {
            flex: 1;
            padding: 0.45rem 0;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        .mode-chip.active {
            border-color: var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }

        .mode-chip.finale.active {
            border-color: var(--green);
            color: var(--green);
            background: color-mix(in srgb, var(--green) 10%, transparent);
        }

        .fchip.finale-group.active {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        .finale-panel {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .finale-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            cursor: pointer;
            user-select: none;
            background: var(--card);
            gap: 0.6rem;
        }

        .finale-panel-header:active {
            background: var(--border);
        }

        .finale-panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--green);
            flex: 1;
        }

        .finale-panel-count {
            font-size: 0.65rem;
            font-weight: 600;
            background: color-mix(in srgb, var(--green) 15%, transparent);
            color: var(--green);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
        }

        .finale-panel-chevron {
            font-size: 0.7rem;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .finale-panel.open .finale-panel-chevron {
            transform: rotate(180deg);
        }

        .finale-panel-body {
            display: none;
            border-top: 1px solid var(--border);
            background: var(--card);
        }

        .finale-panel.open .finale-panel-body {
            display: block;
        }

        /* ── Verwaltung drawer ── */
        .drawer-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
        }

        .drawer-btn:active,
        .drawer-btn.open {
            color: var(--text);
            background: var(--border);
        }

        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 80;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(360px, 92vw);
            background: var(--card);
            border-left: 1px solid var(--border);
            z-index: 90;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .drawer-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
        }

        .drawer-close:active {
            background: var(--border);
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0 1rem;
        }

        .drawer-panel {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 0 0.75rem 0.5rem;
            overflow: hidden;
            background: var(--bg);
        }

        .drawer-panel-hdr {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .drawer-panel-hdr:active {
            background: var(--border);
        }

        .drawer-panel-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
        }

        .drawer-panel-title.closed {
            color: var(--green);
        }

        .drawer-panel-count {
            font-size: 0.65rem;
            background: var(--border);
            color: var(--muted);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
        }

        .drawer-panel-body {
            display: none;
            border-top: 1px solid var(--border);
        }

        .drawer-panel.open .drawer-panel-body {
            display: block;
        }

        .drawer-panel-chevron {
            font-size: 0.65rem;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .drawer-panel.open .drawer-panel-chevron {
            transform: rotate(180deg);
        }

        .drawer-item {
            display: grid;
            grid-template-columns: 2rem 1fr auto auto;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .drawer-item:last-child {
            border-bottom: none;
        }

        .drawer-item.disqualified {
            opacity: 0.45;
        }

        .drawer-item.removed {
            opacity: 0.25;
        }

        .drawer-item-num {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent);
            text-align: right;
        }

        .drawer-item-name {
            display: flex;
            flex-direction: column;
            gap: 0.02rem;
            min-width: 0;
        }

        .drawer-item-first {
            font-size: 0.6rem;
            color: var(--muted);
        }

        .drawer-item-last {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drawer-item-badge {
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            white-space: nowrap;
        }

        .drawer-item-badge.dq {
            color: #e74c3c;
            background: color-mix(in srgb, #e74c3c 15%, transparent);
        }

        .drawer-item-badge.done {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 15%, transparent);
        }

        .drawer-item-badge.runs {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 15%, transparent);
        }

        .drawer-item-badge.removed {
            color: var(--muted);
            background: var(--border);
        }

        .drawer-item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .dact {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .dact:active {
            background: var(--border);
        }

        .dact.dq {
            border-color: #e74c3c;
            color: #e74c3c;
            background: color-mix(in srgb, #e74c3c 12%, transparent);
        }

        .dact.rm {
            border-color: var(--muted);
            color: var(--muted);
            background: var(--border);
        }

        .drawer-panel-footer {
            padding: 0.5rem 0.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }

        .quali-toggle {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            line-height: 1;
        }

        .quali-toggle:active {
            opacity: 0.7;
        }

        .quali-toggle.closed {
            border-color: var(--green);
            color: var(--green);
            background: color-mix(in srgb, var(--green) 12%, transparent);
        }

        .quali-toggle svg,
        .final-btn svg {
            width: 0.75rem;
            height: 0.75rem;
            flex-shrink: 0;
        }

        .final-btn {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            border: 1.5px solid var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            color: var(--accent);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1;
        }

        .final-btn:active {
            opacity: 0.7;
        }

        .final-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .group-status-badge {
            font-size: 0.55rem;
            font-weight: 700;
            border-radius: 3px;
            padding: 0.1rem 0.3rem;
            white-space: nowrap;
        }

        .group-status-badge.quali-idle {
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
        }

        .group-status-badge.quali-running {
            color: #e3a007;
            background: color-mix(in srgb, #e3a007 18%, transparent);
        }

        .group-status-badge.quali-done {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 18%, transparent);
        }

        .group-status-badge.final-idle {
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
        }

        .group-status-badge.final-running {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .group-status-badge.final-done {
            color: #ffd700;
            background: color-mix(in srgb, #ffd700 18%, transparent);
        }

        #start-btn:not(:disabled) {
            background: var(--green);
            color: #000;
        }

        /* override jury.css header layout for true center */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        header> :first-child {
            text-align: left;
        }

        header> :last-child {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        /* ── Avatar menu ── */
        .avatar-wrap {
            position: relative;
        }

        .avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e05b3a;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            border: 2px solid transparent;
            transition: border-color 0.15s;
        }

        .avatar:hover {
            border-color: #e05b3a44;
        }

        .avatar-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 400;
            display: none;
            overflow: hidden;
        }

        .avatar-menu.open {
            display: block;
        }

        .avatar-menu-user {
            padding: 0.6rem 0.85rem;
            font-size: 0.75rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .avatar-menu-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: background 0.1s;
        }

        .avatar-menu-item:hover {
            background: var(--border);
        }

        .avatar-menu-item.danger {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-group">
            <div class="header-label">Event</div>
            <div class="header-value" id="event-display">—</div>
            <div class="header-label" id="quali-display"
                style="display:none;color:var(--muted);font-size:0.75rem;margin-top:0.1rem"></div>
            <div class="header-label" id="final-display"
                style="display:none;color:var(--accent);font-size:0.75rem;margin-top:0.05rem"></div>
        </div>
        <div class="header-group" id="presence-group">
            <div class="header-label">Kampfrichter</div>
            <div id="presence-chips"></div>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem">
            <button class="drawer-btn" id="drawer-btn" title="Verwaltung">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <div class="avatar-wrap">
                <div class="avatar" id="avatar-btn">?</div>
                <div class="avatar-menu" id="avatar-menu">
                    <div class="avatar-menu-user" id="avatar-username">—</div>
                    <div class="avatar-menu-item danger" id="avatar-logout">↩ Abmelden</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Toast notification -->
    <div id="toast" style="
        display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
        background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:0.65rem 1.1rem;font-size:0.85rem;font-weight:600;color:var(--text);
        box-shadow:0 4px 20px rgba(0,0,0,0.4);z-index:300;white-space:nowrap;
        pointer-events:none">
    </div>

    <!-- Final-created confirmation popup -->
    <div id="final-ready-overlay" style="
        display:none;position:fixed;inset:0;z-index:200;
        background:rgba(0,0,0,0.65);
        align-items:center;justify-content:center;padding:1.5rem">
        <div style="
            background:var(--card);border:1px solid var(--border);border-radius:14px;
            max-width:320px;width:100%;padding:1.5rem;text-align:center">
            <div style="font-size:1.8rem;margin-bottom:0.5rem">🏁</div>
            <div style="font-size:1rem;font-weight:800;color:var(--text);margin-bottom:0.35rem" id="final-ready-title">
            </div>
            <div style="font-size:0.85rem;color:var(--muted);margin-bottom:1.25rem" id="final-ready-msg"></div>
            <button class="submit-btn" id="final-ready-btn" style="max-width:100%">Zum Finale wechseln</button>
        </div>
    </div>

    <!-- Finale starten – Bestätigungs-Popup -->
    <div id="final-confirm-overlay" style="
        display:none;position:fixed;inset:0;z-index:210;
        background:rgba(0,0,0,0.72);
        align-items:center;justify-content:center;padding:1.5rem">
        <div style="
            background:var(--card);border:1px solid var(--border);border-radius:14px;
            max-width:340px;width:100%;padding:1.5rem;text-align:center">
            <div style="font-size:1.8rem;margin-bottom:0.5rem">🏁</div>
            <div style="font-size:1rem;font-weight:800;color:var(--text);margin-bottom:0.4rem" id="final-confirm-title">
            </div>
            <div style="font-size:0.85rem;color:var(--muted);margin-bottom:1.4rem" id="final-confirm-msg"></div>
            <div style="display:flex;gap:0.75rem">
                <button id="final-confirm-cancel" style="
                    flex:1;padding:0.85rem;border-radius:10px;border:1px solid var(--border);
                    background:transparent;color:var(--text);font-size:0.95rem;font-weight:700;cursor:pointer">
                    ← Abbrechen
                </button>
                <button id="final-confirm-ok" class="submit-btn" style="flex:1">
                    Finale erstellen
                </button>
            </div>
        </div>
    </div>

    <!-- Verwaltung drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span class="drawer-title">Verwaltung</span>
            <button class="drawer-close" id="drawer-close">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
    </div>

    <div class="content-center">
        <!-- Waiting overlay — shown while a starter is on the floor -->
        <div id="waiting-overlay" class="waiting hidden">
            <div class="waiting-dots">
                <div class="waiting-dot"></div>
                <div class="waiting-dot"></div>
                <div class="waiting-dot"></div>
            </div>
            <div id="waiting-name" style="font-size:2rem;font-weight:800;color:var(--accent);margin-top:0.5rem"></div>
            <div id="run-chip"
                style="display:none;margin-top:0.5rem;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0.2rem 0.9rem;font-size:0.75rem;font-weight:700;letter-spacing:0.06em">
            </div>
            <div id="waiting-label" class="waiting-label"></div>
            <div id="jury-grid" class="jcard-grid" style="margin-top:1rem"></div>
            <button id="next-btn" class="submit-btn"
                style="display:none;margin-top:1.25rem;max-width:480px;width:calc(100% - 2rem);background:var(--green);color:#000">
                Nächster Starter
            </button>
            <button id="abort-btn" style="margin-top:0.75rem;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:0.85rem;font-weight:600;padding:0.6rem 1.5rem;cursor:pointer">
                ✕ Lauf zurücksetzen
            </button>
        </div>

        <!-- Presence overlay — shown when not all judges are online -->
        <div id="presence-overlay" class="waiting hidden" style="position:relative;flex:1">
            <div class="waiting-dots">
                <div class="waiting-dot"></div>
                <div class="waiting-dot"></div>
                <div class="waiting-dot"></div>
            </div>
            <div class="waiting-label">Warte auf Kampfrichter</div>
        </div>

        <!-- Picker — hidden while waiting for scores or judges -->
        <div id="picker-section" style="display:none">
            <div id="picker-button-row">
                <div
                    style="display:grid;grid-template-columns:1fr auto;gap:0.5rem;padding:0.5rem 1rem 0;max-width:480px;margin:0 auto;width:100%;box-sizing:border-box">
                    <button class="submit-btn" id="start-btn" disabled>
                        Starter auswählen
                    </button>
                    <button id="clear-btn" disabled style="padding:0.85rem 1rem;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:1rem;font-weight:600;cursor:pointer">✕</button>
                </div>
            </div>
            <div id="picker-controls">
                <div id="mode-toggle" class="mode-toggle" style="display:none">
                    <button class="mode-chip active" id="mode-quali">Qualifikation</button>
                    <button class="mode-chip finale" id="mode-finale">Finale</button>
                </div>
                <div id="filter-chips-finale" class="filter-chips" style="display:none"></div>
                <div class="picker-input-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input class="picker-input" id="filter-input" type="text" inputmode="numeric"
                        placeholder="Startnummer suchen …" autocomplete="off">
                </div>
                <div id="filter-chips-groups" class="filter-chips" style="display:none"></div>
                <div id="filter-chips-runs" class="filter-chips" style="display:none"></div>
                <div class="picker-results-label" id="results-label"></div>
            </div>
            <div class="picker-list" id="picker-list"></div>
        </div>
    </div>

    <footer>
        <img src="../assets/weraceLogo.png" alt="WeRace">
    </footer>

    <script src="../config.js"></script>
    <script>
        const _seedOverride = localStorage.getItem('seedEventOverride');
        if (_seedOverride) CONFIG.eventObjectId = _seedOverride;
    </script>
    <script src="../parse-api.js"></script>
    <script>
        // START_NUMBERS is now loaded from Parse — populated on init
        let START_NUMBERS = [];
        let STARTERS = [];

        const JUDGE_COUNT = () => Object.keys(CONFIG.judgeTokens).length;
        const JUDGE_NAMES = () => Object.values(CONFIG.judgeTokens);
        const channel = new BroadcastChannel('werace-starter');
        let selected = null;
        let selectedFinalNumber = null;
        let activeStarter = null;
        let activeRunNumber = 1;
        let scoredBy = new Set();
        let juryScores = {};
        let scoreWs = null;
        let onlineJudges = new Set();
        let lastSeenMap = {};
        let runCounts = {};
        let finalRunCounts = {};
        let filterGroup = null;  // startGroup objectId or null = all
        let filterFinalGroup = null; // finale group filter
        let filterRuns = null;   // run count number or null = all
        let filterDone = false;  // show only finished starters when true
        let closedGroups = new Set(); // objectIds of groups with qualiClosed=true
        let _pendingFinalGroup = null; // set when confirmation popup is shown
        let _chipTicker = null;
        const STALE_MS = CONFIG.presenceStalMs;

        // ── Presence ──
        function buildChip(name, small) {
            const online = onlineJudges.has(name);

            const chip = document.createElement('div');
            chip.className = 'pchip' + (small ? ' small' : '');
            chip.dataset.judge = name;

            const label = document.createElement('div');
            label.className = 'pchip-label';

            const indicator = document.createElement('div');
            if (online) {
                indicator.className = 'presence-dot online';
            } else {
                indicator.className = 'retry-icon';
            }
            label.appendChild(indicator);
            label.appendChild(document.createTextNode(name));
            chip.appendChild(label);

            return chip;
        }

        function renderPresenceChips() {
            const allOnline = JUDGE_NAMES().every(n => onlineJudges.has(n));

            // Header chips
            const wrap = document.getElementById('presence-chips');
            wrap.innerHTML = '';
            for (const name of JUDGE_NAMES()) wrap.appendChild(buildChip(name, true));



            if (!_chipTicker) _chipTicker = setInterval(renderPresenceChips, 1000);
            // Presence overlay is informational only — picker stays visible, start button handles the blocking
            if (activeStarter !== null) { renderJuryGrid(); return; }
            const hasJudges = JUDGE_NAMES().length > 0;
            document.getElementById('presence-overlay').classList.toggle('hidden', !hasJudges || allOnline);
            // Never hide picker-section based on presence

            if (allOnline && selected !== null) setStartBtn(selected, selectedFinalNumber);
        }

        function updateStartBtnPresence() {
            renderPresenceChips();
        }

        async function refreshPresence() {
            try {
                const records = await ParseAPI.fetchPresence();
                lastPollTime = Date.now();
                onlineJudges = new Set(records.map(r => r.judgeName));
                records.forEach(r => {
                    lastSeenMap[r.judgeName] = new Date(r.lastSeen?.iso ?? r.lastSeen).getTime();
                });
                renderPresenceChips();
            } catch (_) { }
        }

        const filterInput = document.getElementById('filter-input');
        const pickerList = document.getElementById('picker-list');
        const resultsLabel = document.getElementById('results-label');
        const startBtn = document.getElementById('start-btn');
        const clearBtn = document.getElementById('clear-btn');
        const display = document.getElementById('selected-display');

        function clearSelection() {
            selected = null;
            selectedFinalNumber = null;
            if (display) display.textContent = '—';
            setStartBtn(null);
            renderList(filterInput.value);
        }

        function renderFilterChips() {
            const groupBar = document.getElementById('filter-chips-groups');
            const runsBar = document.getElementById('filter-chips-runs');

            const finalGroupIds = new Set(Object.keys(finalEntriesByGroup).filter(gid => finalEntriesByGroup[gid].length > 0));

            const groups = [];
            const seenG = new Set();
            for (const s of STARTERS) {
                if (s.startGroup && !seenG.has(s.startGroup.objectId) && !finalGroupIds.has(s.startGroup.objectId)) {
                    seenG.add(s.startGroup.objectId);
                    groups.push({ id: s.startGroup.objectId, name: s.startGroup.name ?? s.startGroup.objectId });
                }
            }
            groups.sort((a, b) => a.name.localeCompare(b.name));

            const runSet = new Set(STARTERS.map(s => runCounts[s.startNumber] ?? 0));
            const runs = [...runSet].sort((a, b) => a - b);

            // Groups row
            groupBar.style.display = groups.length ? '' : 'none';
            groupBar.innerHTML = '';
            for (const g of groups) {
                const chip = document.createElement('button');
                const isClosed = closedGroups.has(g.id);
                chip.className = 'fchip' + (filterGroup === g.id ? ' active' : '') + (isClosed ? ' closed-group' : '');
                chip.textContent = isClosed ? `🔒 ${g.name}` : g.name;
                chip.addEventListener('click', () => {
                    filterGroup = filterGroup === g.id ? null : g.id;
                    renderFilterChips();
                    renderList(filterInput.value);
                });
                groupBar.appendChild(chip);
            }

            // Runs row — skip the chip for qualiRuns count since "✓ Fertig" covers it
            const filteredRuns = runs.filter(r => CONFIG.qualiRuns == null || r < CONFIG.qualiRuns);
            runsBar.style.display = filteredRuns.length > 1 || (filteredRuns.length === 1 && filteredRuns[0] > 0) ? '' : 'none';
            runsBar.innerHTML = '';
            for (const r of filteredRuns) {
                const chip = document.createElement('button');
                chip.className = 'fchip runs' + (filterRuns === r ? ' active' : '');
                chip.textContent = r === 0 ? '0×' : `${r}×`;
                chip.addEventListener('click', () => {
                    filterRuns = filterRuns === r ? null : r;
                    filterDone = false;
                    renderFilterChips();
                    renderList(filterInput.value);
                });
                runsBar.appendChild(chip);
            }

            // "✓ Fertig" chip — only when qualiRuns is configured
            if (CONFIG.qualiRuns != null) {
                const hasDone = START_NUMBERS.some(n => (runCounts[n] ?? 0) >= CONFIG.qualiRuns);
                if (hasDone) {
                    runsBar.style.display = '';
                    const chip = document.createElement('button');
                    chip.className = 'fchip done' + (filterDone ? ' active' : '');
                    chip.textContent = '✓ Fertig';
                    chip.addEventListener('click', () => {
                        filterDone = !filterDone;
                        filterRuns = null;
                        renderFilterChips();
                        renderList(filterInput.value);
                    });
                    runsBar.appendChild(chip);
                }
            }
        }

        function renderFinalChips() {
            const bar = document.getElementById('filter-chips-finale');
            bar.innerHTML = '';
            const groups = Object.entries(finalEntriesByGroup).filter(([, e]) => e.length > 0);
            if (groups.length <= 1) { bar.style.display = 'none'; return; }
            bar.style.display = '';
            for (const [gid, entries] of groups) {
                const name = entries[0].startGroup?.name ?? gid;
                const chip = document.createElement('button');
                chip.className = 'fchip finale-group' + (filterFinalGroup === gid ? ' active' : '');
                chip.textContent = name;
                chip.addEventListener('click', () => {
                    filterFinalGroup = filterFinalGroup === gid ? null : gid;
                    renderFinalChips();
                    renderList('');
                });
                bar.appendChild(chip);
            }
        }

        function renderList(filter) {
            pickerList.innerHTML = '';

            if (mode === 'finale') {
                let groups = Object.entries(finalEntriesByGroup).filter(([, e]) => e.length > 0);
                if (filterFinalGroup) groups = groups.filter(([gid]) => gid === filterFinalGroup);

                if (!groups.length) {
                    const inner = document.createElement('div');
                    inner.className = 'picker-list-inner';
                    const empty = document.createElement('div');
                    empty.className = 'picker-empty';
                    empty.textContent = 'Noch kein Finale erstellt';
                    inner.appendChild(empty);
                    pickerList.appendChild(inner);
                    resultsLabel.textContent = '';
                    return;
                }

                let total = 0;
                groups.forEach(([gid, entries], idx) => {
                    const groupName = entries[0].startGroup?.name ?? 'Finale';
                    const panel = document.createElement('div');
                    panel.className = 'finale-panel' + (idx === 0 ? ' open' : '');

                    const hdr = document.createElement('div');
                    hdr.className = 'finale-panel-header';
                    hdr.innerHTML =
                        `<span class="finale-panel-title">Finale – ${groupName}</span>` +
                        `<span class="finale-panel-count">${entries.length}</span>` +
                        `<span class="finale-panel-chevron">▼</span>`;
                    hdr.addEventListener('click', () => panel.classList.toggle('open'));
                    panel.appendChild(hdr);

                    const body = document.createElement('div');
                    body.className = 'finale-panel-body picker-list-inner';
                    body.style.borderRadius = '0';
                    body.style.border = 'none';

                    for (const entry of [...entries].reverse()) {
                        const starter = entry.starter;
                        const finalRuns = finalRunCounts[entry.startNumber] ?? 0;
                        const finalTotal = CONFIG.finalRuns ?? '?';
                        const finalDone = CONFIG.finalRuns != null && finalRuns >= CONFIG.finalRuns;
                        const excluded = starter?.status === 'removed' || starter?.status === 'disqualified';
                        const badgeColor = finalDone ? 'var(--green)' : finalRuns > 0 ? 'var(--accent)' : 'var(--muted)';
                        const item = document.createElement('div');
                        item.className = 'picker-item' +
                            (entry.startNumber === selected ? ' selected' : '') +
                            (finalDone || excluded ? ' done' : '');
                        item.innerHTML =
                            `<span class="picker-item-num" style="min-width:1.5rem;color:var(--muted)">${entry.finalStartNumber}</span>` +
                            `<span class="picker-item-num">${entry.startNumber}</span>` +
                            `<span class="picker-item-name">` +
                            `<span class="picker-item-first">${starter?.firstName ?? ''}</span>` +
                            `<span class="picker-item-last">${starter?.lastName ?? entry.startNumber}</span>` +
                            `</span>` +
                            (excluded
                                ? `<span class="picker-item-runs" style="color:var(--muted)">${starter.status === 'disqualified' ? 'DSQ' : 'Entfernt'}</span>`
                                : `<span class="picker-item-runs" style="color:${badgeColor}">${finalRuns}/${finalTotal}</span>`);
                        if (!finalDone && !excluded) {
                            item.addEventListener('click', () => {
                                selected = entry.startNumber;
                                selectedFinalNumber = entry.finalStartNumber;
                                if (display) display.textContent = entry.startNumber;
                                setStartBtn(entry.startNumber, entry.finalStartNumber);
                                renderList('');
                            });
                        }
                        body.appendChild(item);
                        total++;
                    }
                    panel.appendChild(body);
                    pickerList.appendChild(panel);
                });
                resultsLabel.textContent = `${total} Finalisten`;
                return;
            }

            // ── Quali mode ──
            const term = filter.trim();
            const finalGroupIds = new Set(Object.keys(finalEntriesByGroup).filter(gid => finalEntriesByGroup[gid].length > 0));
            let matches = START_NUMBERS.filter(n => String(n).includes(term));

            // Exclude finalized groups
            if (finalGroupIds.size > 0) {
                matches = matches.filter(n => {
                    const s = STARTERS.find(x => x.startNumber === n);
                    return !s?.startGroup?.objectId || !finalGroupIds.has(s.startGroup.objectId);
                });
            }

            // Split done / active
            if (CONFIG.qualiRuns != null) {
                if (filterDone) {
                    matches = matches.filter(n => (runCounts[n] ?? 0) >= CONFIG.qualiRuns);
                } else {
                    matches = matches.filter(n => (runCounts[n] ?? 0) < CONFIG.qualiRuns);
                }
            }

            if (filterGroup !== null) {
                matches = matches.filter(n => {
                    const s = STARTERS.find(x => x.startNumber === n);
                    return s?.startGroup?.objectId === filterGroup;
                });
            }
            if (filterRuns !== null) {
                matches = matches.filter(n => (runCounts[n] ?? 0) === filterRuns);
            }

            const total = (filterGroup !== null || filterRuns !== null || filterDone)
                ? matches.length + ' von ' + START_NUMBERS.filter(n => String(n).includes(term)).length
                : matches.length;
            resultsLabel.textContent = term
                ? `${total} Ergebnis${matches.length !== 1 ? 'se' : ''}`
                : `${total} Starter`;

            const inner = document.createElement('div');
            inner.className = 'picker-list-inner';
            if (!matches.length) {
                const empty = document.createElement('div');
                empty.className = 'picker-empty';
                empty.textContent = 'Keine Startnummer gefunden';
                inner.appendChild(empty);
                pickerList.appendChild(inner);
                return;
            }
            for (const num of matches) {
                const starter = STARTERS.find(s => s.startNumber === num);
                const runs = runCounts[num] ?? 0;
                const groupClosed = starter?.startGroup?.objectId && closedGroups.has(starter.startGroup.objectId);
                const done = CONFIG.qualiRuns != null && runs >= CONFIG.qualiRuns;
                const excluded = starter?.status === 'removed' || starter?.status === 'disqualified';
                const item = document.createElement('div');
                item.className = 'picker-item' + (num === selected ? ' selected' : '') + ((done || groupClosed || excluded) ? ' done' : '');
                if (starter?.firstName || starter?.lastName) {
                    item.innerHTML =
                        `<span class="picker-item-num">${num}</span>` +
                        `<span class="picker-item-name">` +
                        `<span class="picker-item-first">${starter.firstName ?? ''}</span>` +
                        `<span class="picker-item-last">${starter.lastName ?? ''}</span>` +
                        `</span>` +
                        (starter.startGroup ? `<span class="picker-item-group">${starter.startGroup.name ?? ''}</span>` : '') +
                        (done
                            ? `<span class="picker-item-done-badge">✓ Fertig</span>`
                            : groupClosed
                                ? `<span class="picker-item-done-badge">🔒 Quali zu</span>`
                                : excluded
                                    ? `<span class="picker-item-done-badge">${starter.status === 'disqualified' ? 'DSQ' : 'Entfernt'}</span>`
                                    : (runs > 0 ? `<span class="picker-item-runs">${runs}×</span>` : ''));
                } else {
                    item.textContent = num;
                }
                if (!done && !groupClosed && !excluded) {
                    item.addEventListener('click', () => {
                        selected = num;
                        if (display) display.textContent = num;
                        setStartBtn(num);
                        filterInput.value = '';
                        renderList('');
                    });
                }
                inner.appendChild(item);
            }
            pickerList.appendChild(inner);
        }

        function setStartBtn(num, finalNum) {
            startBtn.style.background = '';
            startBtn.style.color = '';
            if (num === null) {
                startBtn.innerHTML = 'Starter auswählen';
                startBtn.disabled = true;
                clearBtn.disabled = true;
            } else if (finalNum != null) {
                startBtn.innerHTML =
                    `<span style="font-size:1.3rem">✓</span> Jetzt starten` +
                    ` <span class="badge" style="opacity:0.6">#${num}</span>` +
                    ` <span class="badge">Final ${finalNum}.</span>`;
                startBtn.disabled = false;
                clearBtn.disabled = false;
            } else {
                startBtn.innerHTML = `<span style="font-size:1.3rem">✓</span> Jetzt starten <span class="badge">${num}</span>`;
                startBtn.disabled = false;
                clearBtn.disabled = false;
            }
        }

        function renderJuryGrid() {
            const grid = document.getElementById('jury-grid');
            const nextBtn = document.getElementById('next-btn');
            const label = document.getElementById('waiting-label');
            const allScored = scoredBy.size >= JUDGE_COUNT();

            const chip = document.getElementById('run-chip');
            chip.textContent = `Lauf ${activeRunNumber}`;
            chip.style.display = '';
            label.textContent = allScored ? 'Alle Wertungen eingegangen' : 'Warte auf Wertungen';
            nextBtn.style.display = allScored ? '' : 'none';

            grid.innerHTML = '';
            for (const name of JUDGE_NAMES()) {
                const s = juryScores[name];
                const card = document.createElement('div');
                card.className = 'jcard' + (s ? ' scored' : '');

                const dot = document.createElement('div');
                dot.className = 'presence-dot' + (onlineJudges.has(name) ? ' online' : '');
                const hdr = document.createElement('div');
                hdr.className = 'jcard-header';
                hdr.appendChild(dot);
                hdr.appendChild(document.createTextNode(name));
                card.appendChild(hdr);

                if (s) {
                    const scoreGrid = document.createElement('div');
                    scoreGrid.className = 'jcard-scores';
                    CONFIG.criteria.forEach(c => {
                        const col = document.createElement('div');
                        col.className = 'jcard-crit';
                        col.innerHTML =
                            `<div class="jcard-crit-label">${c.shortLabel}</div>` +
                            `<div class="jcard-crit-val">${s[c.key] ?? '—'}</div>`;
                        scoreGrid.appendChild(col);
                    });
                    card.appendChild(scoreGrid);

                    const div = document.createElement('div');
                    div.className = 'jcard-divider';
                    card.appendChild(div);

                    const total = document.createElement('div');
                    total.className = 'jcard-total';
                    const judgeTotal = CONFIG.criteria.reduce((a, c) => a + (s[c.key] ?? 0), 0);
                    total.innerHTML =
                        `<span class="jcard-total-label">Total</span>` +
                        `<span class="jcard-total-val">${judgeTotal}</span>`;
                    card.appendChild(total);
                } else {
                    const pending = document.createElement('div');
                    pending.className = 'jcard-pending';
                    pending.textContent = 'Ausstehend';
                    card.appendChild(pending);
                }

                grid.appendChild(card);
            }
        }

        function enterWaitingForScores(startNumber, isRestore = false) {
            activeStarter = startNumber;
            activeRunNumber = mode === 'finale'
                ? (finalRunCounts[startNumber] ?? 0) + 1
                : (runCounts[startNumber] ?? 0) + 1;
            scoredBy = new Set();
            juryScores = {};
            const runStartedAt = new Date(Date.now() - 10000); // 10s tolerance for client/server clock drift

            const starter = STARTERS.find(s => s.startNumber === startNumber);
            const name = starter ? `${starter.firstName ?? ''} ${starter.lastName ?? ''}`.trim() : String(startNumber);
            document.getElementById('waiting-name').textContent = `#${startNumber}  ${name}`;
            document.getElementById('waiting-overlay').classList.remove('hidden');
            document.getElementById('picker-section').style.display = 'none';
            renderJuryGrid();

            if (scoreWs) scoreWs.close();
            const _subscribeScores = () => {
                scoreWs = ParseAPI.subscribeJuryScores(startNumber, score => {
                    if (score.judgeName) {
                        scoredBy.add(score.judgeName);
                        juryScores[score.judgeName] = score;
                    }
                    renderJuryGrid();
                });
                scoreWs.addEventListener('close', () => {
                    if (activeStarter === startNumber) {
                        setTimeout(_subscribeScores, 3000);
                        ParseAPI.fetchJuryScores(startNumber).then(existing => {
                            existing.forEach(s => {
                                const createdAt = new Date(s.createdAt?.iso ?? s.createdAt);
                                if (s.judgeName && createdAt >= runStartedAt) {
                                    scoredBy.add(s.judgeName);
                                    juryScores[s.judgeName] = s;
                                }
                            });
                            renderJuryGrid();
                        }).catch(() => {});
                    }
                });
            };
            _subscribeScores();

            ParseAPI.fetchJuryScores(startNumber).then(existing => {
                existing.forEach(s => {
                    const matchesRun = s.runNumber != null
                        ? Number(s.runNumber) === activeRunNumber
                        : new Date(s.createdAt?.iso ?? s.createdAt) >= runStartedAt;
                    if (s.judgeName && (isRestore || matchesRun)) {
                        scoredBy.add(s.judgeName);
                        juryScores[s.judgeName] = s;
                    }
                });
                renderJuryGrid();
            }).catch(() => { });
        }

        let _toastTimer = null;
        function showToast(msg, durationMs = 3500) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.display = '';
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => { el.style.display = 'none'; }, durationMs);
        }

        function exitWaitingForScores(aborted = false) {
            if (scoreWs) { scoreWs.close(); scoreWs = null; }
            const completedStarter = activeStarter;
            const completedRun = activeRunNumber;
            if (aborted && completedStarter != null && completedRun != null) {
                ParseAPI.deleteQualiRun(completedStarter, completedRun).catch(() => {});
            }
            if (!aborted && completedStarter != null) {
                if (mode === 'finale') {
                    finalRunCounts[completedStarter] = (finalRunCounts[completedStarter] ?? 0) + 1;
                } else {
                    runCounts[completedStarter] = (runCounts[completedStarter] ?? 0) + 1;
                    drawerRunCounts[completedStarter] = runCounts[completedStarter];
                }
            }
            ParseAPI.clearActiveStarter().catch(() => {});
            activeStarter = null;
            juryScores = {};
            filterDone = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('run-chip').style.display = 'none';
            document.getElementById('waiting-overlay').classList.add('hidden');
            document.getElementById('picker-section').style.display = '';
            selected = null;
            selectedFinalNumber = null;
            if (display) display.textContent = '—';
            setStartBtn(null); Promise.all([
                ParseAPI.fetchScoreCountByStarter(),
                ParseAPI.fetchFinalScoreCountByStarter(),
            ]).then(([m, fm]) => { runCounts = m; finalRunCounts = fm; drawerRunCounts = m; renderFilterChips(); renderList(filterInput.value); }).catch(() => { });
            renderList(filterInput.value);

            // Auto-transition: if all starters in the group finished quali, close + create final
            if (mode === 'quali' && completedStarter != null && CONFIG.qualiRuns != null) {
                const completedStarterObj = STARTERS.find(s => s.startNumber === completedStarter);
                const gid = completedStarterObj?.startGroup?.objectId;
                if (gid && !closedGroups.has(gid)) {
                    const groupStarters = STARTERS.filter(s =>
                        s.startGroup?.objectId === gid &&
                        s.status !== 'removed' && s.status !== 'disqualified'
                    );
                    const allDone = groupStarters.length > 0 && groupStarters.every(s =>
                        (runCounts[s.startNumber] ?? 0) >= CONFIG.qualiRuns
                    );
                    if (allDone) {
                        const groupName = completedStarterObj.startGroup?.name ?? 'Gruppe';
                        const group = drawerGroups.find(g => g.objectId === gid);
                        if (group) {
                            // show confirmation popup instead of firing immediately
                            document.getElementById('final-confirm-title').textContent =
                                `${groupName} – Quali abgeschlossen`;
                            document.getElementById('final-confirm-msg').textContent =
                                `Alle Starter haben die erforderlichen Qualifikationsläufe absolviert. Finale jetzt erstellen?`;
                            const overlay = document.getElementById('final-confirm-overlay');
                            overlay.style.display = 'flex';
                            _pendingFinalGroup = { gid, groupName, group };
                        }
                    }
                }
            }
        }

        filterInput.addEventListener('input', () => renderList(filterInput.value));
        clearBtn.addEventListener('click', clearSelection);
        document.getElementById('next-btn').addEventListener('click', () => exitWaitingForScores(false));
        document.getElementById('abort-btn').addEventListener('click', () => exitWaitingForScores(true));

        function setMode(m) {
            mode = m;
            document.getElementById('mode-quali').classList.toggle('active', m === 'quali');
            document.getElementById('mode-finale').classList.toggle('active', m === 'finale');
            document.querySelector('.picker-input-wrap').style.display = m === 'quali' ? '' : 'none';
            if (m === 'quali') {
                renderFilterChips();
                document.getElementById('filter-chips-finale').style.display = 'none';
            } else {
                document.getElementById('filter-chips-groups').style.display = 'none';
                document.getElementById('filter-chips-runs').style.display = 'none';
                filterFinalGroup = null;
                renderFinalChips();
            }
            clearSelection();
            renderList('');
        }

        document.getElementById('mode-quali').addEventListener('click', () => setMode('quali'));
        document.getElementById('mode-finale').addEventListener('click', () => setMode('finale'));

        // ── Verwaltung drawer ──
        let drawerGroups = [];
        let drawerStarters = [];
        let drawerRunCounts = {};
        let finalEntriesByGroup = {}; // groupObjectId → sorted FinalEntry[]
        let mode = 'quali'; // 'quali' | 'finale'

        async function refreshFinalEntries() {
            try {
                const all = await ParseAPI.fetchAllFinalEntries();
                finalEntriesByGroup = {};
                for (const e of all) {
                    const gid = e.startGroup?.objectId ?? '__none__';
                    if (!finalEntriesByGroup[gid]) finalEntriesByGroup[gid] = [];
                    finalEntriesByGroup[gid].push(e);
                }
                const hasFinals = Object.values(finalEntriesByGroup).some(e => e.length > 0);
                document.getElementById('mode-toggle').style.display = hasFinals ? '' : 'none';
                renderFilterChips();
                if (mode === 'finale') renderFinalChips();
                renderList(filterInput.value);
            } catch (_) { }
        }

        function openDrawer() {
            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawer-overlay').classList.add('open');
            document.getElementById('drawer-btn').classList.add('open');
            renderDrawer();
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
            document.getElementById('drawer-btn').classList.remove('open');
            _settingsDraft = null;
        }

        document.getElementById('drawer-btn').addEventListener('click', () => {
            document.getElementById('drawer').classList.contains('open') ? closeDrawer() : openDrawer();
        });
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
        document.getElementById('drawer-close').addEventListener('click', closeDrawer);

        document.getElementById('final-ready-btn').addEventListener('click', () => {
            document.getElementById('final-ready-overlay').style.display = 'none';
            setMode('finale');
        });

        document.getElementById('final-confirm-cancel').addEventListener('click', () => {
            document.getElementById('final-confirm-overlay').style.display = 'none';
            _pendingFinalGroup = null;
        });

        document.getElementById('final-confirm-ok').addEventListener('click', async () => {
            const confirmBtn = document.getElementById('final-confirm-ok');
            if (confirmBtn.disabled) return;
            confirmBtn.disabled = true;
            document.getElementById('final-confirm-overlay').style.display = 'none';
            if (!_pendingFinalGroup) return;
            const { gid, groupName, group } = _pendingFinalGroup;
            _pendingFinalGroup = null;
            showToast(`🏁 ${groupName}: Finale wird erstellt …`, 5000);
            try {
                await ParseAPI.updateStartGroupQualiClosed(gid, true);
                group.qualiClosed = true;
                closedGroups.add(gid);
                const result = await ParseAPI.createFinal(gid);
                await refreshFinalEntries();
                renderDrawer(); renderFilterChips(); renderList(filterInput.value);
                document.getElementById('toast').style.display = 'none';
                document.getElementById('final-ready-title').textContent = `${groupName} – Finale bereit`;
                document.getElementById('final-ready-msg').textContent =
                    `${result.created} Finalisten wurden ermittelt.`;
                document.getElementById('final-ready-overlay').style.display = 'flex';
            } catch (_) {
                showToast(`✕ Fehler beim Erstellen des Finals`);
            }
        });

        async function drawerSetStatus(starter, status) {
            const newStatus = starter.status === status ? 'active' : status;
            try {
                await ParseAPI.updateStarterStatus(starter.objectId, newStatus);
                starter.status = newStatus;
                renderDrawer();
                renderList(filterInput.value);
                renderFilterChips();
            } catch (_) { }
        }

        async function drawerToggleQualiClosed(group) {
            const newVal = !group.qualiClosed;
            try {
                await ParseAPI.updateStartGroupQualiClosed(group.objectId, newVal);
                group.qualiClosed = newVal;
                closedGroups = newVal
                    ? new Set([...closedGroups, group.objectId])
                    : new Set([...closedGroups].filter(id => id !== group.objectId));
                renderDrawer();
                renderFilterChips();
                renderList(filterInput.value);
                if (newVal) {
                    // Closing → create final automatically
                    showToast(`🏁 ${group.name}: Finale wird erstellt …`, 5000);
                    try {
                        const result = await ParseAPI.createFinal(group.objectId);
                        await refreshFinalEntries();
                        renderDrawer();
                        showToast(`✓ ${group.name}: ${result.created} Finalisten ermittelt`, 4000);
                    } catch (_) {
                        showToast(`✕ Fehler beim Erstellen des Finals`);
                    }
                }
            } catch (_) { }
        }

        // Returns one of 6 status strings for a group, mirroring groupMode() in results.html
        function drawerGroupStatus(gid) {
            const isClosed = closedGroups.has(gid);
            const groupStarters = drawerStarters.filter(s =>
                s.startGroup?.objectId === gid && s.status !== 'removed' && s.status !== 'disqualified'
            );
            if (!isClosed) {
                const anyRun = groupStarters.some(s => (runCounts[s.startNumber] ?? 0) > 0);
                if (!anyRun) return 'quali-idle';
                if (CONFIG.qualiRuns == null) return 'quali-running';
                const allDone = groupStarters.length > 0 && groupStarters.every(s =>
                    (runCounts[s.startNumber] ?? 0) >= CONFIG.qualiRuns
                );
                return allDone ? 'quali-done' : 'quali-running';
            }
            // closed → final phase
            const finalistNums = new Set((finalEntriesByGroup[gid] ?? []).map(fe => fe.startNumber ?? fe.starter?.startNumber));
            if (!finalistNums.size) return 'final-idle';
            const anyFinalRun = [...finalistNums].some(n => (finalRunCounts[n] ?? 0) > 0);
            if (!anyFinalRun) return 'final-idle';
            if (CONFIG.finalRuns == null) return 'final-running';
            const allFinalDone = [...finalistNums].every(n => (finalRunCounts[n] ?? 0) >= CONFIG.finalRuns);
            return allFinalDone ? 'final-done' : 'final-running';
        }

        function renderDrawer() {
            const body = document.getElementById('drawer-body');
            const openIds = new Set(
                [...body.querySelectorAll('.drawer-panel.open')].map(el => el.dataset.gid)
            );
            body.innerHTML = '';

            // Admin functions (Event-Einstellungen, Drucken) moved to starterMaintenance.html

            const grouped = {};
            const noGroup = [];
            for (const s of drawerStarters) {
                const gid = s.startGroup?.objectId;
                if (gid) { if (!grouped[gid]) grouped[gid] = []; grouped[gid].push(s); }
                else noGroup.push(s);
            }

            const renderGroup = (starters, group) => {
                const gid = group?.objectId ?? '__none__';
                const isClosed = group ? (closedGroups.has(gid)) : false;
                const doneCount = starters.filter(s =>
                    s.status !== 'removed' && s.status !== 'disqualified' && CONFIG.qualiRuns != null &&
                    (drawerRunCounts[s.startNumber] ?? 0) >= CONFIG.qualiRuns
                ).length;
                const activeCount = starters.filter(s => s.status !== 'removed' && s.status !== 'disqualified').length;

                const panel = document.createElement('div');
                panel.className = 'drawer-panel' + (openIds.has(gid) ? ' open' : '');
                panel.dataset.gid = gid;

                // Header
                const hdr = document.createElement('div');
                hdr.className = 'drawer-panel-hdr';

                const statusLabels = {
                    'quali-idle': 'Quali nicht gestartet',
                    'quali-running': 'Quali läuft',
                    'quali-done': 'Quali fertig',
                    'final-idle': 'Finale nicht gestartet',
                    'final-running': 'Final läuft',
                    'final-done': 'Final beendet',
                };
                const status = group ? drawerGroupStatus(gid) : null;
                const statusBadge = status
                    ? `<span class="group-status-badge ${status}">${statusLabels[status]}</span>`
                    : '';

                hdr.innerHTML =
                    `<div class="drawer-panel-title${isClosed ? ' closed' : ''}">${(isClosed ? '🔒 ' : '') + (group?.name ?? 'Keine Gruppe')}</div>` +
                    statusBadge +
                    `<span class="drawer-panel-count">${doneCount}/${activeCount}</span>`;

                const chevron = document.createElement('span');
                chevron.className = 'drawer-panel-chevron';
                chevron.textContent = '▼';
                hdr.appendChild(chevron);
                hdr.addEventListener('click', () => panel.classList.toggle('open'));
                panel.appendChild(hdr);

                // Body
                const panelBody = document.createElement('div');
                panelBody.className = 'drawer-panel-body';

                for (const s of starters) {
                    const runs = drawerRunCounts[s.startNumber] ?? 0;
                    const done = CONFIG.qualiRuns != null && runs >= CONFIG.qualiRuns;
                    const status = s.status ?? 'active';

                    const item = document.createElement('div');
                    item.className = 'drawer-item' +
                        (status === 'disqualified' ? ' disqualified' : '') +
                        (status === 'removed' ? ' removed' : '');

                    const num = document.createElement('div');
                    num.className = 'drawer-item-num';
                    num.textContent = s.startNumber;

                    const name = document.createElement('div');
                    name.className = 'drawer-item-name';
                    name.innerHTML =
                        `<span class="drawer-item-first">${s.firstName ?? ''}</span>` +
                        `<span class="drawer-item-last">${s.lastName ?? s.startNumber}</span>`;

                    const badge = document.createElement('span');
                    badge.className = 'drawer-item-badge';
                    if (status === 'disqualified') { badge.textContent = 'DSQ'; badge.classList.add('dq'); }
                    else if (status === 'removed') { badge.textContent = 'Entfernt'; badge.classList.add('removed'); }
                    else if (done) { badge.textContent = '✓'; badge.classList.add('done'); }
                    else if (runs > 0) { badge.textContent = `${runs}×`; badge.classList.add('runs'); }

                    const actions = document.createElement('div');
                    actions.className = 'drawer-item-actions';

                    const dqBtn = document.createElement('button');
                    dqBtn.className = 'dact' + (status === 'disqualified' ? ' dq' : '');
                    dqBtn.textContent = status === 'disqualified' ? '↺' : 'DSQ';
                    dqBtn.title = status === 'disqualified' ? 'Disqualifikation aufheben' : 'Disqualifizieren';
                    dqBtn.addEventListener('click', () => drawerSetStatus(s, 'disqualified'));
                    actions.appendChild(dqBtn);

                    const rmBtn = document.createElement('button');
                    rmBtn.className = 'dact' + (status === 'removed' ? ' rm' : '');
                    rmBtn.textContent = status === 'removed' ? '↺' : '✕';
                    rmBtn.title = status === 'removed' ? 'Starter wiederherstellen' : 'Starter entfernen';
                    rmBtn.addEventListener('click', () => drawerSetStatus(s, 'removed'));
                    actions.appendChild(rmBtn);

                    // Delete-run button: only when group is closed, starter has runs, and no final scores exist yet
                    const groupHasFinalScores = Object.values(finalRunCounts).some((_, idx) => {
                        const num = Object.keys(finalRunCounts)[idx];
                        const st = STARTERS.find(x => x.startNumber === Number(num));
                        return st?.startGroup?.objectId === gid && finalRunCounts[num] > 0;
                    });
                    if (runs > 0 && !groupHasFinalScores && status === 'active') {
                        const delRunBtn = document.createElement('button');
                        delRunBtn.className = 'dact';
                        delRunBtn.textContent = `−${runs}×`;
                        delRunBtn.title = `Lauf ${runs} löschen und Qualifikation wieder öffnen`;
                        delRunBtn.addEventListener('click', async () => {
                            delRunBtn.disabled = true;
                            try {
                                await ParseAPI.deleteQualiRun(s.startNumber, runs);
                                runCounts[s.startNumber] = runs - 1;
                                drawerRunCounts[s.startNumber] = runs - 1;
                                // Reopen group if it was closed
                                const grp = drawerGroups.find(g => g.objectId === gid);
                                if (grp && grp.qualiClosed) {
                                    await ParseAPI.updateStartGroupQualiClosed(gid, false);
                                    grp.qualiClosed = false;
                                    closedGroups.delete(gid);
                                }
                                renderDrawer(); renderFilterChips(); renderList(filterInput.value);
                                showToast(`Lauf ${runs} von #${s.startNumber} gelöscht`);
                            } catch (_) { delRunBtn.disabled = false; }
                        });
                        actions.appendChild(delRunBtn);
                    }

                    item.appendChild(num);
                    item.appendChild(name);
                    item.appendChild(badge);
                    item.appendChild(actions);
                    panelBody.appendChild(item);
                }

                panel.appendChild(panelBody);

                // Footer: Quali schließen/öffnen + Finale erstellen (only for named groups)
                if (group) {
                    const hasFinalEntries = (finalEntriesByGroup[gid] ?? []).length > 0;

                    const footer = document.createElement('div');
                    footer.className = 'drawer-panel-footer';

                    const qualiBtn = document.createElement('button');
                    qualiBtn.className = 'quali-toggle';
                    qualiBtn.innerHTML = CONFIG.qualiRuns === null
                        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> Quali schließen`
                        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Finale vorzeitig starten`;
                    const groupStatus = drawerGroupStatus(gid);
                    qualiBtn.style.display = (isClosed || groupStatus === 'quali-idle') ? 'none' : '';
                    qualiBtn.disabled = activeStarter !== null;
                    qualiBtn.title = activeStarter !== null ? 'Erst den laufenden Starter abschliessen' : '';
                    qualiBtn.addEventListener('click', () => {
                        qualiBtn.disabled = true;
                        drawerToggleQualiClosed(group);
                    });
                    footer.appendChild(qualiBtn);

                    panel.appendChild(footer);
                }

                body.appendChild(panel);
            };

            for (const group of drawerGroups) renderGroup(grouped[group.objectId] ?? [], group);
            if (noGroup.length) renderGroup(noGroup, null);
        }

        // ── Print ──
        // Shared score-grouping helpers (same logic as results.html)
        function _calcJudgeTotal(s) {
            return Math.round(CONFIG.criteria.reduce((a, c) =>
                a + (s[c.key] ?? 0) * ((c.weight ?? (100 / CONFIG.criteria.length)) / 100), 0));
        }

        function _deduplicateByJudge(scores) {
            const latest = new Map();
            for (const s of scores) latest.set(s.judgeName, s);
            return [...latest.values()];
        }

        function _groupByRunNumber(scores) {
            if (!scores.length) return [];
            const byRun = {};
            for (const s of scores) {
                const r = s.runNumber ?? 1;
                if (!byRun[r]) byRun[r] = [];
                byRun[r].push(s);
            }
            const judgeRepeatFallback = () => {
                const runs = [], seen = new Set();
                let chunk = [];
                for (const sc of scores) {
                    if (seen.has(sc.judgeName)) {
                        if (chunk.length) runs.push(chunk);
                        chunk = [sc]; seen.clear(); seen.add(sc.judgeName);
                    } else { chunk.push(sc); seen.add(sc.judgeName); }
                }
                if (chunk.length) runs.push(chunk);
                return runs.map(c => {
                    const deduped = _deduplicateByJudge(c);
                    return { scores: deduped, total: deduped.reduce((a, s) => a + _calcJudgeTotal(s), 0) };
                });
            };
            const hasByRun = scores.some(s => s.runNumber != null);
            if (!hasByRun) return judgeRepeatFallback();
            return Object.keys(byRun).map(Number).sort((a, b) => a - b)
                .map(r => {
                    const deduped = _deduplicateByJudge(byRun[r]);
                    return { scores: deduped, total: deduped.reduce((a, s) => a + _calcJudgeTotal(s), 0) };
                });
        }

        async function init() {
            // Session required — login and event selection happen on index.html
            if (!ParseAPI.getSessionUser()) {
                location.replace('../index.html');
                return;
            }

            // Avatar
            const _user = ParseAPI.getSessionUser();
            document.getElementById('avatar-btn').textContent = _user[0].toUpperCase();
            document.getElementById('avatar-username').textContent = _user;
            document.getElementById('avatar-btn').addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('avatar-menu').classList.toggle('open');
            });
            document.addEventListener('click', () => document.getElementById('avatar-menu').classList.remove('open'));
            document.getElementById('avatar-logout').addEventListener('click', async () => {
                await ParseAPI.logout();
                location.replace('../index.html');
            });

            await Promise.all([ParseAPI.fetchEvent(), ParseAPI.fetchJudges()]).catch(() => { });
            document.title = `${CONFIG.eventName} – Startbereich`;

            // Start presence polling now that CONFIG.judgeTokens is populated from the live event
            refreshPresence();
            setInterval(refreshPresence, CONFIG.presencePollMs);
            ParseAPI.subscribePresence(refreshPresence);

            // Show event name + qualiRuns in header center
            const qualiRuns = CONFIG.qualiRuns;
            document.getElementById('event-label') && (document.getElementById('event-label').textContent = qualiRuns != null ? 'Event / Läufe' : 'Event');
            document.getElementById('event-display').textContent = CONFIG.eventName;
            const qualiEl = document.getElementById('quali-display');
            if (qualiRuns != null) {
                qualiEl.textContent = `${qualiRuns}× Qualifikation`;
                qualiEl.style.display = '';
            }
            const finalEl = document.getElementById('final-display');
            if (CONFIG.finalRuns != null) {
                finalEl.textContent = `${CONFIG.finalRuns}× Finale`;
                finalEl.style.display = '';
            }

            // Load start groups and subscribe to qualiClosed changes
            ParseAPI.fetchStartGroups().then(groups => {
                drawerGroups = groups;
                closedGroups = new Set(groups.filter(g => g.qualiClosed).map(g => g.objectId));
                renderFilterChips();
                renderList(filterInput.value);
            }).catch(() => { });

            ParseAPI.subscribeStartGroups(msg => {
                const sg = drawerGroups.find(g => g.objectId === msg.object?.objectId);
                if (sg && msg.object != null) {
                    sg.qualiClosed = msg.object.qualiClosed;
                    if (msg.object.qualiClosed) closedGroups.add(sg.objectId);
                    else closedGroups.delete(sg.objectId);
                    renderFilterChips();
                    renderList(filterInput.value);
                    if (document.getElementById('drawer').classList.contains('open')) renderDrawer();
                }
            });

            resultsLabel.textContent = 'Lade Starter …';
            try {
                [STARTERS, runCounts, finalRunCounts] = await Promise.all([
                    ParseAPI.fetchStarters(),
                    ParseAPI.fetchScoreCountByStarter(),
                    ParseAPI.fetchFinalScoreCountByStarter(),
                ]);
                START_NUMBERS = STARTERS.map(s => s.startNumber);
                drawerStarters = STARTERS;
                drawerRunCounts = runCounts;
            } catch (e) {
                resultsLabel.textContent = 'Fehler beim Laden';
            }

            // Load final entries and subscribe
            refreshFinalEntries();
            ParseAPI.subscribeFinalEntries(refreshFinalEntries);

            // Subscribe to starter changes (add/edit/delete from starterMaintenance)
            ParseAPI.subscribeStarters(async msg => {
                const updated = msg.object;
                if (msg.op === 'create') {
                    if (!STARTERS.find(s => s.objectId === updated.objectId)) {
                        STARTERS.push(updated);
                        START_NUMBERS = STARTERS.map(s => s.startNumber);
                        drawerStarters = STARTERS;
                    }
                } else if (msg.op === 'update') {
                    const idx = STARTERS.findIndex(s => s.objectId === updated.objectId);
                    if (idx !== -1) {
                        STARTERS[idx] = { ...STARTERS[idx], ...updated };
                        drawerStarters = STARTERS;
                    }
                } else if (msg.op === 'delete') {
                    STARTERS = STARTERS.filter(s => s.objectId !== updated.objectId);
                    START_NUMBERS = STARTERS.map(s => s.startNumber);
                    drawerStarters = STARTERS;
                }
                renderFilterChips();
                renderList(filterInput.value);
                if (document.getElementById('drawer').classList.contains('open')) renderDrawer();
            });

            renderFilterChips();
            renderList('');
            // Show picker immediately — presence overlay will hide it once judges are confirmed offline
            document.getElementById('picker-section').style.display = '';

            // Restore active starter if one is set (e.g. after page refresh)
            ParseAPI.fetchActiveStarter().then(active => {
                if (active?.startNumber != null && activeStarter === null) {
                    mode = active.phase === 'finale' ? 'finale' : 'quali';
                    enterWaitingForScores(String(active.startNumber), true);
                }
            }).catch(() => {});
        }

        init();

        startBtn.addEventListener('click', async () => {
            if (selected === null) return;
            startBtn.disabled = true;
            startBtn.innerHTML = '…';
            try {
                // Compute runNumber here, before the 800ms delay to enterWaitingForScores
                const phase = mode === 'finale' ? 'final' : 'quali';
                activeRunNumber = mode === 'finale'
                    ? (finalRunCounts[selected] ?? 0) + 1
                    : (runCounts[selected] ?? 0) + 1;
                // Clear any stale active starter before publishing the new one
                // Clear any stale active starter before publishing the new one
                await ParseAPI.clearActiveStarter().catch(() => {});
                await ParseAPI.publishActiveStarter(selected, activeRunNumber, phase);
                channel.postMessage({ startNumber: selected, runNumber: activeRunNumber, phase });
                startBtn.style.background = 'var(--green)';
                startBtn.style.color = '#000';
                startBtn.innerHTML = '✓ Gestartet';
                setTimeout(() => enterWaitingForScores(selected), 800);
            } catch (e) {
                startBtn.innerHTML = '✕ Fehler';
                startBtn.disabled = false;
            }
        });
    </script>

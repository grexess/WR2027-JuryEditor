                chevron.className = 'drawer-panel-chevron';
                chevron.textContent = '▼';
                hdr.appendChild(chevron);
                hdr.addEventListener('click', () => panel.classList.toggle('open'));
                panel.appendChild(hdr);

                // Body
                const panelBody = document.createElement('div');
                panelBody.className = 'drawer-panel-body';

                for (const s of starters) {
                    const runs = drawerRunCounts[s.startNumber] ?? 0;
                    const done = CONFIG.qualiRuns != null && runs >= CONFIG.qualiRuns;
                    const status = s.status ?? 'active';

                    const item = document.createElement('div');
                    item.className = 'drawer-item' +
                        (status === 'disqualified' ? ' disqualified' : '') +
                        (status === 'removed' ? ' removed' : '');

                    const num = document.createElement('div');
                    num.className = 'drawer-item-num';
                    num.textContent = s.startNumber;

                    const name = document.createElement('div');
                    name.className = 'drawer-item-name';
                    name.innerHTML =
                        `<span class="drawer-item-first">${s.firstName ?? ''}</span>` +
                        `<span class="drawer-item-last">${s.lastName ?? s.startNumber}</span>`;

                    const badge = document.createElement('span');
                    badge.className = 'drawer-item-badge';
                    if (status === 'disqualified') { badge.textContent = 'DSQ'; badge.classList.add('dq'); }
                    else if (status === 'removed') { badge.textContent = 'Weg'; badge.classList.add('removed'); }
                    else if (done) { badge.textContent = '✓'; badge.classList.add('done'); }
                    else if (runs > 0) { badge.textContent = `${runs}×`; badge.classList.add('runs'); }

                    const actions = document.createElement('div');
                    actions.className = 'drawer-item-actions';

                    const dqBtn = document.createElement('button');
                    dqBtn.className = 'dact' + (status === 'disqualified' ? ' dq' : '');
                    dqBtn.textContent = status === 'disqualified' ? '↺' : 'DSQ';
                    dqBtn.title = status === 'disqualified' ? 'Disqualifikation aufheben' : 'Disqualifizieren';
                    dqBtn.addEventListener('click', () => drawerSetStatus(s, 'disqualified'));
                    actions.appendChild(dqBtn);

                    const rmBtn = document.createElement('button');
                    rmBtn.className = 'dact' + (status === 'removed' ? ' rm' : '');
                    rmBtn.textContent = status === 'removed' ? '↺' : '✕';
                    rmBtn.title = status === 'removed' ? 'Starter wiederherstellen' : 'Starter entfernen';
                    rmBtn.addEventListener('click', () => drawerSetStatus(s, 'removed'));
                    actions.appendChild(rmBtn);

                    // Delete-run button: only when group is closed, starter has runs, and no final scores exist yet
                    const groupHasFinalScores = Object.values(finalRunCounts).some((_, idx) => {
                        const num = Object.keys(finalRunCounts)[idx];
                        const st = STARTERS.find(x => x.startNumber === Number(num));
                        return st?.startGroup?.objectId === gid && finalRunCounts[num] > 0;
                    });
                    if (runs > 0 && !groupHasFinalScores && status === 'active') {
                        const delRunBtn = document.createElement('button');
                        delRunBtn.className = 'dact';
                        delRunBtn.textContent = `−${runs}×`;
                        delRunBtn.title = `Lauf ${runs} löschen und Qualifikation wieder öffnen`;
                        delRunBtn.addEventListener('click', async () => {
                            delRunBtn.disabled = true;
                            try {
                                await ParseAPI.deleteQualiRun(s.startNumber, runs);
                                runCounts[s.startNumber] = runs - 1;
                                drawerRunCounts[s.startNumber] = runs - 1;
                                // Reopen group if it was closed
                                const grp = drawerGroups.find(g => g.objectId === gid);
                                if (grp && grp.qualiClosed) {
                                    await ParseAPI.updateStartGroupQualiClosed(gid, false);
                                    grp.qualiClosed = false;
                                    closedGroups.delete(gid);
                                }
                                renderDrawer(); renderFilterChips(); renderList(filterInput.value);
                                showToast(`Lauf ${runs} von #${s.startNumber} gelöscht`);
                            } catch (_) { delRunBtn.disabled = false; }
                        });
                        actions.appendChild(delRunBtn);
                    }

                    item.appendChild(num);
                    item.appendChild(name);
                    item.appendChild(badge);
                    item.appendChild(actions);
                    panelBody.appendChild(item);
                }

                panel.appendChild(panelBody);

                // Footer: Quali schließen/öffnen + Finale erstellen (only for named groups)
                if (group) {
                    const hasFinalEntries = (finalEntriesByGroup[gid] ?? []).length > 0;

                    const footer = document.createElement('div');
                    footer.className = 'drawer-panel-footer';

                    const qualiBtn = document.createElement('button');
                    qualiBtn.className = 'quali-toggle';
                    qualiBtn.innerHTML = CONFIG.qualiRuns === null
                        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> Quali schließen`
                        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Finale vorzeitig starten`;
                    const groupStatus = drawerGroupStatus(gid);
                    qualiBtn.style.display = (isClosed || groupStatus === 'quali-idle') ? 'none' : '';
                    qualiBtn.addEventListener('click', () => drawerToggleQualiClosed(group));
                    footer.appendChild(qualiBtn);

                    panel.appendChild(footer);
                }

                body.appendChild(panel);
            };

            for (const group of drawerGroups) renderGroup(grouped[group.objectId] ?? [], group);
            if (noGroup.length) renderGroup(noGroup, null);
        }

        // ── Print ──
        // Shared score-grouping helpers (same logic as results.html)
        function _groupByRunNumber(scores) {
            if (!scores.length) return [];
            const byRun = {};
            for (const s of scores) {
                const r = s.runNumber ?? 1;
                if (!byRun[r]) byRun[r] = [];
                byRun[r].push(s);
            }
            const judgeRepeatFallback = () => {
                const runs = [], seen = new Set();
                let chunk = [];
                for (const sc of scores) {
                    if (seen.has(sc.judgeName)) {
                        if (chunk.length) runs.push(chunk);
                        chunk = [sc]; seen.clear(); seen.add(sc.judgeName);
                    } else { chunk.push(sc); seen.add(sc.judgeName); }
                }
                if (chunk.length) runs.push(chunk);
                return runs.map(c => ({ scores: c, total: c.reduce((a, s) => a + (s.total ?? 0), 0) }));
            };
            const hasByRun = scores.some(s => s.runNumber != null);
            if (!hasByRun) return judgeRepeatFallback();
            return Object.keys(byRun).map(Number).sort((a, b) => a - b)
                .map(r => ({ scores: byRun[r], total: byRun[r].reduce((a, s) => a + (s.total ?? 0), 0) }));
        }

        function _phaseRuns(scores) {
            if (scores.some(s => s.phase != null)) {
                return {
                    qualiRuns: _groupByRunNumber(scores.filter(s => (s.phase ?? 'quali') === 'quali')),
                    finalRuns: _groupByRunNumber(scores.filter(s => s.phase === 'final')),
                };
            }
            const all = _groupByRunNumber(scores);
            const qc = CONFIG.qualiRuns ?? all.length;
            return { qualiRuns: all.slice(0, qc), finalRuns: all.slice(qc) };
        }

        async function printDoc(type, groupId) {
            // Fetch all needed data fresh
            const [allScores, allFinalEntries] = await Promise.all([
                ParseAPI.fetchAllJuryScores(),
                ParseAPI.fetchAllFinalEntries(),
            ]);

            const starters = STARTERS.length ? STARTERS : await ParseAPI.fetchStarters();
            const groups = drawerGroups.length ? drawerGroups : await ParseAPI.fetchStartGroups();

            // Determine which groups to print
            const targetGroups = groupId === '__all__'
                ? groups
                : groups.filter(g => g.objectId === groupId);

            const eventName = CONFIG.eventName ?? document.getElementById('event-display').textContent ?? 'WeRace';

            const criteria = CONFIG.criteria ?? [];

            // Build per-group sections
            let sectionsHtml = '';

            for (const group of targetGroups) {
                const gid = group.objectId;
                const groupStarters = starters.filter(s => s.startGroup?.objectId === gid && s.status !== 'removed');
                const finalistNums = new Set(
                    allFinalEntries.filter(fe => fe.startGroup?.objectId === gid)
                        .map(fe => fe.startNumber ?? fe.starter?.startNumber)
                );

                if (type === 'startlist') {
                    // a) Startliste Qualifikation
                    const sorted = [...groupStarters].sort((a, b) => a.startNumber - b.startNumber);
                    sectionsHtml += _printStartlist(group.name, sorted, eventName);

                } else if (type === 'quali-results') {
                    // b) Ergebnisliste Qualifikation
                    const rows = _buildQualiResults(groupStarters, allScores, finalistNums);
                    sectionsHtml += _printQualiResults(group.name, rows, criteria, eventName);

                } else if (type === 'final-startlist') {
                    // c) Startliste Finale
                    const finalEntries = allFinalEntries
                        .filter(fe => fe.startGroup?.objectId === gid)
                        .sort((a, b) => a.finalStartNumber - b.finalStartNumber);
                    sectionsHtml += _printFinalStartlist(group.name, finalEntries, eventName);

                } else if (type === 'final-results') {
                    // d) Ergebnisliste Finale
                    const rows = _buildFinalResults(groupStarters, allScores, allFinalEntries, gid, finalistNums);
                    sectionsHtml += _printFinalResults(group.name, rows, criteria, eventName);
                }
            }

            _openPrintWindow(sectionsHtml, eventName);
        }

        function _buildQualiResults(groupStarters, allScores, finalistNums) {
            const rows = [];
            for (const starter of groupStarters) {
                if (starter.status === 'disqualified') { rows.push({ starter, dq: true }); continue; }
                const scores = allScores.filter(s => s.startnumber === starter.startNumber);
                const { qualiRuns } = _phaseRuns(scores);
                if (!qualiRuns.length) { rows.push({ starter, noRuns: true }); continue; }
                const total = qualiRuns.reduce((a, r) => a + r.total, 0);
                const best = Math.max(...qualiRuns.map(r => r.total));
                const score = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? best : total;
                rows.push({ starter, qualiRuns, score, isFinal: finalistNums.has(starter.startNumber) });
            }
            rows.sort((a, b) => {
                if (a.dq || a.noRuns) return 1;
                if (b.dq || b.noRuns) return -1;
                return b.score - a.score;
            });
            return rows;
        }

        function _buildFinalResults(groupStarters, allScores, allFinalEntries, gid, finalistNums) {
            const rows = [];
            for (const starter of groupStarters) {
                if (!finalistNums.has(starter.startNumber)) continue;
                if (starter.status === 'disqualified') { rows.push({ starter, dq: true }); continue; }
                const scores = allScores.filter(s => s.startnumber === starter.startNumber);
                const { finalRuns } = _phaseRuns(scores);
                const fe = allFinalEntries.find(e =>
                    (e.startNumber ?? e.starter?.startNumber) === starter.startNumber && e.startGroup?.objectId === gid
                );
                const finalStartNum = fe?.finalStartNumber ?? '—';
                if (!finalRuns.length) { rows.push({ starter, finalStartNum, noRuns: true }); continue; }
                const total = finalRuns.reduce((a, r) => a + r.total, 0);
                const best = Math.max(...finalRuns.map(r => r.total));
                const score = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? best : total;
                rows.push({ starter, finalRuns, score, finalStartNum });
            }
            rows.sort((a, b) => {
                if (a.dq || a.noRuns) return 1;
                if (b.dq || b.noRuns) return -1;
                return b.score - a.score;
            });
            return rows;
        }

        function _printStartlist(groupName, starters, eventName) {
            const rows = starters.map((s, i) =>
                `<tr>
                    <td class="num">${s.startNumber}</td>
                    <td>${s.firstName ?? ''} ${s.lastName ?? ''}</td>
                    <td class="blank"></td>
                </tr>`
            ).join('');
            return `<section>
                <div class="doc-header">
                    <span class="doc-event">${_esc(eventName)}</span>
                    <span class="doc-type">Startliste Qualifikation</span>
                    <span class="doc-group">${_esc(groupName)}</span>
                </div>
                <table>
                    <thead><tr><th>Nr.</th><th>Name</th><th>Notiz</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="doc-footer">${starters.length} Starter · ${_nowStr()}</div>
            </section>`;
        }

        function _printQualiResults(groupName, rows, criteria, eventName) {
            const scoreLabel = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Summe';
            const qualiRuns = CONFIG.qualiRuns ?? '?';
            const tableRows = rows.map((r, i) => {
                if (r.dq) return `<tr class="excluded"><td class="rank">—</td><td class="num">${r.starter.startNumber}</td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td colspan="3" class="dq-cell">DSQ</td></tr>`;
                if (r.noRuns) return `<tr class="excluded"><td class="rank">—</td><td class="num">${r.starter.startNumber}</td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td colspan="3" class="muted">kein Lauf</td></tr>`;
                const runScores = r.qualiRuns.map((run, ri) => _runPill(run, ri, criteria)).join('');
                return `<tr>
                    <td class="rank">${i + 1}${r.isFinal ? '<span class="fin-badge">F</span>' : ''}</td>
                    <td class="num">${r.starter.startNumber}</td>
                    <td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td>
                    <td class="runs-cell">${runScores}</td>
                    <td class="score">${r.score}</td>
                </tr>`;
            }).join('');
            return `<section>
                <div class="doc-header">
                    <span class="doc-event">${_esc(eventName)}</span>
                    <span class="doc-type">Ergebnisse Qualifikation</span>
                    <span class="doc-group">${_esc(groupName)}</span>
                </div>
                <table>
                    <thead><tr><th>Platz</th><th>Nr.</th><th>Name</th><th>Läufe (${qualiRuns}×)</th><th>${_esc(scoreLabel)}</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="doc-footer">${rows.filter(r => !r.dq && !r.noRuns).length} Gewertet · ${_nowStr()}</div>
            </section>`;
        }

        function _printFinalStartlist(groupName, entries, eventName) {
            const rows = entries.map(e => {
                const starter = e.starter ?? STARTERS.find(s => s.startNumber === e.startNumber);
                const name = starter ? `${starter.firstName ?? ''} ${starter.lastName ?? ''}` : `#${e.startNumber}`;
                return `<tr>
                    <td class="num">${e.finalStartNumber}</td>
                    <td class="num muted">${e.startNumber ?? '—'}</td>
                    <td>${_esc(name.trim())}</td>
                    <td class="blank"></td>
                </tr>`;
            }).join('');
            return `<section>
                <div class="doc-header">
                    <span class="doc-event">${_esc(eventName)}</span>
                    <span class="doc-type">Startliste Finale</span>
                    <span class="doc-group">${_esc(groupName)}</span>
                </div>
                <table>
                    <thead><tr><th>Final-Nr.</th><th>Start-Nr.</th><th>Name</th><th>Notiz</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="doc-footer">${entries.length} Finalisten · ${_nowStr()}</div>
            </section>`;
        }

        function _printFinalResults(groupName, rows, criteria, eventName) {
            const scoreLabel = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Summe';
            const finalRuns = CONFIG.finalRuns ?? '?';
            const tableRows = rows.map((r, i) => {
                if (r.dq) return `<tr class="excluded"><td class="rank">—</td><td class="num">${r.finalStartNum}</td><td class="num muted">${r.starter.startNumber}</td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td colspan="2" class="dq-cell">DSQ</td></tr>`;
                if (r.noRuns) return `<tr class="excluded"><td class="rank">—</td><td class="num">${r.finalStartNum}</td><td class="num muted">${r.starter.startNumber}</td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td colspan="2" class="muted">kein Lauf</td></tr>`;
                const runScores = r.finalRuns.map((run, ri) => _runPill(run, ri, criteria)).join('');
                const medal = i === 0 ? ' 🥇' : i === 1 ? ' 🥈' : i === 2 ? ' 🥉' : '';
                return `<tr${i < 3 ? ` class="podium podium-${i + 1}"` : ''}>
                    <td class="rank">${i + 1}${medal}</td>
                    <td class="num">${r.finalStartNum}</td>
                    <td class="num muted">${r.starter.startNumber}</td>
                    <td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td>
                    <td class="runs-cell">${runScores}</td>
                    <td class="score">${r.score}</td>
                </tr>`;
            }).join('');
            return `<section>
                <div class="doc-header">
                    <span class="doc-event">${_esc(eventName)}</span>
                    <span class="doc-type">Ergebnisse Finale</span>
                    <span class="doc-group">${_esc(groupName)}</span>
                </div>
                <table>
                    <thead><tr><th>Platz</th><th>F-Nr.</th><th>Nr.</th><th>Name</th><th>Läufe (${finalRuns}×)</th><th>${_esc(scoreLabel)}</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="doc-footer">${rows.filter(r => !r.dq && !r.noRuns).length} Gewertet · ${_nowStr()}</div>
            </section>`;
        }

        function _runPill(run, ri, criteria) {
            const detail = criteria.map(c => {
                const sum = run.scores.reduce((a, s) => a + (s[c.key] ?? 0), 0);
                return `${_esc(c.shortLabel)}&nbsp;${Number.isInteger(sum) ? sum : sum.toFixed(1)}`;
            }).join(' / ');
            return `<span class="run-pill"><strong>${ri + 1}:&nbsp;${run.total}</strong><span class="run-detail">${detail}</span></span>`;
        }

        function _esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function _nowStr() {
            const d = new Date();
            return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function buildPrintPanel(isOpen) {
            const panel = document.createElement('div');
            panel.className = 'print-panel' + (isOpen ? ' open' : '');
            panel.dataset.gid = '__print__';

            const hdr = document.createElement('div');
            hdr.className = 'print-panel-hdr';
            const titleWrap = document.createElement('div');
            titleWrap.innerHTML = `<span class="print-panel-title">🖨 Drucken</span>`;
            const chevron = document.createElement('span');
            chevron.className = 'print-panel-chevron';
            chevron.textContent = '▼';
            hdr.appendChild(titleWrap);
            hdr.appendChild(chevron);
            hdr.addEventListener('click', () => panel.classList.toggle('open'));
            panel.appendChild(hdr);

            const body = document.createElement('div');
            body.className = 'print-panel-body';

            // Group selector
            const sel = document.createElement('select');
            sel.className = 'print-group-select';
            const optAll = document.createElement('option');
            optAll.value = '__all__';
            optAll.textContent = 'Alle Startgruppen';
            sel.appendChild(optAll);
            for (const g of drawerGroups) {
                const opt = document.createElement('option');
                opt.value = g.objectId;
                opt.textContent = g.name;
                sel.appendChild(opt);
            }
            body.appendChild(sel);

            // Print buttons
            const btnRow = document.createElement('div');
            btnRow.className = 'print-btn-row';

            const btns = [
                { type: 'startlist', icon: '📋', label: 'Startliste\nQualifikation' },
                { type: 'quali-results', icon: '📊', label: 'Ergebnisse\nQualifikation' },
                { type: 'final-startlist', icon: '🏁', label: 'Startliste\nFinale' },
                { type: 'final-results', icon: '🏆', label: 'Ergebnisse\nFinale' },
            ];

            for (const { type, icon, label } of btns) {
                const btn = document.createElement('button');
                btn.className = 'print-btn';
                btn.innerHTML = `<span class="print-btn-icon">${icon}</span>${label.replace('\n', '<br>')}`;
                btn.addEventListener('click', async () => {
                    btn.style.opacity = '0.5';
                    btn.style.pointerEvents = 'none';
                    try {
                        await printDoc(type, sel.value);
                    } finally {
                        btn.style.opacity = '';
                        btn.style.pointerEvents = '';
                    }
                });
                btnRow.appendChild(btn);
            }
            body.appendChild(btnRow);
            panel.appendChild(body);
            return panel;
        }

        async function init() {
            // Session required — login and event selection happen on index.html
            if (!ParseAPI.getSessionUser()) {
                location.replace('../index.html');
                return;
            }

            // Avatar
            const _user = ParseAPI.getSessionUser();
            document.getElementById('avatar-btn').textContent = _user[0].toUpperCase();
            document.getElementById('avatar-username').textContent = _user;
            document.getElementById('avatar-btn').addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('avatar-menu').classList.toggle('open');
            });
            document.addEventListener('click', () => document.getElementById('avatar-menu').classList.remove('open'));
            document.getElementById('avatar-logout').addEventListener('click', async () => {
                await ParseAPI.logout();
                location.replace('../index.html');
            });

            await Promise.all([ParseAPI.fetchEvent(), ParseAPI.fetchJudges()]).catch(() => { });
            document.title = `${CONFIG.eventName} – Startbereich`;

            // Start presence polling now that CONFIG.judgeTokens is populated from the live event
            refreshPresence();
            setInterval(refreshPresence, CONFIG.presencePollMs);
            ParseAPI.subscribePresence(refreshPresence);

            // Show event name + qualiRuns in header center
            const qualiRuns = CONFIG.qualiRuns;
            document.getElementById('event-label') && (document.getElementById('event-label').textContent = qualiRuns != null ? 'Event / Läufe' : 'Event');
            document.getElementById('event-display').textContent = CONFIG.eventName;
            const qualiEl = document.getElementById('quali-display');
            if (qualiRuns != null) {
                qualiEl.textContent = `${qualiRuns}× Qualifikation`;
                qualiEl.style.display = '';
            }
            const finalEl = document.getElementById('final-display');
            if (CONFIG.finalRuns != null) {
                finalEl.textContent = `${CONFIG.finalRuns}× Finale`;
                finalEl.style.display = '';
            }

            // Load start groups and subscribe to qualiClosed changes
            ParseAPI.fetchStartGroups().then(groups => {
                drawerGroups = groups;
                closedGroups = new Set(groups.filter(g => g.qualiClosed).map(g => g.objectId));
                renderFilterChips();
                renderList(filterInput.value);
            }).catch(() => { });

            ParseAPI.subscribeStartGroups(msg => {
                const sg = drawerGroups.find(g => g.objectId === msg.object?.objectId);
                if (sg && msg.object != null) {
                    sg.qualiClosed = msg.object.qualiClosed;
                    if (msg.object.qualiClosed) closedGroups.add(sg.objectId);
                    else closedGroups.delete(sg.objectId);
                    renderFilterChips();
                    renderList(filterInput.value);
                    if (document.getElementById('drawer').classList.contains('open')) renderDrawer();
                }
            });

            resultsLabel.textContent = 'Lade Starter …';
            try {
                [STARTERS, runCounts, finalRunCounts] = await Promise.all([
                    ParseAPI.fetchStarters(),
                    ParseAPI.fetchScoreCountByStarter(),
                    ParseAPI.fetchFinalScoreCountByStarter(),
                ]);
                START_NUMBERS = STARTERS.map(s => s.startNumber);
                drawerStarters = STARTERS;
                drawerRunCounts = runCounts;
            } catch (e) {
                resultsLabel.textContent = 'Fehler beim Laden';
            }

            // Load final entries and subscribe
            refreshFinalEntries();
            ParseAPI.subscribeFinalEntries(refreshFinalEntries);

            renderFilterChips();
            renderList('');
        }

        init();

        startBtn.addEventListener('click', async () => {
            if (selected === null) return;
            startBtn.disabled = true;
            startBtn.innerHTML = '…';
            try {
                // Compute runNumber here, before the 800ms delay to enterWaitingForScores
                const phase = mode === 'finale' ? 'final' : 'quali';
                activeRunNumber = mode === 'finale'
                    ? (finalRunCounts[selected] ?? 0) + 1
                    : (runCounts[selected] ?? 0) + 1;
                await ParseAPI.publishActiveStarter(selected, activeRunNumber, phase);
                channel.postMessage({ startnumber: selected, runNumber: activeRunNumber, phase });
                startBtn.innerHTML = '✓ Gestartet';
                setTimeout(() => enterWaitingForScores(selected), 800);
            } catch (e) {
                startBtn.innerHTML = '✕ Fehler';
                startBtn.disabled = false;
            }
        });
    </script>
</body>

</html>

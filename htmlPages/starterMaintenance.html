<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeRace – Starter Verwaltung</title>
    <link rel="stylesheet" href="../jury.css">
    <style>
        body {
            overflow: auto;
        }

        .page-wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .toolbar input {
            flex: 1;
            padding: 0.65rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .toolbar input:focus {
            border-color: var(--accent);
        }

        .toolbar input::placeholder {
            color: var(--muted);
        }

        .btn {
            padding: 0.65rem 1.1rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--green);
            color: #000;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .btn-danger:active {
            opacity: 0.75;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.65rem 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--card);
        }

        td.num {
            font-weight: 800;
            color: var(--accent);
            width: 3rem;
        }

        td.actions {
            width: 4rem;
            text-align: right;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--border);
        }

        .icon-btn.del:hover {
            color: #e74c3c;
        }

        .empty-row td {
            text-align: center;
            color: var(--muted);
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* form modal */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-input {
            padding: 0.6rem 0.85rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        select.form-input option {
            background: var(--card);
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            min-height: 1.1rem;
        }

        .status-bar.err {
            color: #e74c3c;
        }

        .status-bar.ok {
            color: var(--green);
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            color: var(--text);
        }

        th.sort-asc::after {
            content: ' ▲';
            color: var(--accent);
        }

        th.sort-desc::after {
            content: ' ▼';
            color: var(--accent);
        }

        td.results-badge {
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .badge-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px;
            background: var(--green);
        }

        .badge-dot.warn {
            background: var(--accent);
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            width: calc(100% - 2rem);
            max-width: 360px;
        }

        .login-title {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .login-err {
            font-size: 0.85rem;
            color: #e74c3c;
            text-align: center;
            min-height: 1.2rem;
            margin-bottom: 0.5rem;
        }
        /* ── Avatar menu ── */
        .avatar-wrap { position:relative; }
        .avatar { width:2rem;height:2rem;border-radius:50%;background:#e05b3a;color:#fff;font-size:0.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;flex-shrink:0;border:2px solid transparent;transition:border-color 0.15s; }
        .avatar:hover { border-color:#e05b3a44; }
        .avatar-menu { position:absolute;top:calc(100% + 0.5rem);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:400;display:none;overflow:hidden; }
        .avatar-menu.open { display:block; }
        .avatar-menu-user { padding:0.6rem 0.85rem;font-size:0.75rem;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .avatar-menu-item { display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.85rem;font-size:0.85rem;font-weight:600;color:var(--text);cursor:pointer;transition:background 0.1s; }
        .avatar-menu-item:hover { background:var(--border); }
        .avatar-menu-item.danger { color:var(--accent); }
    </style>
</head>

<body>
    <!-- login-overlay kept minimal for access-denied redirect fallback -->
    <div id="login-overlay" style="display:none"></div>
    <header>
        <div class="header-group">
            <div class="header-label">Verwaltung</div>
            <div class="header-value" style="color:var(--accent)">Starter</div>
        </div>
        <div class="header-group">
            <div class="header-label">Geladen</div>
            <div class="header-value" id="count-display">—</div>
        </div>
        <div class="avatar-wrap">
            <div class="avatar" id="avatar-btn">?</div>
            <div class="avatar-menu" id="avatar-menu">
                <div class="avatar-menu-user" id="avatar-username">—</div>
                <div class="avatar-menu-item danger" id="logout-btn">↩ Abmelden</div>
            </div>
        </div>
    </header>

    <div class="page-wrap">
        <div class="toolbar">
            <input id="search-input" type="text" placeholder="Name oder Startnummer suchen …" autocomplete="off">
            <button class="btn btn-primary" id="add-btn">+ Neu</button>
        </div>
        <div class="status-bar" id="status-bar"></div>
        <table>
            <thead>
                <tr>
                    <th class="sortable" data-col="startNumber">#</th>
                    <th class="sortable" data-col="lastName">Nachname</th>
                    <th class="sortable" data-col="firstName">Vorname</th>
                    <th class="sortable" data-col="gender">Geschlecht</th>
                    <th class="sortable" data-col="birthday">Geburtstag</th>
                    <th class="sortable" data-col="startGroup">Startgruppe</th>
                    <th class="sortable" data-col="results">Ergebnisse</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <!-- Form modal -->
    <div class="modal-backdrop" id="form-backdrop">
        <div class="modal">
            <div class="modal-title" id="form-title">Starter hinzufügen</div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Startnummer</label>
                    <input class="form-input" id="f-startNumber" type="number" min="1" placeholder="z.B. 42">
                </div>
                <div class="form-group">
                    <label class="form-label">Geschlecht</label>
                    <select class="form-input" id="f-gender">
                        <option value="">— wählen —</option>
                        <option value="m">Männlich</option>
                        <option value="f">Weiblich</option>
                        <option value="diverse">Divers</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Vorname</label>
                    <input class="form-input" id="f-firstName" type="text" placeholder="Max">
                </div>
                <div class="form-group">
                    <label class="form-label">Nachname</label>
                    <input class="form-input" id="f-lastName" type="text" placeholder="Mustermann">
                </div>
                <div class="form-group full">
                    <label class="form-label">Geburtstag</label>
                    <input class="form-input" id="f-birthday" type="date">
                </div>
                <div class="form-group full">
                    <label class="form-label">Startgruppe</label>
                    <select class="form-input" id="f-startGroup">
                        <option value="">— keine —</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" id="form-cancel">← Abbrechen</button>
                <button class="modal-confirm" id="form-save">✓ Speichern</button>
            </div>
            <div id="form-err"
                style="font-size:0.82rem;color:#e74c3c;text-align:center;min-height:1.1rem;margin-top:0.5rem"></div>
        </div>
    </div>

    <!-- Delete confirm modal (no results) -->
    <div class="modal-backdrop" id="del-backdrop">
        <div class="modal">
            <div class="modal-title" style="color:#e74c3c">Starter löschen?</div>
            <div id="del-name" style="text-align:center;margin:1rem 0;font-size:1.1rem;font-weight:700"></div>
            <div class="modal-actions">
                <button class="modal-cancel" id="del-cancel">← Abbrechen</button>
                <button class="btn btn-danger" style="padding:0.85rem" id="del-confirm">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Delete confirm modal (has results) -->
    <div class="modal-backdrop" id="del-results-backdrop">
        <div class="modal">
            <div class="modal-title" style="color:#e74c3c">Starter mit Ergebnissen löschen?</div>
            <div id="del-results-name" style="text-align:center;margin:0.75rem 0;font-size:1.1rem;font-weight:700">
            </div>
            <div id="del-results-info"
                style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:1rem"></div>
            <div style="text-align:center;font-size:0.85rem;color:#e74c3c;margin-bottom:1rem">
                Alle zugehörigen Wertungen und Finaleinträge werden unwiderruflich gelöscht.
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" id="del-results-cancel">← Abbrechen</button>
                <button class="btn btn-danger" style="padding:0.85rem" id="del-results-confirm">Alles löschen</button>
            </div>
        </div>
    </div>

    <footer>
        <img src="../assets/weraceLogo.png" alt="WeRace">
    </footer>

    <script src="../config.js"></script>
    <script>
        const _seedOverride = localStorage.getItem('seedEventOverride');
        if (_seedOverride) CONFIG.eventObjectId = _seedOverride;
    </script>
    <script src="../parse-api.js"></script>
    <script>
        let allStarters = [];
        let allGroups = [];
        let scoreMap = {};    // startnumber → { quali: n, final: n }
        let editId = null;
        let deleteId = null;
        let deleteName = '';
        let sortCol = 'startNumber';
        let sortDir = 1; // 1 = asc, -1 = desc

        const GENDER_LABEL = { m: 'Männlich', f: 'Weiblich', diverse: 'Divers' };

        // ── data ──
        const statusBar = document.getElementById('status-bar');
        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');

        function setStatus(msg, type = '') {
            statusBar.textContent = msg;
            statusBar.className = 'status-bar' + (type ? ` ${type}` : '');
        }

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function sortValue(s, col) {
            switch (col) {
                case 'startNumber': return s.startNumber ?? 0;
                case 'lastName': return (s.lastName ?? '').toLowerCase();
                case 'firstName': return (s.firstName ?? '').toLowerCase();
                case 'gender': return (GENDER_LABEL[s.gender] ?? '').toLowerCase();
                case 'birthday': return s.birthday?.iso ?? s.birthday ?? '';
                case 'startGroup': return (s.startGroup?.name ?? '').toLowerCase();
                case 'results': { const sc = scoreMap[s.startNumber] ?? { quali: 0, final: 0 }; return sc.quali + sc.final; }
                default: return '';
            }
        }

        function updateSortHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.col === sortCol)
                    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
            });
        }

        function populateGroupSelect(currentId = '') {
            const sel = document.getElementById('f-startGroup');
            sel.innerHTML = '<option value="">— keine —</option>';
            for (const g of allGroups) {
                const opt = document.createElement('option');
                opt.value = g.objectId;
                opt.textContent = g.name;
                if (g.objectId === currentId) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        function renderTable(filter = '') {
            const term = filter.toLowerCase().trim();
            let rows = term
                ? allStarters.filter(s =>
                    String(s.startNumber).includes(term) ||
                    (s.firstName || '').toLowerCase().includes(term) ||
                    (s.lastName || '').toLowerCase().includes(term))
                : [...allStarters];

            rows.sort((a, b) => {
                const av = sortValue(a, sortCol), bv = sortValue(b, sortCol);
                return av < bv ? -sortDir : av > bv ? sortDir : 0;
            });

            document.getElementById('count-display').textContent = allStarters.length;
            tableBody.innerHTML = '';

            if (!rows.length) {
                tableBody.innerHTML = '<tr class="empty-row"><td colspan="8">Keine Starter gefunden</td></tr>';
                return;
            }

            for (const s of rows) {
                const groupName = s.startGroup?.name ?? '—';
                const sc = scoreMap[s.startNumber] ?? { quali: 0, final: 0 };
                let resultCell;
                if (sc.quali || sc.final) {
                    const parts = [];
                    if (sc.quali) parts.push(`${sc.quali} Quali`);
                    if (sc.final) parts.push(`${sc.final} Final`);
                    resultCell = `<span class="badge-dot warn"></span>${parts.join(', ')}`;
                } else {
                    resultCell = `<span class="badge-dot"></span>keine`;
                }
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="num">${s.startNumber ?? '—'}</td>
                    <td>${s.lastName ?? '—'}</td>
                    <td>${s.firstName ?? '—'}</td>
                    <td>${GENDER_LABEL[s.gender] ?? '—'}</td>
                    <td>${formatDate(s.birthday?.iso ?? s.birthday)}</td>
                    <td>${groupName}</td>
                    <td class="results-badge">${resultCell}</td>
                    <td class="actions">
                        <button class="icon-btn edit" data-id="${s.objectId}" title="Bearbeiten">✎</button>
                        <button class="icon-btn del" data-id="${s.objectId}" data-num="${s.startNumber}" data-name="${s.firstName} ${s.lastName}" title="Löschen">✕</button>
                    </td>`;
                tableBody.appendChild(tr);
            }
        }

        async function loadStarters() {
            await ParseAPI.fetchEvent().catch(() => { });
            document.title = `${CONFIG.eventName} – Registrierung`;
            setStatus('Lade Starter …');
            try {
                const [starters, groups, qualiMap, finalMap] = await Promise.all([
                    ParseAPI.fetchStarters(),
                    ParseAPI.fetchStartGroups(),
                    ParseAPI.fetchScoreCountByStarter(),
                    ParseAPI.fetchFinalScoreCountByStarter(),
                ]);
                allStarters = starters;
                allGroups = groups;
                scoreMap = {};
                for (const num of new Set([...Object.keys(qualiMap), ...Object.keys(finalMap)])) {
                    scoreMap[num] = { quali: qualiMap[num] ?? 0, final: finalMap[num] ?? 0 };
                }
                renderTable(searchInput.value);
                setStatus('');
            } catch (e) {
                setStatus(e.message, 'err');
            }
        }

        searchInput.addEventListener('input', () => renderTable(searchInput.value));

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                if (sortCol === th.dataset.col) {
                    sortDir *= -1;
                } else {
                    sortCol = th.dataset.col;
                    sortDir = 1;
                }
                updateSortHeaders();
                renderTable(searchInput.value);
            });
        });
        updateSortHeaders();

        // ── form modal ──
        function openForm(starter = null) {
            editId = starter?.objectId ?? null;
            document.getElementById('form-title').textContent = starter ? 'Starter bearbeiten' : 'Starter hinzufügen';
            document.getElementById('f-startNumber').value = starter?.startNumber ?? '';
            document.getElementById('f-firstName').value = starter?.firstName ?? '';
            document.getElementById('f-lastName').value = starter?.lastName ?? '';
            document.getElementById('f-gender').value = starter?.gender ?? '';
            const bd = starter?.birthday?.iso ?? starter?.birthday ?? '';
            document.getElementById('f-birthday').value = bd ? bd.slice(0, 10) : '';
            populateGroupSelect(starter?.startGroup?.objectId ?? '');
            document.getElementById('form-err').textContent = '';
            const sc = starter ? (scoreMap[starter.startNumber] ?? { quali: 0, final: 0 }) : { quali: 0, final: 0 };
            const hasScores = sc.quali > 0 || sc.final > 0;
            const numInput = document.getElementById('f-startNumber');
            numInput.disabled = hasScores;
            numInput.title = hasScores ? 'Startnummer kann nicht geändert werden – es existieren bereits Wertungen.' : '';
            document.getElementById('form-backdrop').classList.add('open');
            (hasScores ? document.getElementById('f-firstName') : numInput).focus();
        }

        document.getElementById('add-btn').addEventListener('click', () => openForm());
        document.getElementById('form-cancel').addEventListener('click', () =>
            document.getElementById('form-backdrop').classList.remove('open'));

        document.getElementById('form-save').addEventListener('click', async () => {
            const startNumber = Number(document.getElementById('f-startNumber').value);
            const firstName = document.getElementById('f-firstName').value.trim();
            const lastName = document.getElementById('f-lastName').value.trim();
            const gender = document.getElementById('f-gender').value;
            const bdVal = document.getElementById('f-birthday').value;
            const groupId = document.getElementById('f-startGroup').value;

            if (!startNumber || !firstName || !lastName) {
                document.getElementById('form-err').textContent = 'Startnummer, Vor- und Nachname sind Pflichtfelder.';
                return;
            }

            if (allStarters.some(s => s.startNumber === startNumber && s.objectId !== editId)) {
                document.getElementById('form-err').textContent = `Startnummer ${startNumber} ist bereits vergeben.`;
                return;
            }

            const fields = {
                startNumber,
                firstName,
                lastName,
                gender: gender || undefined,
                birthday: bdVal ? { __type: 'Date', iso: new Date(bdVal).toISOString() } : undefined,
                startGroup: groupId
                    ? { __type: 'Pointer', className: 'HT_STARTGROUP', objectId: groupId }
                    : null,
            };

            document.getElementById('form-backdrop').classList.remove('open');
            setStatus('Speichere …');
            try {
                await ParseAPI.saveStarter(fields, editId);
                setStatus(editId ? 'Gespeichert.' : 'Hinzugefügt.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        // ── delete ──
        tableBody.addEventListener('click', e => {
            const editBtn = e.target.closest('.icon-btn.edit');
            const delBtn = e.target.closest('.icon-btn.del');
            if (editBtn) {
                const s = allStarters.find(x => x.objectId === editBtn.dataset.id);
                if (s) openForm(s);
            }
            if (delBtn) {
                deleteId = delBtn.dataset.id;
                deleteName = delBtn.dataset.name;
                const sc = scoreMap[delBtn.dataset.num] ?? { quali: 0, final: 0 };
                if (sc.quali || sc.final) {
                    const parts = [];
                    if (sc.quali) parts.push(`${sc.quali} Quali-Wertung${sc.quali !== 1 ? 'en' : ''}`);
                    if (sc.final) parts.push(`${sc.final} Final-Wertung${sc.final !== 1 ? 'en' : ''}`);
                    document.getElementById('del-results-name').textContent = deleteName;
                    document.getElementById('del-results-info').textContent =
                        `Vorhandene Ergebnisse: ${parts.join(', ')}`;
                    document.getElementById('del-results-backdrop').classList.add('open');
                } else {
                    document.getElementById('del-name').textContent = deleteName;
                    document.getElementById('del-backdrop').classList.add('open');
                }
            }
        });

        document.getElementById('del-cancel').addEventListener('click', () =>
            document.getElementById('del-backdrop').classList.remove('open'));

        document.getElementById('del-confirm').addEventListener('click', async () => {
            document.getElementById('del-backdrop').classList.remove('open');
            setStatus('Lösche …');
            try {
                await ParseAPI.deleteStarter(deleteId);
                setStatus('Gelöscht.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        document.getElementById('del-results-cancel').addEventListener('click', () =>
            document.getElementById('del-results-backdrop').classList.remove('open'));

        document.getElementById('del-results-confirm').addEventListener('click', async () => {
            document.getElementById('del-results-backdrop').classList.remove('open');
            setStatus('Lösche Ergebnisse und Starter …');
            const starter = allStarters.find(s => s.objectId === deleteId);
            try {
                await ParseAPI.deleteResultsForStarter(starter.startNumber, deleteId);
                await ParseAPI.deleteStarter(deleteId);
                setStatus('Starter und Ergebnisse gelöscht.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await ParseAPI.logout();
            location.replace('../index.html');
        });

        // Session required — login and event selection happen on index.html
        (async () => {
            if (!ParseAPI.getSessionUser()) { location.replace('../index.html'); return; }
            const _user = ParseAPI.getSessionUser();
            document.getElementById('avatar-btn').textContent = _user[0].toUpperCase();
            document.getElementById('avatar-username').textContent = _user;
            document.getElementById('avatar-btn').addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('avatar-menu').classList.toggle('open');
            });
            document.addEventListener('click', () => document.getElementById('avatar-menu').classList.remove('open'));
            document.getElementById('login-display') && (document.getElementById('login-display').textContent = _user);
            loadStarters();
        })();
    </script>
</body>

</html>

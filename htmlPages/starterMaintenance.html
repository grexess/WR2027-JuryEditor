<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeRace – Starter Verwaltung</title>
    <link rel="stylesheet" href="../jury.css">
    <style>
        body {
            overflow: auto;
        }

        .page-wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .toolbar input {
            flex: 1;
            padding: 0.65rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .toolbar input:focus {
            border-color: var(--accent);
        }

        .toolbar input::placeholder {
            color: var(--muted);
        }

        .btn {
            padding: 0.65rem 1.1rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--green);
            color: #000;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .btn-danger:active {
            opacity: 0.75;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.65rem 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--card);
        }

        td.num {
            font-weight: 800;
            color: var(--num);
            width: 3rem;
        }

        td.actions {
            width: 4rem;
            text-align: right;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--border);
        }

        .icon-btn.del:hover {
            color: #e74c3c;
        }

        .empty-row td {
            text-align: center;
            color: var(--muted);
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* ── Settings + Print panels ── */
        .admin-panels {
            margin-top: 1rem;
        }

        .admin-panel {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            overflow: hidden;
            background: var(--bg);
        }

        .admin-panel-hdr {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .admin-panel-hdr:active { background: var(--border); }

        .admin-panel-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
        }

        .admin-panel-chevron {
            font-size: 0.65rem;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .admin-panel.open .admin-panel-chevron { transform: rotate(180deg); }

        .admin-panel-body {
            display: none;
            border-top: 1px solid var(--border);
        }

        .admin-panel.open .admin-panel-body { display: block; }

        .settings-section {
            padding: 0.6rem 0.75rem 0.25rem;
            border-bottom: 1px solid var(--border);
        }

        .settings-section:last-child { border-bottom: none; }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.3rem 0;
        }

        .settings-row-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .settings-row-sub {
            font-size: 0.65rem;
            color: var(--muted);
            display: block;
            font-weight: 400;
        }

        .settings-num {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .settings-num-btn {
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .settings-num-btn:active { background: var(--border); }
        .settings-num-btn:disabled { opacity: 0.3; cursor: default; }

        .settings-num-val {
            min-width: 2rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .settings-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .settings-toggle-btn {
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .settings-toggle-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .settings-save-btn {
            width: calc(100% - 1.5rem);
            margin: 0.5rem 0.75rem 0.75rem;
            padding: 0.5rem;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .settings-save-btn:active { opacity: 0.8; }
        .settings-save-btn:disabled { opacity: 0.4; cursor: default; }

        .print-view {
            max-width: 680px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .print-view-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .print-group-select {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .print-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 480px) {
            .print-btn-row { grid-template-columns: repeat(4, 1fr); }
        }

        .print-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1.5rem 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 1.3;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
        }

        .print-btn:hover {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, var(--card));
        }

        .print-btn:active { transform: scale(0.97); opacity: 0.85; }

        .print-btn-icon { font-size: 2rem; line-height: 1; }

        .print-btn-phase {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--muted);
            margin-top: -0.2rem;
        }

        /* form modal */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-label.required::after {
            content: ' *';
            color: #e74c3c;
        }

        .form-divider {
            grid-column: 1 / -1;
            border: none;
            border-top: 1px solid var(--border, #333);
            margin: 0.25rem 0;
        }

        .form-divider-label {
            grid-column: 1 / -1;
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        .form-input {
            padding: 0.6rem 0.85rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        select.form-input option {
            background: var(--card);
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            min-height: 1.1rem;
        }

        .status-bar.err {
            color: #e74c3c;
        }

        .status-bar.ok {
            color: var(--green);
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            color: var(--text);
        }

        th.sort-asc::after {
            content: ' ▲';
            color: var(--accent);
        }

        th.sort-desc::after {
            content: ' ▼';
            color: var(--accent);
        }

        td.results-badge {
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .badge-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px;
            background: var(--green);
        }

        .badge-dot.warn {
            background: var(--accent);
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            width: calc(100% - 2rem);
            max-width: 360px;
        }

        .login-title {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .login-err {
            font-size: 0.85rem;
            color: #e74c3c;
            text-align: center;
            min-height: 1.2rem;
            margin-bottom: 0.5rem;
        }
        /* ── Avatar menu ── */
        .avatar-wrap { position:relative; }
        /* ── Header nav tabs ── */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }
        .hnav-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .hnav-btn:hover { color: var(--text); background: var(--border); }
        .hnav-btn.active { color: var(--text); background: var(--card); border-color: var(--border); }
        .hnav-count {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 400;
        }
        /* On small screens: shrink label text, tighten padding */
        @media (max-width: 480px) {
            .hnav-btn { font-size: 0.72rem; padding: 0.3rem 0.45rem; }
            .header-group .header-label,
            .header-group .header-value { font-size: 0.65rem; }
        }
        .avatar { width:2rem;height:2rem;border-radius:50%;background:#e05b3a;color:#fff;font-size:0.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;flex-shrink:0;border:2px solid transparent;transition:border-color 0.15s; }
        .avatar:hover { border-color:#e05b3a44; }
        .avatar-menu { position:absolute;top:calc(100% + 0.5rem);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:400;display:none;overflow:hidden; }
        .avatar-menu.open { display:block; }
        .avatar-menu-user { padding:0.6rem 0.85rem;font-size:0.75rem;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .avatar-menu-item { display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.85rem;font-size:0.85rem;font-weight:600;color:var(--text);cursor:pointer;transition:background 0.1s; }
        .avatar-menu-item:hover { background:var(--border); }
        .avatar-menu-item.danger { color:var(--accent); }
    </style>
</head>

<body>
    <!-- login-overlay kept minimal for access-denied redirect fallback -->
    <div id="login-overlay" style="display:none"></div>
    <header style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0.5rem">
        <div class="header-group" style="justify-self:start">
            <div class="header-label">Verwaltung</div>
            <div class="header-value" id="event-name-display" style="color:var(--accent)">Starter</div>
        </div>
        <nav class="header-nav" id="header-nav">
            <button class="hnav-btn active" data-view="starter">Starter<span class="hnav-count" id="hnav-count"></span></button>
            <button class="hnav-btn" data-view="settings">Einstellungen</button>
            <button class="hnav-btn" data-view="print">Drucken</button>
        </nav>
        <div class="avatar-wrap" style="justify-self:end">
            <div class="avatar" id="avatar-btn">?</div>
            <div class="avatar-menu" id="avatar-menu">
                <div class="avatar-menu-user" id="avatar-username">—</div>
                <div class="avatar-menu-item danger" id="logout-btn">↩ Abmelden</div>
            </div>
        </div>
    </header>

    <div class="page-wrap">
        <div id="view-starter">
            <div class="toolbar">
                <input id="search-input" type="text" placeholder="Name oder Startnummer suchen …" autocomplete="off">
                <button class="btn btn-primary" id="add-btn">+ Neu</button>
            </div>
            <div class="status-bar" id="status-bar"></div>
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-col="startNumber">#</th>
                        <th class="sortable" data-col="lastName">Nachname</th>
                        <th class="sortable" data-col="firstName">Vorname</th>
                        <th class="sortable" data-col="gender">Geschlecht</th>
                        <th class="sortable" data-col="birthday">Geburtstag</th>
                        <th class="sortable" data-col="startGroup">Startgruppe</th>
                        <th class="sortable" data-col="results">Ergebnisse</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <div id="view-settings" style="display:none"></div>
        <div id="view-print" style="display:none"></div>
        <div id="admin-panels" style="display:none"></div>
    </div>

    <!-- Form modal -->
    <div class="modal-backdrop" id="form-backdrop">
        <div class="modal">
            <div class="modal-title" id="form-title">Starter hinzufügen</div>
            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label required">Startgruppe</label>
                    <select class="form-input" id="f-startGroup">
                        <option value="">— wählen —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label required">Vorname</label>
                    <input class="form-input" id="f-firstName" type="text">
                </div>
                <div class="form-group">
                    <label class="form-label required">Nachname</label>
                    <input class="form-input" id="f-lastName" type="text">
                </div>
                <div class="form-group full">
                    <label class="form-label required">Startnummer</label>
                    <input class="form-input" id="f-startNumber" type="text" placeholder="z.B. A1">
                </div>
                <hr class="form-divider">
                <span class="form-divider-label">Optional</span>
                <div class="form-group">
                    <label class="form-label">Geschlecht</label>
                    <select class="form-input" id="f-gender">
                        <option value="">— wählen —</option>
                        <option value="m">Männlich</option>
                        <option value="f">Weiblich</option>
                        <option value="diverse">Divers</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Geburtstag</label>
                    <input class="form-input" id="f-birthday" type="date">
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" id="form-cancel">← Abbrechen</button>
                <button class="modal-confirm" id="form-save">✓ Speichern</button>
            </div>
            <div id="form-err"
                style="font-size:0.82rem;color:#e74c3c;text-align:center;min-height:1.1rem;margin-top:0.5rem"></div>
        </div>
    </div>

    <!-- Delete confirm modal (no results) -->
    <div class="modal-backdrop" id="del-backdrop">
        <div class="modal">
            <div class="modal-title" style="color:#e74c3c">Starter löschen?</div>
            <div id="del-name" style="text-align:center;margin:1rem 0;font-size:1.1rem;font-weight:700"></div>
            <div class="modal-actions">
                <button class="modal-cancel" id="del-cancel">← Abbrechen</button>
                <button class="btn btn-danger" style="padding:0.85rem" id="del-confirm">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Delete confirm modal (has results) -->
    <div class="modal-backdrop" id="del-results-backdrop">
        <div class="modal">
            <div class="modal-title" style="color:#e74c3c">Starter mit Ergebnissen löschen?</div>
            <div id="del-results-name" style="text-align:center;margin:0.75rem 0;font-size:1.1rem;font-weight:700">
            </div>
            <div id="del-results-info"
                style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:1rem"></div>
            <div style="text-align:center;font-size:0.85rem;color:#e74c3c;margin-bottom:1rem">
                Alle zugehörigen Wertungen und Finaleinträge werden unwiderruflich gelöscht.
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" id="del-results-cancel">← Abbrechen</button>
                <button class="btn btn-danger" style="padding:0.85rem" id="del-results-confirm">Alles löschen</button>
            </div>
        </div>
    </div>

    <footer>
        <img src="../assets/weraceLogo.png" alt="WeRace">
    </footer>

    <script src="../config.js"></script>
    <script>
        const _seedOverride = localStorage.getItem('seedEventOverride');
        if (_seedOverride) CONFIG.eventObjectId = _seedOverride;
    </script>
    <script src="../parse-api.js"></script>
    <script>
        let allStarters = [];
        let allGroups = [];
        let scoreMap = {};    // startnumber → { quali: n, final: n }
        let editId = null;
        let deleteId = null;
        let deleteName = '';
        let sortCol = 'startNumber';
        let sortDir = 1; // 1 = asc, -1 = desc

        const GENDER_LABEL = { m: 'Männlich', f: 'Weiblich', diverse: 'Divers' };

        // ── data ──
        const statusBar = document.getElementById('status-bar');
        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');

        function setStatus(msg, type = '') {
            statusBar.textContent = msg;
            statusBar.className = 'status-bar' + (type ? ` ${type}` : '');
        }

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function sortValue(s, col) {
            switch (col) {
                case 'startNumber': return s.startNumber ?? '';
                case 'lastName': return (s.lastName ?? '').toLowerCase();
                case 'firstName': return (s.firstName ?? '').toLowerCase();
                case 'gender': return (GENDER_LABEL[s.gender] ?? '').toLowerCase();
                case 'birthday': return s.birthday?.iso ?? s.birthday ?? '';
                case 'startGroup': return (s.startGroup?.name ?? '').toLowerCase();
                case 'results': { const sc = scoreMap[s.startNumber] ?? { quali: 0, final: 0 }; return sc.quali + sc.final; }
                default: return '';
            }
        }

        function updateSortHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.col === sortCol)
                    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
            });
        }

        function populateGroupSelect(currentId = '') {
            const sel = document.getElementById('f-startGroup');
            sel.innerHTML = '<option value="">— keine —</option>';
            for (const g of allGroups) {
                const opt = document.createElement('option');
                opt.value = g.objectId;
                opt.textContent = g.name;
                if (g.objectId === currentId) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        function renderTable(filter = '') {
            const term = filter.toLowerCase().trim();
            let rows = term
                ? allStarters.filter(s =>
                    String(s.startNumber).includes(term) ||
                    (s.firstName || '').toLowerCase().includes(term) ||
                    (s.lastName || '').toLowerCase().includes(term))
                : [...allStarters];

            rows.sort((a, b) => {
                const av = sortValue(a, sortCol), bv = sortValue(b, sortCol);
                if (sortCol === 'startNumber')
                    return sortDir * String(av).localeCompare(String(bv), undefined, { numeric: true });
                return av < bv ? -sortDir : av > bv ? sortDir : 0;
            });

            document.getElementById('hnav-count').textContent = allStarters.length ? ` ${allStarters.length}` : '';
            tableBody.innerHTML = '';

            if (!rows.length) {

        // ── Event Settings panel ──
        let _settingsDraft = null;

        function _freshDraft() {
            return {
                qualiRuns: CONFIG.qualiRuns,
                finalRuns: CONFIG.finalRuns,
                bestOf: CONFIG.bestOf ?? 8,
                qualiScoreMode: CONFIG.qualiScoreMode ?? 'sum',
                finalScoreMode: CONFIG.finalScoreMode ?? 'sum',

                    ...c,
                    weight: c.weight ?? Math.round(100 / arr.length),
                })),

        function rebuildSettingsBody() {
            const body = document.getElementById('settings-panel-body');
            if (!body || !_settingsDraft) return;
            body.innerHTML = '';
            const d = _settingsDraft;

            const makeNumRow = (label, sub, key, min, max, nullLabel) => {
                const sec = document.createElement('div');

                const row = document.createElement('div');
                row.className = 'settings-row';
                const textWrap = document.createElement('div');
                textWrap.className = 'settings-row-label';
                textWrap.innerHTML = label + (sub ? `<span class="settings-row-sub">${sub}</span>` : '');
                const ctrl = document.createElement('div');
                ctrl.className = 'settings-num';
                const dec = document.createElement('button');
                dec.className = 'settings-num-btn';
                dec.textContent = '−';
                dec.disabled = d[key] === null || d[key] <= min;
                dec.addEventListener('click', () => { if (d[key] !== null) { d[key] = Math.max(min, d[key] - 1); rebuildSettingsBody(); } });
                const val = document.createElement('div');
                val.className = 'settings-num-val';
                val.textContent = d[key] === null ? (nullLabel ?? '∞') : d[key];
                const inc = document.createElement('button');
                inc.className = 'settings-num-btn';
                inc.textContent = '+';
                inc.disabled = d[key] !== null && d[key] >= max;
                inc.addEventListener('click', () => { d[key] = d[key] === null ? min : Math.min(max, d[key] + 1); rebuildSettingsBody(); });
                if (nullLabel !== undefined) {
                    const inf = document.createElement('button');
                    inf.className = 'settings-num-btn';
                    inf.style.fontSize = '0.75rem';
                    inf.title = d[key] === null ? 'Feste Anzahl setzen' : 'Unbegrenzt';
                    inf.textContent = d[key] === null ? '#' : '∞';
                    inf.addEventListener('click', () => { d[key] = d[key] === null ? min : null; rebuildSettingsBody(); });
                    ctrl.append(dec, val, inc, inf);
                } else {
                    ctrl.append(dec, val, inc);
                }
                row.appendChild(textWrap);
                row.appendChild(ctrl);
                sec.appendChild(row);
                body.appendChild(sec);
            };

            makeNumRow('Quali-Läufe', 'Läufe pro Starter in der Qualifikation', 'qualiRuns', 1, 10, '∞');
            makeNumRow('Final-Läufe', 'Läufe pro Finalist im Finale', 'finalRuns', 1, 10, '∞');
            makeNumRow('Finalisten (Best-Of)', 'Anzahl Starter die ins Finale einziehen', 'bestOf', 1, 30);

            const makeModeRow = (label, sub, key, runs) => {
                if (runs !== null && runs <= 1) return;
                const sec = document.createElement('div');
                sec.className = 'settings-section';
                const row = document.createElement('div');
                row.className = 'settings-row';
                const lbl = document.createElement('div');
                lbl.className = 'settings-row-label';
                lbl.innerHTML = label + (sub ? `<span class="settings-row-sub">${sub}</span>` : '');
                const toggle = document.createElement('div');
                toggle.className = 'settings-toggle';
                ['sum', 'best'].forEach(m => {
                    const btn = document.createElement('button');
                    btn.className = 'settings-toggle-btn' + (d[key] === m ? ' active' : '');
                    btn.textContent = m === 'sum' ? 'Summe' : 'Bester Lauf';
                    btn.addEventListener('click', () => { d[key] = m; rebuildSettingsBody(); });
                    toggle.appendChild(btn);
                });
                row.append(lbl, toggle);
                sec.appendChild(row);
                body.appendChild(sec);
            };

            makeModeRow('Quali-Wertung', 'Wie wird die Qualiplatzierung berechnet?', 'qualiScoreMode', d.qualiRuns);
            makeModeRow('Final-Wertung', 'Wie wird die Finalplatzierung berechnet?', 'finalScoreMode', d.finalRuns);

            const critSec = document.createElement('div');
            critSec.className = 'settings-section';
            const critTitle = document.createElement('div');
            critTitle.className = 'settings-row-label';
            critTitle.style.cssText = 'font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;padding:0.5rem 0 0.25rem';
            critTitle.textContent = 'Bewertungskriterien';
            critSec.appendChild(critTitle);

            const weightSumEl = document.createElement('div');
            weightSumEl.style.cssText = 'font-size:0.75rem;font-weight:700;margin-bottom:0.4rem;text-align:right';
            let saveBtn;

            const updateWeightSum = () => {
                const sum = d.criteria.reduce((a, c) => a + (Number(c.weight) || 0), 0);
                weightSumEl.textContent = `Summe: ${sum}%`;
                weightSumEl.style.color = sum === 100 ? 'var(--green)' : '#e3a007';
                if (saveBtn) saveBtn.disabled = sum !== 100;
            };

            d.criteria.forEach((c, idx) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:grid;grid-template-columns:1fr auto;gap:0.4rem;align-items:center;margin-bottom:0.4rem';
                const inputs = document.createElement('div');
                inputs.style.cssText = 'display:flex;gap:0.4rem';
                const labelIn = document.createElement('input');
                labelIn.type = 'text'; labelIn.value = c.label; labelIn.placeholder = 'Bezeichnung';
                labelIn.style.cssText = 'flex:2;padding:0.35rem 0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85rem;outline:none';
                labelIn.addEventListener('input', () => { d.criteria[idx].label = labelIn.value.trim(); });
                const shortIn = document.createElement('input');
                shortIn.type = 'text'; shortIn.value = c.shortLabel; shortIn.placeholder = 'Kürzel'; shortIn.maxLength = 8;
                shortIn.style.cssText = 'flex:1;padding:0.35rem 0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85rem;outline:none';
                shortIn.addEventListener('input', () => { d.criteria[idx].shortLabel = shortIn.value.trim(); });
                const weightIn = document.createElement('input');
                weightIn.type = 'number'; weightIn.value = c.weight ?? Math.round(100 / d.criteria.length);
                weightIn.min = 1; weightIn.max = 100; weightIn.placeholder = '%';
                weightIn.style.cssText = 'width:3.5rem;padding:0.35rem 0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85rem;outline:none;text-align:center';
                weightIn.addEventListener('input', () => {
                    d.criteria[idx].weight = Math.max(1, Math.min(100, parseInt(weightIn.value) || 0));
                    updateWeightSum();
                });
                inputs.append(labelIn, shortIn, weightIn);
                const keyBadge = document.createElement('span');
                keyBadge.textContent = c.key;
                keyBadge.style.cssText = 'font-size:0.65rem;color:var(--muted);white-space:nowrap';
                row.append(inputs, keyBadge);
                critSec.appendChild(row);
            });

            critSec.appendChild(weightSumEl);
            updateWeightSum();
            body.appendChild(critSec);

            const keysChanged = d.criteria.some((c, i) => c.key !== CONFIG.criteria[i]?.key);
            if (keysChanged) {
                const warn = document.createElement('div');
                warn.style.cssText = 'font-size:0.75rem;color:#e3a007;background:color-mix(in srgb,#e3a007 12%,transparent);border-radius:6px;padding:0.4rem 0.6rem;margin-bottom:0.5rem;line-height:1.4';
                warn.textContent = '⚠ Kriterien-Keys wurden geändert. Kampfrichter-Apps müssen nach dem Speichern neu geladen werden.';
                body.appendChild(warn);
            }
            saveBtn = document.createElement('button');
            saveBtn.className = 'settings-save-btn';
            saveBtn.textContent = 'Einstellungen speichern';
            updateWeightSum(); // set initial disabled state now that saveBtn exists
            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = '…';
                try {
                    await ParseAPI.updateEventSettings({
                        qualiRuns: d.qualiRuns, finalRuns: d.finalRuns, bestOf: d.bestOf,
                        qualiScoreMode: d.qualiScoreMode, finalScoreMode: d.finalScoreMode, criteria: d.criteria,
                    });
                    CONFIG.qualiRuns = d.qualiRuns; CONFIG.finalRuns = d.finalRuns; CONFIG.bestOf = d.bestOf;
                    CONFIG.qualiScoreMode = d.qualiScoreMode; CONFIG.finalScoreMode = d.finalScoreMode; CONFIG.criteria = d.criteria;
                    _settingsDraft = null;
                    saveBtn.textContent = '✓ Gespeichert';
                    setTimeout(() => renderAdminPanels(), 1200);
                } catch (_) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '✕ Fehler – nochmal versuchen';
                }
            });
            body.appendChild(saveBtn);
        }

        // ── Print panel ──
        function _esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function _nowStr() {
            const d = new Date();
            return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        function _nowTime() {
            const d = new Date();
            return [d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), d.toLocaleDateString('de-DE')];
        }
        function _kpiChips(...chips) {
            return '<div class="kpi-row">' + chips.map(([val, lbl, cls]) =>
                `<div class="kpi-chip ${cls}"><strong class="kpi-val">${_esc(String(val))}</strong><span class="kpi-lbl">${_esc(lbl)}</span></div>`
            ).join('') + '</div>';
        }
        function _sectionHead(eventName, logoUrl, docType, groupName, kpiRow) {
            return `<div class="doc-page-header"><img class="doc-logo" src="${logoUrl}" alt="WeRace"><div class="doc-event-name">${_esc(eventName)}</div></div><hr class="doc-hr"><div class="doc-group-header"><span class="doc-doc-type">${_esc(docType)}</span><span class="doc-group-name">${_esc(groupName)}</span>${kpiRow}</div>`;
        }
        function _groupHead(groupName, kpiRow) {
            return `<div class="doc-group-header"><span class="doc-group-name">${_esc(groupName)}</span>${kpiRow}</div>`;
        }

        function _printStartlist(groupName, sorted) {
            const [time, date] = _nowTime();
            const kpi = _kpiChips([sorted.length, 'Starter', 'kpi-chip-count']);
            const rows = sorted.map(s => `<tr>
                <td class="num"><span class="num-badge">${_esc(s.startNumber ?? '—')}</span></td>
                <td>${_esc(s.firstName ?? '')} ${_esc(s.lastName ?? '')}</td></tr>`).join('');
            return `<section><div class="doc-group-header"><span class="doc-group-name">${_esc(groupName)}</span>${kpi}</div>
                <div class="table-wrap"><table><thead><tr><th>Startnummer</th><th>Name</th></tr></thead>
                <tbody>${rows}</tbody></table></div></section>`;
        }

        function _calcJudgeTotal(s) {
            return Math.round(CONFIG.criteria.reduce((a, c) =>
                a + (s[c.key] ?? 0) * ((c.weight ?? (100 / CONFIG.criteria.length)) / 100), 0));
        }

        function _distributeRounded(s, criteria) {
            const total = _calcJudgeTotal(s);
            const exact = criteria.map(c =>
                (s[c.key] ?? 0) * ((c.weight ?? (100 / criteria.length)) / 100));
            const floors = exact.map(Math.floor);
            const remainder = total - floors.reduce((a, b) => a + b, 0);
            exact.map((v, i) => ({ i, frac: v - floors[i] }))
                .sort((a, b) => b.frac - a.frac)
                .slice(0, remainder)
                .forEach(({ i }) => floors[i]++);
            return floors;
        }

        function _deduplicateByJudge(scores) {
            const latest = new Map();
            for (const s of scores) latest.set(s.judgeName, s);
            return [...latest.values()];
        }

        function _phaseRuns(scores) {
            const qualiScores = scores.filter(s => (s.phase ?? 'quali') === 'quali');
            const finalScores = scores.filter(s => s.phase === 'final');
            const toRuns = list => {
                const byRun = {};
                for (const s of list) {
                    const r = s.runNumber ?? 1;
                    if (!byRun[r]) byRun[r] = { runNumber: r, scores: [] };
                    byRun[r].scores.push(s);
                }
                return Object.values(byRun).sort((a, b) => a.runNumber - b.runNumber).map(run => {
                    const deduped = _deduplicateByJudge(run.scores);
                    return { runNumber: run.runNumber, scores: deduped, total: deduped.reduce((a, s) => a + _calcJudgeTotal(s), 0) };
                });
            };
            return { qualiRuns: toRuns(qualiScores), finalRuns: toRuns(finalScores) };
        }

        function _runPill(run, ri, criteria) {
            const detail = criteria.map((c, ci) => {
                const weighted = run.scores.reduce((a, s) => a + _distributeRounded(s, criteria)[ci], 0);
                const raw = run.scores.reduce((a, s) => a + (s[c.key] ?? 0), 0);
                return `<strong>${_esc(c.shortLabel)}&nbsp;${weighted}</strong>&nbsp;<span style="font-size:6.5pt;color:#999">(${raw})</span>`;
            }).join(' / ');
            return `<span class="run-pill"><strong>${ri + 1}:&nbsp;${run.total}</strong><span class="run-detail">${detail}</span></span>`;
        }

        function _buildQualiResults(groupStarters, allScores, finalistNums) {
            const rows = [];
            for (const starter of groupStarters) {
                if (starter.status === 'disqualified') { rows.push({ starter, dq: true }); continue; }
                const scores = allScores.filter(s => String(s.startNumber) === String(starter.startNumber));
                const { qualiRuns } = _phaseRuns(scores);
                if (!qualiRuns.length) { rows.push({ starter, noRuns: true }); continue; }
                const total = qualiRuns.reduce((a, r) => a + r.total, 0);
                const best = Math.max(...qualiRuns.map(r => r.total));
                const score = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? best : total;
                rows.push({ starter, qualiRuns, score, isFinal: finalistNums.has(starter.startNumber) });
            }
            rows.sort((a, b) => { if (a.dq || a.noRuns) return 1; if (b.dq || b.noRuns) return -1; return b.score - a.score; });
            return rows;
        }

        function _runBlock(run, ri, criteria) {
            const weighted = criteria.map((c, ci) =>
                _esc(c.shortLabel) + ' ' + run.scores.reduce((a, s) => a + _distributeRounded(s, criteria)[ci], 0)
            ).join(' / ');
            return '<div class="run-row"><strong class="run-total">' + (ri + 1) + ': ' + run.total + '</strong> <span class="run-crit">' + weighted + '</span></div>';
        }

        function _printQualiResults(groupName, rows, criteria) {
            const scoreLabel = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Gesamt';
            const qualiRuns = CONFIG.qualiRuns ?? '∞';
            const qualiRankOf = rows.map(r => (r.dq || r.noRuns) ? null : 1 + rows.filter(o => !o.dq && !o.noRuns && o.score > r.score).length);
            const tableRows = rows.map((r, i) => {
                const rank = qualiRankOf[i];
                if (r.dq) return `<tr class="excluded"><td class="rank">—</td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td class="score">—</td><td class="dq-cell">DSQ</td></tr>`;
                if (r.noRuns) return `<tr class="excluded"><td class="rank">—</td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td class="score">—</td><td>—</td></tr>`;
                const runBlocks = r.qualiRuns.map((run, ri) => _runBlock(run, ri, criteria)).join('');
                const finBadge = r.isFinal ? '<span class="fin-badge">FINAL</span>' : '';
                return `<tr><td class="rank">${rank}</td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}${finBadge}</td><td class="score">${r.score}</td><td class="runs-cell">${runBlocks}</td></tr>`;
            }).join('');
            const scored = rows.filter(r => !r.dq && !r.noRuns).length;
            const [time, date] = _nowTime();
            const kpi = _kpiChips([scored, 'Gewertet', 'kpi-chip-count']);
            return `<section>${_groupHead(groupName, kpi)}
                <table><thead><tr><th>Platz</th><th>Startnummer</th><th>Name</th><th style="text-align:center">${_esc(scoreLabel)}</th><th style="text-align:right">Läufe</th></tr></thead>
                <tbody>${tableRows}</tbody></table></section>`;
        }

        function _printFinalStartlist(groupName, finalEntries) {
            if (!finalEntries.length) {
                const [time, date] = _nowTime();
            const kpi = _kpiChips([0, 'Finalisten', 'kpi-chip-final']);
                return `<section>${_groupHead(groupName, kpi)}<p class="no-data-hint">Keine Finalisten für diese Startgruppe erfasst.</p></section>`;
            }
            const rows = finalEntries.map(e => `<tr>
                <td class="num"><span class="num-badge-final">${_esc(e.finalStartNumber ?? '—')}</span></td>
                <td class="num"><span class="num-badge">${_esc(e.startNumber ?? e.starter?.startNumber ?? '—')}</span></td>
                <td>${_esc(e.starter?.firstName ?? '')} ${_esc(e.starter?.lastName ?? '')}</td>
                </tr>`).join('');
            const [time, date] = _nowTime();
            const kpi = _kpiChips([finalEntries.length, 'Finalisten', 'kpi-chip-final']);
            return `<section>${_groupHead(groupName, kpi)}
                <div class="table-wrap"><table><thead><tr><th>Final-Startnummer</th><th>Startnummer</th><th>Name</th></tr></thead>
                <tbody>${rows}</tbody></table></div></section>`;
        }

        function _buildFinalResults(groupStarters, allScores, allFinalEntries, gid, finalistNums) {
            const rows = [];
            const entriesByNum = {};
            for (const fe of allFinalEntries.filter(fe => fe.startGroup?.objectId === gid))
                entriesByNum[fe.startNumber ?? fe.starter?.startNumber] = fe;
            for (const starter of groupStarters) {
                if (!finalistNums.has(starter.startNumber)) continue;
                if (starter.status === 'disqualified') { rows.push({ starter, dq: true, finalStartNum: '—' }); continue; }
                const scores = allScores.filter(s => String(s.startNumber) === String(starter.startNumber));
                const { finalRuns } = _phaseRuns(scores);
                const fe = entriesByNum[starter.startNumber];
                const finalStartNum = fe?.finalStartNumber ?? '—';
                if (!finalRuns.length) { rows.push({ starter, noRuns: true, finalStartNum }); continue; }
                const total = finalRuns.reduce((a, r) => a + r.total, 0);
                const best = Math.max(...finalRuns.map(r => r.total));
                const score = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? best : total;
                rows.push({ starter, finalRuns, score, finalStartNum });
            }
            rows.sort((a, b) => { if (a.dq || a.noRuns) return 1; if (b.dq || b.noRuns) return -1; return b.score - a.score; });
            return rows;
        }

        function _printFinalResults(groupName, rows, criteria) {
            if (!rows.length) {
                const [time, date] = _nowTime();
                const kpi = _kpiChips([0, 'Gewertet', 'kpi-chip-count']);
                return `<section>${_groupHead(groupName, kpi)}<p class="no-data-hint">Keine Finalisten für diese Startgruppe erfasst.</p></section>`;
            }
            const scoreLabel = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Gesamt';
            const finalRuns = CONFIG.finalRuns ?? '∞';
            const finalRankOf = rows.map(r => (r.dq || r.noRuns) ? null : 1 + rows.filter(o => !o.dq && !o.noRuns && o.score > r.score).length);
            const tableRows = rows.map((r, i) => {
                const rank = finalRankOf[i];
                if (r.dq) return `<tr class="excluded"><td class="rank">—</td><td class="num"><span class="num-badge-final">${_esc(r.finalStartNum)}</span></td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td class="score">—</td><td class="dq-cell">DSQ</td></tr>`;
                if (r.noRuns) return `<tr class="excluded"><td class="rank">—</td><td class="num"><span class="num-badge-final">${_esc(r.finalStartNum)}</span></td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td class="score">—</td><td>—</td></tr>`;
                const runBlocks = r.finalRuns.map((run, ri) => _runBlock(run, ri, criteria)).join('');
                const medal = rank === 1 ? ' 🥇' : rank === 2 ? ' 🥈' : rank === 3 ? ' 🥉' : '';
                return `<tr${rank !== null && rank <= 3 ? ` class="podium podium-${rank}"` : ''}><td class="rank">${rank ?? '—'}${medal}</td><td class="num"><span class="num-badge-final">${_esc(r.finalStartNum)}</span></td><td class="num"><span class="num-badge">${_esc(r.starter.startNumber)}</span></td><td>${_esc(r.starter.firstName ?? '')} ${_esc(r.starter.lastName ?? '')}</td><td class="score">${r.score}</td><td class="runs-cell">${runBlocks}</td></tr>`;
            }).join('');
            const scored = rows.filter(r => !r.dq && !r.noRuns).length;
            const [time, date] = _nowTime();
            const kpi = _kpiChips([scored, 'Gewertet', 'kpi-chip-count']);
            return `<section>${_groupHead(groupName, kpi)}
                <table><thead><tr><th>Platz</th><th>Final-Startnummer</th><th>Startnummer</th><th>Name</th><th style="text-align:center">${_esc(scoreLabel)}</th><th style="text-align:right">Läufe</th></tr></thead>
                <tbody>${tableRows}</tbody></table></section>`;
        }

        function _openPrintWindow(sectionsHtml, eventName) {
            const win = window.open('', '_blank');
            win.document.write(`<!DOCTYPE html><html lang="de"><head>

<style>

            win.document.close();
            win.focus();
            setTimeout(() => win.print(), 300);
        }

        async function printDoc(type, groupId) {
            const [allScores, allFinalEntries] = await Promise.all([
                ParseAPI.fetchAllJuryScores(),
                ParseAPI.fetchAllFinalEntries(),
            ]);
            const starters = allStarters.length ? allStarters : await ParseAPI.fetchStarters();
            const groups = allGroups.length ? allGroups : await ParseAPI.fetchStartGroups();
            const targetGroups = groupId === '__all__' ? groups : groups.filter(g => g.objectId === groupId);
            const eventName = CONFIG.eventName ?? 'WeRace';
            const criteria = CONFIG.criteria ?? [];
            const logoUrl = new URL('../assets/weraceLogo.png', document.location.href).href;
            const [printTime, printDate] = _nowTime();
            let sectionsHtml = '';
            if (type === 'startlist') {
                sectionsHtml += `<div class="doc-page-header"><img class="doc-logo" src="${logoUrl}" alt="WeRace"><div class="doc-event-name">${_esc(eventName)}</div>${_kpiChips([printDate, printTime, 'kpi-chip-time'])}</div><hr class="doc-hr">`;
            } else if (type === 'quali-results') {
                const chips = criteria.map(c => `<div class="criteria-chip"><span class="criteria-weight">${_esc(String(c.weight ?? '—'))}%</span><span class="criteria-name">${_esc(c.label)}</span></div>`).join('');
                sectionsHtml += `<div class="doc-page-header"><img class="doc-logo" src="${logoUrl}" alt="WeRace"><div class="doc-event-name">${_esc(eventName)}</div><span class="doc-event-subtitle">Ergebnisse Qualifikation</span><div class="criteria-row">${chips}</div>${_kpiChips([printDate, printTime, 'kpi-chip-time'])}</div><hr class="doc-hr">`;
            } else if (type === 'final-startlist') {
                sectionsHtml += `<div class="doc-page-header"><img class="doc-logo" src="${logoUrl}" alt="WeRace"><div class="doc-event-name">${_esc(eventName)}</div><span class="doc-event-subtitle">Startliste Finale</span>${_kpiChips([printDate, printTime, 'kpi-chip-time'])}</div><hr class="doc-hr">`;
            } else if (type === 'final-results') {
                const chips = criteria.map(c => `<div class="criteria-chip"><span class="criteria-weight">${_esc(String(c.weight ?? '—'))}%</span><span class="criteria-name">${_esc(c.label)}</span></div>`).join('');
                sectionsHtml += `<div class="doc-page-header"><img class="doc-logo" src="${logoUrl}" alt="WeRace"><div class="doc-event-name">${_esc(eventName)}</div><span class="doc-event-subtitle">Ergebnisse Finale</span><div class="criteria-row">${chips}</div>${_kpiChips([printDate, printTime, 'kpi-chip-time'])}</div><hr class="doc-hr">`;
            }
            for (const group of targetGroups) {
                const gid = group.objectId;
                const groupStarters = starters.filter(s => s.startGroup?.objectId === gid && s.status !== 'removed');
                const finalistNums = new Set(allFinalEntries.filter(fe => fe.startGroup?.objectId === gid).map(fe => fe.startNumber ?? fe.starter?.startNumber));
                if (type === 'startlist') {
                    sectionsHtml += _printStartlist(group.name, [...groupStarters].sort((a, b) => String(a.startNumber).localeCompare(String(b.startNumber), undefined, { numeric: true })));
                } else if (type === 'quali-results') {
                    sectionsHtml += _printQualiResults(group.name, _buildQualiResults(groupStarters, allScores, finalistNums), criteria);
                } else if (type === 'final-startlist') {
                    const finalEntries = allFinalEntries.filter(fe => fe.startGroup?.objectId === gid).sort((a, b) => String(b.finalStartNumber ?? '').localeCompare(String(a.finalStartNumber ?? ''), undefined, { numeric: true }));
                    sectionsHtml += _printFinalStartlist(group.name, finalEntries);
                } else if (type === 'final-results') {
                    sectionsHtml += _printFinalResults(group.name, _buildFinalResults(groupStarters, allScores, allFinalEntries, gid, finalistNums), criteria);
                }
            }
            _openPrintWindow(sectionsHtml, eventName);
        }

        // ── View switching ──
        function switchView(view) {
            document.getElementById('view-starter').style.display  = view === 'starter'  ? '' : 'none';
            document.getElementById('view-settings').style.display = view === 'settings' ? '' : 'none';
            document.getElementById('view-print').style.display    = view === 'print'    ? '' : 'none';
            document.querySelectorAll('.hnav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            window.scrollTo({ top: 0 });
        }

        document.getElementById('header-nav').addEventListener('click', e => {
            const btn = e.target.closest('.hnav-btn');
            if (btn) switchView(btn.dataset.view);
        });

        function renderAdminPanels() {
            // ── Settings view ──
            const sv = document.getElementById('view-settings');
            sv.innerHTML = '';
            const spBody = document.createElement('div');
            spBody.id = 'settings-panel-body';
            sv.appendChild(spBody);
            if (!_settingsDraft) _settingsDraft = _freshDraft();
            rebuildSettingsBody();

            // ── Print view ──
            const pv = document.getElementById('view-print');
            pv.innerHTML = '';
            const ppBody = document.createElement('div');
            ppBody.className = 'print-view';

            const pvTitle = document.createElement('div');
            pvTitle.className = 'print-view-title';
            pvTitle.textContent = 'Startgruppe';
            ppBody.appendChild(pvTitle);

            const sel = document.createElement('select');
            sel.className = 'print-group-select';
            sel.innerHTML = '<option value="__all__">Alle Startgruppen</option>';
            for (const g of allGroups) {
                const opt = document.createElement('option');
                opt.value = g.objectId; opt.textContent = g.name;
                sel.appendChild(opt);
            }
            ppBody.appendChild(sel);

            const btnTitle = document.createElement('div');
            btnTitle.className = 'print-view-title';
            btnTitle.textContent = 'Dokument';
            ppBody.appendChild(btnTitle);

            const btnRow = document.createElement('div');
            btnRow.className = 'print-btn-row';
            for (const { type, icon, label, phase } of [
                { type: 'startlist',       icon: '📋', label: 'Startliste',  phase: 'Qualifikation' },
                { type: 'quali-results',   icon: '📊', label: 'Ergebnisse',  phase: 'Qualifikation' },
                { type: 'final-startlist', icon: '🏁', label: 'Startliste',  phase: 'Finale' },
                { type: 'final-results',   icon: '🏆', label: 'Ergebnisse',  phase: 'Finale' },
            ]) {
                const btn = document.createElement('button');
                btn.className = 'print-btn';
                btn.innerHTML =
                    `<span class="print-btn-icon">${icon}</span>` +
                    `<span>${label}</span>` +
                    `<span class="print-btn-phase">${phase}</span>`;
                btn.addEventListener('click', async () => {
                    btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
                    try { await printDoc(type, sel.value); }
                    finally { btn.style.opacity = ''; btn.style.pointerEvents = ''; }
                });
                btnRow.appendChild(btn);
            }
            ppBody.appendChild(btnRow);
            pv.appendChild(ppBody);
        }

        async function loadStarters() {
            await ParseAPI.fetchEvent().catch(() => { });
            document.title = `${CONFIG.eventName} – Registrierung`;
            setStatus('Lade Starter …');
            try {
                const [starters, groups, qualiMap, finalMap] = await Promise.all([
                    ParseAPI.fetchStarters(),
                    ParseAPI.fetchStartGroups(),
                    ParseAPI.fetchScoreCountByStarter(),
                    ParseAPI.fetchFinalScoreCountByStarter(),
                ]);
                allStarters = starters;
                allGroups = groups;
                scoreMap = {};
                for (const num of new Set([...Object.keys(qualiMap), ...Object.keys(finalMap)])) {
                    scoreMap[num] = { quali: qualiMap[num] ?? 0, final: finalMap[num] ?? 0 };
                }
                renderTable(searchInput.value);
                renderAdminPanels();
                setStatus('');
            } catch (e) {
                setStatus(e.message, 'err');
            }
        }

        searchInput.addEventListener('input', () => renderTable(searchInput.value));

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                if (sortCol === th.dataset.col) {
                    sortDir *= -1;
                } else {
                    sortCol = th.dataset.col;
                    sortDir = 1;
                }
                updateSortHeaders();
                renderTable(searchInput.value);
            });
        });
        updateSortHeaders();

        // ── form modal ──
        function nextStartNumberForGroup(groupId) {
            const group = allGroups.find(g => g.objectId === groupId);
            if (!group) return '';
            const prefix = group.name.charAt(0).toUpperCase();
            const existing = allStarters
                .filter(s => typeof s.startNumber === 'string' && s.startNumber.toUpperCase().startsWith(prefix))
                .map(s => parseInt(s.startNumber.slice(prefix.length), 10))
                .filter(n => !isNaN(n));
            const next = existing.length ? Math.max(...existing) + 1 : 1;
            return `${prefix}${next}`;
        }

        async function openForm(starter = null) {
            editId = starter?.objectId ?? null;
            document.getElementById('form-title').textContent = starter ? 'Starter bearbeiten' : 'Starter hinzufügen';
            populateGroupSelect(starter?.startGroup?.objectId ?? '');
            document.getElementById('f-firstName').value = starter?.firstName ?? '';
            document.getElementById('f-lastName').value = starter?.lastName ?? '';
            const sc = starter ? (scoreMap[starter.startNumber] ?? { quali: 0, final: 0 }) : { quali: 0, final: 0 };
            const hasScores = sc.quali > 0 || sc.final > 0;
            const active = starter ? await ParseAPI.fetchActiveStarter() : null;
            const isActive = !!starter && active?.startNumber === starter?.startNumber;
            const locked = hasScores || isActive;
            const lockedMsg = isActive
                ? 'Kann nicht geändert werden – Starter ist gerade aktiv.'
                : hasScores
                    ? 'Kann nicht geändert werden – es existieren bereits Wertungen.'
                    : '';
            const numInput = document.getElementById('f-startNumber');
            numInput.disabled = locked;
            numInput.title = lockedMsg;
            const groupSel = document.getElementById('f-startGroup');
            groupSel.disabled = locked;
            groupSel.title = lockedMsg;
            if (starter) {
                numInput.value = starter.startNumber ?? '';
            } else {
                const groupId = document.getElementById('f-startGroup').value;
                numInput.value = groupId ? nextStartNumberForGroup(groupId) : '';
            }
            document.getElementById('f-gender').value = starter?.gender ?? '';
            const bd = starter?.birthday?.iso ?? starter?.birthday ?? '';
            document.getElementById('f-birthday').value = bd ? bd.slice(0, 10) : '';
            document.getElementById('form-err').textContent = '';
            document.getElementById('form-backdrop').classList.add('open');
            document.getElementById('f-startGroup').focus();
        }

        document.getElementById('f-startGroup').addEventListener('change', () => {
            const numInput = document.getElementById('f-startNumber');
            if (numInput.disabled) return;  // locked due to existing scores
            const groupId = document.getElementById('f-startGroup').value;
            numInput.value = groupId ? nextStartNumberForGroup(groupId) : '';
        });

        document.getElementById('add-btn').addEventListener('click', () => openForm());
        document.getElementById('form-cancel').addEventListener('click', () =>
            document.getElementById('form-backdrop').classList.remove('open'));

        document.getElementById('form-save').addEventListener('click', async () => {
            const startNumber = document.getElementById('f-startNumber').value.trim();
            const firstName = document.getElementById('f-firstName').value.trim();
            const lastName = document.getElementById('f-lastName').value.trim();
            const gender = document.getElementById('f-gender').value;
            const bdVal = document.getElementById('f-birthday').value;
            const groupId = document.getElementById('f-startGroup').value;

            if (!startNumber || !firstName || !lastName) {
                document.getElementById('form-err').textContent = 'Startnummer, Vor- und Nachname sind Pflichtfelder.';
                return;
            }

            if (allStarters.some(s => s.startNumber === startNumber && s.objectId !== editId)) {
                document.getElementById('form-err').textContent = `Startnummer ${startNumber} ist bereits vergeben.`;
                return;
            }

            const fields = {
                startNumber,
                firstName,
                lastName,
                gender: gender || undefined,
                birthday: bdVal ? { __type: 'Date', iso: new Date(bdVal).toISOString() } : undefined,
                startGroup: groupId
                    ? { __type: 'Pointer', className: 'HT_STARTGROUP', objectId: groupId }
                    : null,
            };

            document.getElementById('form-backdrop').classList.remove('open');
            setStatus('Speichere …');
            try {
                await ParseAPI.saveStarter(fields, editId);
                setStatus(editId ? 'Gespeichert.' : 'Hinzugefügt.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        // ── delete ──
        tableBody.addEventListener('click', async e => {
            const editBtn = e.target.closest('.icon-btn.edit');
            const delBtn = e.target.closest('.icon-btn.del');
            if (editBtn) {
                const s = allStarters.find(x => x.objectId === editBtn.dataset.id);
                if (s) openForm(s);
            }
            if (delBtn) {
                deleteId = delBtn.dataset.id;
                deleteName = delBtn.dataset.name;
                const deleteNum = delBtn.dataset.num;
                // Block deletion if this starter is currently on the floor
                const active = await ParseAPI.fetchActiveStarter();
                if (active?.startNumber === deleteNum) {
                    setStatus(`${deleteName} läuft gerade – bitte erst den Lauf abschliessen.`, 'err');
                    return;
                }
                const sc = scoreMap[delBtn.dataset.num] ?? { quali: 0, final: 0 };
                if (sc.quali || sc.final) {
                    const parts = [];
                    if (sc.quali) parts.push(`${sc.quali} Quali-Wertung${sc.quali !== 1 ? 'en' : ''}`);
                    if (sc.final) parts.push(`${sc.final} Final-Wertung${sc.final !== 1 ? 'en' : ''}`);
                    document.getElementById('del-results-name').textContent = deleteName;
                    document.getElementById('del-results-info').textContent =
                        `Vorhandene Ergebnisse: ${parts.join(', ')}`;
                    document.getElementById('del-results-backdrop').classList.add('open');
                } else {
                    document.getElementById('del-name').textContent = deleteName;
                    document.getElementById('del-backdrop').classList.add('open');
                }
            }
        });

        document.getElementById('del-cancel').addEventListener('click', () =>
            document.getElementById('del-backdrop').classList.remove('open'));

        document.getElementById('del-confirm').addEventListener('click', async () => {
            document.getElementById('del-backdrop').classList.remove('open');
            setStatus('Lösche …');
            try {
                await ParseAPI.deleteStarter(deleteId);
                setStatus('Gelöscht.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        document.getElementById('del-results-cancel').addEventListener('click', () =>
            document.getElementById('del-results-backdrop').classList.remove('open'));

        document.getElementById('del-results-confirm').addEventListener('click', async () => {
            document.getElementById('del-results-backdrop').classList.remove('open');
            setStatus('Lösche Ergebnisse und Starter …');
            const starter = allStarters.find(s => s.objectId === deleteId);
            try {
                await ParseAPI.deleteResultsForStarter(starter.startNumber, deleteId);
                await ParseAPI.deleteStarter(deleteId);
                setStatus('Starter und Ergebnisse gelöscht.', 'ok');
                await loadStarters();
            } catch (e) {
                setStatus(e.message, 'err');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await ParseAPI.logout();
            location.replace('../index.html');
        });

        // Session required — login and event selection happen on index.html
        (async () => {
            if (!ParseAPI.getSessionUser()) { location.replace('../index.html'); return; }
            const _user = ParseAPI.getSessionUser();
            document.getElementById('avatar-btn').textContent = _user[0].toUpperCase();
            document.getElementById('avatar-username').textContent = _user;
            document.getElementById('avatar-btn').addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('avatar-menu').classList.toggle('open');
            });
            document.addEventListener('click', () => document.getElementById('avatar-menu').classList.remove('open'));
            document.getElementById('login-display') && (document.getElementById('login-display').textContent = _user);
            loadStarters();
        })();
    </script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeRace – Anzeigetafel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="../config.js"></script>
<script src="../parse-api.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:      #0d1117;
        --card:    #161b22;
        --border:  #30363d;
        --text:    #e6edf3;
        --muted:   #8b949e;
        --accent:  #e05b3a;
        --green:   #3fb950;
        --gold:    #ffd700;
        --silver:  #c0c0c0;
        --bronze:  #cd7f32;
    }

    html, body {
        width: 100%; height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    #top-bar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.6rem 1.5rem;
        background: var(--card);
        border-bottom: 2px solid var(--accent);
        flex-shrink: 0;
    }

    #top-logo { height: 32px; }

    #top-center {
        display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
    }

    #top-event { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
    #top-group { font-size: 1.3rem; font-weight: 900; color: var(--text); letter-spacing: 0.02em; }

    #top-right { display: flex; align-items: center; gap: 0.75rem; }

    .phase-badge {
        font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
        padding: 0.2rem 0.6rem; border-radius: 999px;
    }
    .phase-badge.quali { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid var(--accent); }
    .phase-badge.final { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); border: 1px solid var(--gold); }

    #progress-bar-wrap {
        height: 3px; background: var(--border); flex-shrink: 0;
        position: relative; overflow: hidden;
    }
    #progress-bar {
        height: 100%; background: var(--accent);
        width: 0%; transition: none;
    }
    #progress-bar.paused { background: var(--border); }

    #content { flex: 1; overflow: hidden; padding: 1.2rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }

    /* ── Podium header (top 3 big) ── */
    #podium {
        display: grid; grid-template-columns: 1fr 1.15fr 1fr;
        gap: 0.75rem; flex-shrink: 0;
    }

    .podium-card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 12px; padding: 0.85rem 1rem;
        display: flex; align-items: center; gap: 0.75rem;
        position: relative; overflow: hidden;
        transition: transform 0.3s;
    }
    .podium-card.rank-1 { border-color: var(--gold);   order: 2; margin-top: 0; }
    .podium-card.rank-2 { border-color: var(--silver); order: 1; margin-top: 1.4rem; }
    .podium-card.rank-3 { border-color: var(--bronze); order: 3; margin-top: 2.4rem; }
    .podium-card:only-child { grid-column: 2; }

    .podium-rank {
        font-size: 2rem; font-weight: 900; line-height: 1;
        min-width: 2rem; text-align: center;
    }
    .rank-1 .podium-rank { color: var(--gold); font-size: 2.4rem; }
    .rank-2 .podium-rank { color: var(--silver); }
    .rank-3 .podium-rank { color: var(--bronze); }

    .podium-info { flex: 1; min-width: 0; }
    .podium-num { font-size: 0.7rem; color: var(--muted); font-weight: 700; display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
    .podium-name { font-size: 1.1rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-1 .podium-name { font-size: 1.25rem; color: var(--gold); }
    .rank-2 .podium-name { color: var(--silver); }
    .rank-3 .podium-name { color: var(--bronze); }
    .podium-group { font-size: 0.65rem; color: var(--muted); margin-top: 0.1rem; }
    .podium-criteria { margin-top: 0.25rem; }
    .podium-score { font-size: 1.5rem; font-weight: 900; color: var(--green); text-align: right; }
    .rank-1 .podium-score { font-size: 1.8rem; color: var(--gold); }
    .rank-2 .podium-score { color: var(--silver); }
    .rank-3 .podium-score { color: var(--bronze); }
    .podium-runs { text-align: right; margin-top: 0.1rem; }

    /* ── Table ── */
    #table-wrap { flex: 1; overflow: hidden; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; table-layout: fixed; }

    th {
        text-align: left; font-size: 0.6rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.1em;
        padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border);
    }

    td { padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }

    .col-rank  { width: 3rem; }
    .col-num   { width: 7rem; }
    .col-group { width: 10rem; }
    .col-name  { width: 10rem; }
    .col-runs  { width: 6rem; }
    .col-score { width: 6rem; }

    td.rank  { font-weight: 800; color: var(--muted); font-size: 0.85rem; }
    td.rank.r1 { color: var(--gold); }
    td.rank.r2 { color: var(--silver); }
    td.rank.r3 { color: var(--bronze); }
    .num-chip {
        font-size: 0.65rem; font-weight: 800; color: #fff;
        background: #58a6ff; border-radius: 4px; padding: 0.1rem 0.4rem;
        letter-spacing: 0.02em; white-space: nowrap;
    }
    .final-num-chip {
        font-size: 0.65rem; font-weight: 800; color: #ffd700;
        background: color-mix(in srgb, #ffd700 14%, transparent);
        border: 1px solid color-mix(in srgb, #ffd700 35%, transparent);
        border-radius: 4px; padding: 0.1rem 0.4rem;
        letter-spacing: 0.02em; white-space: nowrap;
    }
    td.score { font-weight: 800; color: var(--green); font-size: 1rem; }
    td.score.incomplete { color: var(--gold); }
    .runs-chip {
        font-size: 0.65rem; font-weight: 800; border-radius: 4px; padding: 0.1rem 0.45rem;
        letter-spacing: 0.02em; white-space: nowrap;
    }
    .runs-chip.done {
        color: var(--green);
        background: color-mix(in srgb, var(--green) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--green) 35%, transparent);
    }
    .runs-chip.open {
        color: var(--gold);
        background: color-mix(in srgb, var(--gold) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
    }
    td.group-cell { color: var(--muted); font-size: 0.8rem; }
    td.criteria-cell { font-size: 0.75rem; white-space: nowrap; text-align: right; }
    th.col-criteria  { text-align: right; }
    .crit-chip {
        display: inline-flex; align-items: stretch; border-radius: 4px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.09); margin-right: 0.2rem;
        font-size: 0.62rem; font-weight: 800; vertical-align: middle;
    }
    .crit-chip .cl {
        background: rgba(255,255,255,0.07); color: var(--muted);
        padding: 0.15rem 0.3rem; letter-spacing: 0.05em;
    }
    .crit-chip .cv {
        color: var(--text); padding: 0.15rem 0.35rem;
    }

    /* ── Flash animation for new scores ── */
    @keyframes flash { 0%,100%{background:transparent} 30%{background:color-mix(in srgb,var(--green) 15%,transparent)} }
    tr.flash { animation: flash 1.2s ease; }

    /* ── Slide transition ── */
    @keyframes slideIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .slide-in { animation: slideIn 0.4s ease; }

    /* ── No data ── */
    #empty { display:none; flex:1; align-items:center; justify-content:center; flex-direction:column; gap:0.75rem; }
    #empty .icon { font-size: 3rem; }
    #empty .msg { font-size: 1rem; color: var(--muted); }

    /* ── Group nav dots ── */
    #group-dots { display:flex; gap:0.4rem; align-items:center; }
    .g-dot { width:0.45rem; height:0.45rem; border-radius:50%; background:var(--border); transition:background 0.3s, transform 0.3s; }
    .g-dot.active { background:var(--accent); transform:scale(1.4); }

    /* ── Stop/Go button ── */
    #rotation-btn {
        font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
        padding: 0.25rem 0.75rem; border-radius: 999px; border: none; cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    #rotation-btn.running { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border: 1px solid var(--accent); }
    #rotation-btn.paused  { background: color-mix(in srgb, var(--green) 18%, transparent);  color: var(--green);  border: 1px solid var(--green); }


    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .live-dot { width:0.5rem; height:0.5rem; border-radius:50%; background:var(--green); animation:pulse 1.5s infinite; }

    /* ── Score popup ── */
    #score-popup {
        display:none; position:fixed; inset:0; z-index:200;
        background:rgba(0,0,0,0.75); align-items:center; justify-content:center;
    }
    #score-popup.open { display:flex; }
    .sp-card {
        background:var(--card); border:2px solid var(--green);
        border-radius:20px; padding:2rem 2.5rem;
        min-width:480px; max-width:640px; width:90%;
        display:flex; flex-direction:column; gap:1.2rem;
        animation:slideIn 0.35s ease;
    }
    .sp-header { display:flex; align-items:center; justify-content:space-between; }
    .sp-label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
    .sp-startnum { font-size:3.5rem; font-weight:900; color:var(--accent); line-height:1; }
    .sp-name { font-size:1.4rem; font-weight:800; color:var(--text); }
    .sp-run { font-size:0.75rem; color:var(--muted); margin-top:0.1rem; }
    .sp-judges { display:flex; flex-direction:column; gap:0.5rem; }
    .sp-judge-row {
        display:flex; align-items:center; justify-content:space-between;
        background:var(--bg); border-radius:10px; padding:0.6rem 0.9rem;
    }
    .sp-judge-name { font-size:0.85rem; font-weight:600; color:var(--muted); }
    .sp-judge-score { font-size:1.3rem; font-weight:900; color:var(--text); }
    .sp-total-row {
        display:flex; align-items:center; justify-content:space-between;
        border-top:1px solid var(--border); padding-top:0.75rem;
    }
    .sp-total-label { font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
    .sp-total-val { font-size:2.5rem; font-weight:900; color:var(--green); }
    .sp-progress { height:4px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:0.5rem; }
    .sp-progress-bar { height:100%; background:var(--green); width:100%; transition:width 0.1s linear; }
</style>
</head>
<body>
<div id="app">
    <div id="top-bar">
        <img id="top-logo" src="../assets/weraceLogo.png" alt="WeRace">
        <div id="top-center">
            <div id="top-event">WeRace</div>
            <div id="top-group">—</div>
            <span class="phase-badge quali" id="phase-badge">Qualifikation</span>
        </div>
        <div id="top-right">
            <div class="live-dot"></div>
            <button id="rotation-btn" class="running">&#9646;&#9646; Stop</button>
            <div id="group-dots"></div>
        </div>
    </div>

    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

    <div id="content">
        <div id="podium"></div>
        <div id="table-wrap">
            <table id="results-table">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-num">Nr.</th>
                        <th class="col-score">Score</th>
                        <th class="col-runs">Läufe</th>
                        <th class="col-name">Name</th>
                        <th class="col-criteria">Kriterien</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
        <div id="empty"><div class="icon">⏳</div><div class="msg">Noch keine Wertungen</div></div>
    </div>
</div>

<div id="score-popup">
    <div class="sp-card">
        <div class="sp-header">
            <div>
                <div class="sp-label">Startnummer</div>
                <div class="sp-startnum" id="sp-startnum">—</div>
            </div>
            <div style="text-align:right">
                <div class="sp-name" id="sp-name">—</div>
                <div class="sp-run" id="sp-run">—</div>
            </div>
        </div>
        <div class="sp-judges" id="sp-judges"></div>
        <div class="sp-total-row">
            <div class="sp-total-label">Gesamt</div>
            <div class="sp-total-val" id="sp-total">—</div>
        </div>
        <div class="sp-progress"><div class="sp-progress-bar" id="sp-progress-bar"></div></div>
    </div>
</div>

<script>
const _seedOverride = localStorage.getItem('seedEventOverride');
if (_seedOverride) CONFIG.eventObjectId = _seedOverride;
// Allow event to be passed via URL: display.html?event=<objectId>
const _urlEvent = new URLSearchParams(location.search).get('event');
if (_urlEvent) CONFIG.eventObjectId = _urlEvent;
</script>
<script>
(async () => {
    // ── State ──
    let starters = [], allScores = [], allFinalEntries = [], startGroups = [];
    let currentGroupIdx = 0;
    let rotationTimer = null;
    let progressInterval = null;
    let rotationPaused = false;
    const ROTATION_MS = 8000;

    // ── Scoring helpers (same logic as results.html) ──
    function calcJudgeTotal(s) {
        return Math.round(CONFIG.criteria.reduce((a, c) =>
            a + (s[c.key] ?? 0) * ((c.weight ?? (100 / CONFIG.criteria.length)) / 100), 0));
    }

    function distributeRounded(s, total) {
        const exact = CONFIG.criteria.map(c =>
            (s[c.key] ?? 0) * ((c.weight ?? (100 / CONFIG.criteria.length)) / 100));
        const floors = exact.map(Math.floor);
        const remainder = total - floors.reduce((a, b) => a + b, 0);
        exact.map((v, i) => ({ i, frac: v - floors[i] }))
            .sort((a, b) => b.frac - a.frac)
            .slice(0, remainder)
            .forEach(({ i }) => floors[i]++);
        return floors;
    }

    function bestRunCriteriaHtml(runs) {
        if (!runs.length) return '';
        const best = runs.reduce((a, b) => b.total > a.total ? b : a);
        const vals = CONFIG.criteria.map((c, ci) =>
            best.scores.reduce((a, s) => a + distributeRounded(s, calcJudgeTotal(s))[ci], 0));
        return CONFIG.criteria.map((c, ci) =>
            `<span class="crit-chip"><span class="cl">${c.shortLabel}</span><span class="cv">${vals[ci]}</span></span>`
        ).join('');
    }

    function deduplicateByJudge(scores) {
        const latest = new Map();
        for (const s of scores) latest.set(s.judgeName, s);
        return [...latest.values()];
    }

    function groupByRunNumber(scores) {
        if (!scores.length) return [];
        const hasRN = scores.some(s => s.runNumber != null);
        if (hasRN) {
            const byRun = {};
            for (const s of scores) { const r = s.runNumber ?? 1; if (!byRun[r]) byRun[r] = []; byRun[r].push(s); }
            return Object.keys(byRun).map(Number).sort((a,b)=>a-b)
                .map(r => { const d = deduplicateByJudge(byRun[r]); return { scores: d, total: d.reduce((a,s)=>a+calcJudgeTotal(s),0) }; });
        }
        const runs = []; let chunk = []; const seen = new Set();
        for (const s of scores) {
            if (seen.has(s.judgeName)) {
                if (chunk.length) { const d = deduplicateByJudge(chunk); runs.push({ scores: d, total: d.reduce((a,s)=>a+calcJudgeTotal(s),0) }); }
                chunk = [s]; seen.clear(); seen.add(s.judgeName);
            } else { chunk.push(s); seen.add(s.judgeName); }
        }
        if (chunk.length) { const d = deduplicateByJudge(chunk); runs.push({ scores: d, total: d.reduce((a,s)=>a+calcJudgeTotal(s),0) }); }
        return runs;
    }

    function scoreToPhaseRuns(scores) {
        const hasPhase = scores.some(s => s.phase != null);
        if (hasPhase) {
            return {
                qualiRuns: groupByRunNumber(scores.filter(s => (s.phase??'quali')==='quali')),
                finalRuns: groupByRunNumber(scores.filter(s => s.phase==='final')),
            };
        }
        const allRuns = groupByRunNumber(scores);
        const qc = CONFIG.qualiRuns ?? allRuns.length;
        return { qualiRuns: allRuns.slice(0, qc), finalRuns: allRuns.slice(qc) };
    }

    function buildResultsForGroup(gid) {
        const finalistNums = new Set(allFinalEntries
            .filter(fe => fe.startGroup?.objectId === gid)
            .map(fe => fe.startNumber ?? fe.starter?.startNumber));
        const groupStarters = starters.filter(s =>
            s.startGroup?.objectId === gid &&
            s.status !== 'disqualified' && s.status !== 'removed');

        const byStarter = {};
        for (const s of allScores) { const n = s.startNumber; if (!byStarter[n]) byStarter[n] = []; byStarter[n].push(s); }

        const results = [];
        for (const starter of groupStarters) {
            const scores = byStarter[starter.startNumber] ?? [];
            const isFinal = finalistNums.has(starter.startNumber);
            const finalEntry = allFinalEntries.find(fe =>
                String(fe.startNumber ?? fe.starter?.startNumber) === String(starter.startNumber));
            const finalStartNumber = finalEntry?.finalStartNumber ?? null;
            const { qualiRuns, finalRuns } = scoreToPhaseRuns(scores);
            if (isFinal ? !finalRuns.length : !qualiRuns.length) continue;

            const qualiCount = CONFIG.qualiRuns ?? qualiRuns.length;
            const finalCount = CONFIG.finalRuns ?? 0;
            const qualiTotal = qualiRuns.reduce((a,r)=>a+r.total,0);
            const qualiBest  = qualiRuns.length ? Math.max(...qualiRuns.map(r=>r.total)) : 0;
            const qualiScore = (CONFIG.qualiScoreMode??'sum')==='best' ? qualiBest : qualiTotal;
            const finalTotal = finalRuns.reduce((a,r)=>a+r.total,0);
            const finalBest  = finalRuns.length ? Math.max(...finalRuns.map(r=>r.total)) : 0;
            const finalScore = (CONFIG.finalScoreMode??'sum')==='best' ? finalBest : finalTotal;
            const best = isFinal ? finalScore : qualiScore;
            const complete = isFinal
                ? (!finalCount || finalRuns.length >= finalCount)
                : (!qualiCount || qualiRuns.length >= qualiCount);
            const criteriaHtml = bestRunCriteriaHtml(isFinal ? finalRuns : qualiRuns);
            results.push({ num: starter.startNumber, starter, qualiRuns, finalRuns, qualiCount, finalCount, isFinal, finalStartNumber, qualiScore, finalScore, best, complete, criteriaHtml });
        }

        results.sort((a,b) => {
            const aHF = a.isFinal && a.finalRuns.length > 0;
            const bHF = b.isFinal && b.finalRuns.length > 0;
            if (aHF !== bHF) return aHF ? -1 : 1;
            return b.best - a.best;
        });

        let rank = 1;
        results.forEach((r, i) => {
            if (i > 0 && r.best === results[i-1].best) r.rank = results[i-1].rank;
            else r.rank = rank;
            rank = i + 1 + 1;
        });
        return results;
    }

    function isGroupFinal(gid) {
        return startGroups.find(sg => sg.objectId === gid)?.qualiClosed ?? false;
    }

    // ── Render ──
    function render() {
        if (!startGroups.length) return;
        const sg = startGroups[currentGroupIdx];
        if (!sg) return;

        const results = buildResultsForGroup(sg.objectId);
        const isFinal = isGroupFinal(sg.objectId);

        // Top bar
        document.getElementById('top-event').textContent = CONFIG.eventName ?? 'WeRace';
        document.getElementById('top-group').textContent = sg.name;
        const pb = document.getElementById('phase-badge');
        pb.textContent = isFinal ? 'Finale' : 'Qualifikation';
        pb.className = 'phase-badge ' + (isFinal ? 'final' : 'quali');

        // Group dots
        const dotsEl = document.getElementById('group-dots');
        dotsEl.innerHTML = '';
        startGroups.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'g-dot' + (i === currentGroupIdx ? ' active' : '');
            dotsEl.appendChild(d);
        });

        // Empty state
        const empty = document.getElementById('empty');
        if (!results.length) {
            document.getElementById('podium').style.display = 'none';
            document.getElementById('table-wrap').style.display = 'none';
            empty.style.display = 'flex';
            return;
        }
        empty.style.display = 'none';
        document.getElementById('table-wrap').style.display = '';

        // Podium (top 1–3, always shown when results exist)
        const podiumEl = document.getElementById('podium');
        const top3 = results.slice(0, 3);
        podiumEl.style.display = 'grid';
        podiumEl.innerHTML = '';
        top3.forEach(r => {
            const rankClass = `rank-${Math.min(r.rank, 3)}`;
            const runsLabel = r.isFinal
                ? `${r.finalRuns.length}${r.finalCount ? '/'+r.finalCount : ''} Final-Läufe`
                : `${r.qualiRuns.length}${r.qualiCount ? '/'+r.qualiCount : ''} Quali-Läufe`;
            const card = document.createElement('div');
            card.className = `podium-card ${rankClass} slide-in`;
            card.innerHTML = `
                <div class="podium-rank">${r.rank}</div>
                <div class="podium-info">
                    <div class="podium-num">
                        ${r.isFinal && r.finalStartNumber ? `<span class="final-num-chip">${r.finalStartNumber}</span>` : `<span class="num-chip">#${r.num}</span>`}
                    </div>
                    <div class="podium-name">${r.starter?.firstName ?? ''} ${r.starter?.lastName ?? ''}</div>
                    ${r.criteriaHtml ? `<div class="podium-criteria">${r.criteriaHtml}</div>` : ''}
                </div>
                <div>
                    <div class="podium-score">${r.best.toFixed(0)}</div>
                    <div class="podium-runs"><span class="runs-chip ${r.complete?'done':'open'}">${runsLabel}</span></div>
                </div>`;
            podiumEl.appendChild(card);
        });

        // Table (rank 4+)
        const tableResults = results.slice(3);
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';
        tableResults.forEach(r => {
            const runsLabel = r.isFinal
                ? `${r.finalRuns.length}${r.finalCount?'/'+r.finalCount:''} F`
                : `${r.qualiRuns.length}${r.qualiCount?'/'+r.qualiCount:''} Q`;
            const rankCls = r.rank <= 3 ? ` r${r.rank}` : '';
            const tr = document.createElement('tr');
            tr.innerHTML =
                `<td class="rank${rankCls}">${r.rank}</td>` +
                `<td class="num">${r.isFinal && r.finalStartNumber ? `<span class="final-num-chip">${r.finalStartNumber}</span>` : `<span class="num-chip">#${r.num}</span>`}</td>` +
                `<td class="score${r.complete?'':' incomplete'}">${r.best.toFixed(0)}</td>` +
                `<td><span class="runs-chip ${r.complete?'done':'open'}">${runsLabel}</span></td>` +
                `<td>${r.starter?.firstName ?? ''} ${r.starter?.lastName ?? ''}</td>` +
                `<td class="criteria-cell">${r.criteriaHtml || '—'}</td>`;
            tbody.appendChild(tr);
        });
    }

    // ── Auto-rotation ──
    const ROTATION_EMPTY_MS = 3000;

    function startRotation() {
        stopRotation();
        if (rotationPaused || startGroups.length <= 1) return;

        const sg = startGroups[currentGroupIdx];
        const results = sg ? buildResultsForGroup(sg.objectId) : [];
        const delay = results.length ? ROTATION_MS : ROTATION_EMPTY_MS;

        let elapsed = 0;
        const bar = document.getElementById('progress-bar');
        bar.classList.remove('paused');
        bar.style.transition = 'none';
        bar.style.width = '0%';

        progressInterval = setInterval(() => {
            elapsed += 100;
            const pct = Math.min((elapsed / delay) * 100, 100);
            bar.style.transition = 'width 0.1s linear';
            bar.style.width = pct + '%';
        }, 100);

        rotationTimer = setTimeout(() => {
            currentGroupIdx = (currentGroupIdx + 1) % startGroups.length;
            render();
            startRotation();
        }, delay);
    }

    function stopRotation() {
        clearTimeout(rotationTimer);
        clearInterval(progressInterval);
        const bar = document.getElementById('progress-bar');
        bar.style.transition = 'none';
        bar.classList.add('paused');
    }

    function updateRotationBtn() {
        const btn = document.getElementById('rotation-btn');
        if (rotationPaused) { btn.textContent = '▶ Go'; btn.className = 'paused'; }
        else { btn.innerHTML = '&#9646;&#9646; Stop'; btn.className = 'running'; }
    }

    document.getElementById('rotation-btn').addEventListener('click', () => {
        rotationPaused = !rotationPaused;
        updateRotationBtn();
        if (rotationPaused) stopRotation();
        else startRotation();
    });

    // ── Data refresh ──
    async function refresh() {
        [starters, allScores, allFinalEntries] = await Promise.all([
            ParseAPI.fetchStarters(),
            ParseAPI.fetchAllJuryScores(),
            ParseAPI.fetchAllFinalEntries(),
        ]);
        render();
    }

    // ── Init ──
    await Promise.all([ParseAPI.fetchEvent(), ParseAPI.fetchJudges()]).catch(()=>{});
    document.getElementById('top-event').textContent = CONFIG.eventName ?? 'WeRace';
    document.title = `${CONFIG.eventName ?? 'WeRace'} – Anzeigetafel`;

    startGroups = await ParseAPI.fetchStartGroups();
    await refresh();
    startRotation();

    // ── Score popup ──
    const POPUP_MS = 5000;
    let popupTimer = null;
    // pendingRuns: key = `${startnumber}_${runNumber}_${phase}` → { scores: {judgeName→score}, runNumber, phase }
    const pendingRuns = {};

    function judgeCount() { return Object.keys(CONFIG.judgeTokens ?? {}).length || 1; }

    function showPopup(startnumber, runKey, runScores, runNumber, phase) {
        stopRotation();
        clearTimeout(popupTimer);

        const starter = starters.find(s => s.startNumber === startnumber);
        const name = starter ? `${starter.firstName ?? ''} ${starter.lastName ?? ''}`.trim() : `#${startnumber}`;
        const groupName = starter?.startGroup?.name ?? '';
        const phaseLabel = phase === 'final' ? 'Finale' : 'Qualifikation';
        const total = Object.values(runScores).reduce((a, s) => a + calcJudgeTotal(s), 0);

        document.getElementById('sp-startnum').textContent = `#${startnumber}`;
        document.getElementById('sp-name').textContent = name;
        document.getElementById('sp-run').textContent = `${groupName ? groupName + ' · ' : ''}${phaseLabel} · Lauf ${runNumber}`;
        document.getElementById('sp-total').textContent = total;

        const judgesEl = document.getElementById('sp-judges');
        judgesEl.innerHTML = '';
        for (const [judge, s] of Object.entries(runScores)) {
            const row = document.createElement('div');
            row.className = 'sp-judge-row';
            row.innerHTML = `<span class="sp-judge-name">${judge}</span><span class="sp-judge-score">${calcJudgeTotal(s)}</span>`;
            judgesEl.appendChild(row);
        }

        document.getElementById('score-popup').classList.add('open');

        // Progress bar countdown
        const bar = document.getElementById('sp-progress-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        let elapsed = 0;
        const tick = setInterval(() => {
            elapsed += 100;
            bar.style.transition = 'width 0.1s linear';
            bar.style.width = Math.max(0, 100 - (elapsed / POPUP_MS) * 100) + '%';
        }, 100);

        popupTimer = setTimeout(async () => {
            clearInterval(tick);
            document.getElementById('score-popup').classList.remove('open');
            delete pendingRuns[runKey];
            // Switch to the group this starter belongs to
            const sg = starters.find(s => s.startNumber === startnumber)?.startGroup?.objectId;
            if (sg) {
                const idx = startGroups.findIndex(g => g.objectId === sg);
                if (idx !== -1) currentGroupIdx = idx;
            }
            await refresh();
            startRotation();
        }, POPUP_MS);
    }

    function onNewScore(score) {
        const key = `${score.startNumber}_${score.runNumber ?? 1}_${score.phase ?? 'quali'}`;
        if (!pendingRuns[key]) pendingRuns[key] = { scores: {}, runNumber: score.runNumber ?? 1, phase: score.phase ?? 'quali' };
        pendingRuns[key].scores[score.judgeName] = score;
        if (Object.keys(pendingRuns[key].scores).length >= judgeCount()) {
            showPopup(score.startNumber, key, pendingRuns[key].scores, pendingRuns[key].runNumber, pendingRuns[key].phase);
        }
    }

    // ── LiveQuery ──
    ParseAPI.subscribeAllJuryScores(async () => {
        await refresh();
    }, onNewScore);

    ParseAPI.subscribeStartGroups(async msg => {
        const sg = startGroups.find(g => g.objectId === msg.object?.objectId);
        if (sg && msg.object != null) sg.qualiClosed = msg.object.qualiClosed;
        render();
    });

    ParseAPI.subscribeFinalEntries(async () => {
        allFinalEntries = await ParseAPI.fetchAllFinalEntries();
        render();
    });

    ParseAPI.subscribeStarters(async () => {
        starters = await ParseAPI.fetchStarters();
        render();
    });
})();
</script>
</body>
</html>

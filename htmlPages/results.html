<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergebnisse</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="../jury.css">
    <style>
        .results-controls {
            flex-shrink: 0;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 0.5rem 1rem 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-fieldset,
        .filter-fieldset {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.35rem 0.75rem 0.5rem;
            margin: 0;
        }

        .info-fieldset legend,
        .filter-fieldset legend {
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            padding: 0 0.35rem;
        }

        .weight-legend {
            font-size: 0.68rem;
            color: var(--muted);
            text-align: center;
            padding-top: 0.15rem;
        }

        .results-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0.5rem 1rem 1rem;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        .result-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: start;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            cursor: pointer;
            user-select: none;
        }

        .result-rank-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .result-rank-group .result-rank,
        .result-rank-group .result-final-num {
            min-width: 2.3rem;
            text-align: center;
            box-sizing: border-box;
        }

        .result-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
        }

        .result-score-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .result-run-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.3rem;
            border-top: 1px solid var(--border);
            padding-top: 0.3rem;
            margin-top: 0.05rem;
        }

        .result-header:active {
            background: var(--border);
        }

        .result-rank {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--muted);
            text-align: right;
        }

        .result-rank.top1 {
            color: #ffd700;
        }

        .result-rank.top2 {
            color: #c0c0c0;
        }

        .result-rank.top3 {
            color: #cd7f32;
        }

        .result-name {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            row-gap: 0.25rem;
            align-items: center;
            gap: 0.4rem;
            border-top: 1px solid var(--border);
            padding-top: 0.3rem;
            margin-top: 0.05rem;
        }

        /* ── Quali start number chip ── */
        .result-num {
            font-size: 0.65rem;
            font-weight: 800;
            color: #fff;
            background: var(--num);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        /* ── Final start number chip — sits next to the rank, lighter fill so it stays secondary ── */
        .result-final-num {
            font-size: 0.8rem;
            font-weight: 800;
            color: #ffd700;
            background: color-mix(in srgb, #ffd700 14%, transparent);
            border: 1px solid color-mix(in srgb, #ffd700 35%, transparent);
            border-radius: 4px;
            padding: 0.1rem 0.45rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        /* ── Start group badge — tinted by the group's own identity color (inline style) ── */
        .result-group-badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            white-space: nowrap;
        }

        .group-color-dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            margin-right: 0.35rem;
            vertical-align: middle;
        }

        /* ── Selected group filter chip uses the group's own color, not the generic accent ── */
        #group-chips .fchip.active {
            background: var(--group-color);
            border-color: var(--group-color);
            color: #fff;
        }

        /* ── Run-status chip (Quali progress) ── */
        .result-runs-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            white-space: nowrap;
        }

        .result-runs-badge.complete {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 15%, transparent);
        }

        /* ── Final run-status chip: grey / yellow / green ── */
        .result-runs-badge.final-none {
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
        }

        .result-runs-badge.final-partial {
            color: #e3a007;
            background: color-mix(in srgb, #e3a007 15%, transparent);
        }

        .result-runs-badge.final-done {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 15%, transparent);
        }

        /* ── Quali score chip — always visible, unobtrusive ── */
        .result-quali-pill {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            white-space: nowrap;
        }

        /* ── Per-run score pills (right side) ── */
        .result-run-pill {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            background: var(--border);
            border-radius: 4px;
            padding: 0.05rem 0.35rem;
            white-space: nowrap;
        }

        .result-run-pill.best {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 18%, transparent);
            outline: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
        }

        .result-run-pill.pending {
            color: color-mix(in srgb, var(--muted) 45%, transparent);
            background: color-mix(in srgb, var(--border) 40%, transparent);
            font-weight: 400;
        }

        .result-first {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }

        .result-last {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }

        .result-name-row {
            display: flex;
            align-items: center;
            min-height: 1.7rem;
            gap: 0.4rem;
            min-width: 0;
        }

        .result-fullname {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.2rem 0.35rem;
            min-width: 0;
        }

        .result-best {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--green);
            white-space: nowrap;
        }

        .result-best.incomplete {
            color: var(--muted);
        }

        .result-runs {
            border-top: 1px solid var(--border);
            display: none;
        }

        .result-card.open .result-runs {
            display: block;
        }

        .run-row {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 0.75rem;
        }

        .run-row:last-child {
            border-bottom: none;
        }

        .run-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .run-judges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .run-judge-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            min-width: 3rem;
        }

        .run-judge-chip.has-criteria {
            cursor: pointer;
            user-select: none;
        }

        .run-judge-chip.has-criteria:active {
            background: var(--border);
        }

        .run-judge-name {
            font-size: 0.6rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .run-judge-score-row {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .run-judge-score {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--green);
        }

        .run-judge-chevron {
            font-size: 0.5rem;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .run-judge-chip.open .run-judge-chevron {
            transform: rotate(180deg);
        }

        .run-judge-criteria {
            display: none;
            gap: 0.3rem;
            margin-top: 0.2rem;
        }

        .run-judge-chip.open .run-judge-criteria {
            display: flex;
        }

        .run-judge-crit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            min-width: 1.6rem;
            background: rgba(255,255,255,0.04);
            border-radius: 3px;
            padding: 0.1rem 0.25rem;
        }

        .run-judge-crit-label {
            font-size: 0.42rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .run-judge-crit-raw {
            font-size: 0.52rem;
            color: var(--accent);
            line-height: 1.2;
        }

        .run-judge-crit-divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 0.1rem 0;
        }

        .run-judge-crit-w {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--green);
            line-height: 1.2;
        }

        .run-total {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            background: var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.5rem;
            text-align: right;
            white-space: nowrap;
            align-self: center;
        }

        .run-total.best-run-total {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 18%, transparent);
            outline: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
        }

        .results-empty {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            padding: 3rem 1rem;
        }

        /* Excluded starters expansion panels */
        .excl-panel {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            overflow: hidden;
            background: var(--card);
        }

        .excl-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            cursor: pointer;
            user-select: none;
            gap: 0.6rem;
        }

        .excl-panel-header:active {
            background: var(--border);
        }

        .excl-panel-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .excl-panel-title.dq {
            color: #e74c3c;
        }

        .excl-panel-title.removed {
            color: var(--muted);
        }

        .excl-count {
            font-size: 0.65rem;
            font-weight: 600;
            background: var(--border);
            color: var(--muted);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
        }

        .excl-chevron {
            font-size: 0.7rem;
            color: var(--muted);
            margin-left: auto;
            transition: transform 0.2s;
        }

        .excl-panel.open .excl-chevron {
            transform: rotate(180deg);
        }

        .excl-body {
            display: none;
            border-top: 1px solid var(--border);
        }

        .excl-panel.open .excl-body {
            display: block;
        }

        .excl-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            opacity: 0.6;
        }

        .excl-item:last-child {
            border-bottom: none;
        }

        .results-count-label {
            padding: 0.4rem 0.25rem 0.25rem;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .ranking-mode-label {
            padding: 0 0.25rem 0.4rem;
            font-size: 0.65rem;
            color: var(--muted);
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .ranking-mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .ranking-mode-badge .mode-val {
            font-weight: 700;
            color: var(--text);
        }

        .live-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        .group-mode-badge {
            font-size: 0.55rem;
            font-weight: 700;
            border-radius: 3px;
            padding: 0.1rem 0.3rem;
            vertical-align: middle;
            margin-left: 0.25rem;
            white-space: nowrap;
        }

        .group-mode-badge.quali-idle {
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
        }

        .group-mode-badge.quali-running {
            color: #e3a007;
            background: color-mix(in srgb, #e3a007 18%, transparent);
        }

        .group-mode-badge.quali-done {
            color: var(--green);
            background: color-mix(in srgb, var(--green) 18%, transparent);
        }

        .group-mode-badge.final-idle {
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 12%, transparent);
        }

        .group-mode-badge.final-running {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .group-mode-badge.final-done {
            color: #ffd700;
            background: color-mix(in srgb, #ffd700 18%, transparent);
        }

        .value-mode-row {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 0.3rem;
        }

        .value-mode-toggle {
            display: flex;
            gap: 0.1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.1rem;
        }

        .value-mode-btn {
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.12rem 0.35rem;
            border-radius: 3px;
            color: var(--muted);
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .value-mode-btn[data-mode="raw"].active {
            background: var(--accent);
            color: #fff;
        }

        .value-mode-btn[data-mode="weighted"].active {
            background: var(--green);
            color: #fff;
        }

        #results-list.mode-raw .run-judge-crit-w,
        #results-list.mode-raw .run-judge-crit-divider {
            display: none;
        }

        #results-list.mode-weighted .run-judge-crit-raw,
        #results-list.mode-weighted .run-judge-crit-divider {
            display: none;
        }

        #results-list.mode-raw .run-judge-crit-raw {
            font-size: 0.6rem;
        }

        #results-list.mode-weighted .run-judge-crit-w {
            font-size: 0.62rem;
        }

        .run-row.missing {
            opacity: 0.35;
        }

        .run-row.best-run {
            background: color-mix(in srgb, var(--green) 6%, transparent);
            border-left: 2px solid color-mix(in srgb, var(--green) 50%, transparent);
        }

        .run-row.quali-row:not(.best-run) {
            background: color-mix(in srgb, var(--text) 14%, transparent);
        }

        .run-row.quali-row:not(.best-run) .run-judge-chip {
            opacity: 0.55;
        }

        .run-row.dim {
            opacity: 0.5;
        }

        .run-missing-text {
            font-size: 0.7rem;
            font-style: italic;
            color: var(--muted);
        }

        .quali-reveal-toggle {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
            padding: 0.4rem 1rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted);
            background: none;
            border: none;
            border-top: 1px solid var(--border);
            cursor: pointer;
            text-align: left;
        }

        .quali-reveal-toggle:active {
            background: var(--border);
        }

        .quali-reveal-chevron {
            font-size: 0.6rem;
            transition: transform 0.2s;
        }

        .quali-reveal.open .quali-reveal-chevron {
            transform: rotate(180deg);
        }

        .quali-reveal-body {
            display: none;
        }

        .quali-reveal.open .quali-reveal-body {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-group">
            <div class="header-label">WeRace</div>
            <div class="header-value" style="color:var(--accent)" id="event-name">Ergebnisse</div>
        </div>
        <div class="header-group" id="group-header" style="display:none">
            <div class="header-label" id="group-header-label">Gruppe</div>
            <div class="header-value" id="group-header-value">—</div>
        </div>
        <div class="header-group">
            <div class="header-label">Starter</div>
            <div class="header-value" id="starter-count">—</div>
        </div>
        <div class="header-group">
            <div class="header-label">Live</div>
            <div class="header-value"><span class="live-dot"></span></div>
        </div>
    </header>

    <div class="content-center">
        <div class="results-controls">
            <fieldset class="info-fieldset" id="info-fieldset" style="display:none">
                <legend>Wertung</legend>
                <div class="ranking-mode-label" id="ranking-mode-label"></div>
                <div class="weight-legend" id="weight-legend" style="display:none"></div>
                <div class="value-mode-row" id="value-mode-row" style="display:none">
                    <span class="value-mode-toggle">
                        <button type="button" class="value-mode-btn" data-mode="raw">Roh</button>
                        <button type="button" class="value-mode-btn active" data-mode="weighted">Gewichtet</button>
                    </span>
                </div>
            </fieldset>
            <fieldset class="filter-fieldset" id="filter-fieldset" style="display:none">
                <legend>Gruppe</legend>
                <div id="group-chips" class="filter-chips" style="flex-wrap:wrap;justify-content:center"></div>
            </fieldset>
        </div>
        <div class="results-list" id="results-list">
            <div class="results-empty">Lade Ergebnisse …</div>
        </div>
    </div>

    <footer>
        <img src="../assets/weraceLogo.png" alt="WeRace">
    </footer>

    <script src="../config.js"></script>
    <script>
        // Allow seed.html to redirect results to the test event
        const _seedOverride = localStorage.getItem('seedEventOverride');
        if (_seedOverride) CONFIG.eventObjectId = _seedOverride;
    </script>
    <script src="../parse-api.js"></script>
    <script>
        let starters = [];
        let allScores = [];
        let allFinalEntries = [];
        let filterGroup = null;
        let startGroups = [];
        let valueMode = 'weighted';

        // Stable per-group identity color — assigned by alphabetical position so it
        // stays the same across renders regardless of phase/status.
        const GROUP_COLORS = ['#58a6ff', '#bc8cff', '#f778ba', '#3fb950', '#ffa657', '#39c5cf', '#ff7b72', '#e3b341'];
        const groupColorMap = new Map();
        function groupColor(groupId) {
            return groupId ? groupColorMap.get(groupId) : null;
        }

        // Split a flat score array into { qualiRuns, finalRuns } using the phase field.
        // Falls back to runNumber-based grouping when phase is missing (old records),
        // and to judge-repeat boundary detection when runNumber is also missing.
        function scoreToPhaseRuns(scores) {
            const hasPhase = scores.some(s => s.phase != null);
            if (hasPhase) {
                const qualiScores = scores.filter(s => (s.phase ?? 'quali') === 'quali');
                const finalScores = scores.filter(s => s.phase === 'final');
                return { qualiRuns: groupByRunNumber(qualiScores), finalRuns: groupByRunNumber(finalScores) };
            }
            // Fallback: no phase field — use runNumber or judge-repeat to get all runs,
            // then split by qualiRuns config boundary
            const allRuns = scoreToRuns(scores);
            return { allRuns };
        }

        // Recalculate a single judge's score using current criteria weights when raw
        // criterion scores (score1/score2/…) are present; otherwise fall back to stored total.
        function calcJudgeTotal(s) {
            return Math.round(CONFIG.criteria.reduce((a, c) =>
                a + (s[c.key] ?? 0) * ((c.weight ?? (100 / CONFIG.criteria.length)) / 100), 0));
        }

        // Deduplicate an array of score records keeping only the latest per judgeName.
        // Input is already sorted by createdAt (oldest first) so the last entry wins.
        // Result is sorted alphabetically by judgeName for a stable display order.
        function deduplicateByJudge(scores) {
            const latest = new Map();
            for (const s of scores) latest.set(s.judgeName, s);
            return [...latest.values()].sort((a, b) => a.judgeName.localeCompare(b.judgeName));
        }

        function groupByRunNumber(scores) {
            if (!scores.length) return [];
            const hasRunNumber = scores.some(s => s.runNumber != null);
            if (hasRunNumber) {
                const byRun = {};
                for (const s of scores) {
                    const r = s.runNumber ?? 1;
                    if (!byRun[r]) byRun[r] = [];
                    byRun[r].push(s);
                }
                return Object.keys(byRun).map(Number).sort((a, b) => a - b)
                    .map(r => {
                        const deduped = deduplicateByJudge(byRun[r]);
                        return { scores: deduped, total: deduped.reduce((a, s) => a + calcJudgeTotal(s), 0) };
                    });
            }
            // Judge-repeat fallback
            return scoreToRuns(scores);
        }

        function scoreToRuns(scores) {
            const hasRunNumber = scores.some(s => s.runNumber != null);
            if (hasRunNumber) {
                const byRun = {};
                for (const s of scores) {
                    const r = s.runNumber ?? 1;
                    if (!byRun[r]) byRun[r] = [];
                    byRun[r].push(s);
                }
                return Object.keys(byRun).map(Number).sort((a, b) => a - b)
                    .map(r => {
                        const deduped = deduplicateByJudge(byRun[r]);
                        return { scores: deduped, total: deduped.reduce((a, s) => a + calcJudgeTotal(s), 0) };
                    });
            }
            const runs = [];
            let chunk = [];
            const seen = new Set();
            for (const score of scores) {
                if (seen.has(score.judgeName)) {
                    if (chunk.length) {
                        const deduped = deduplicateByJudge(chunk);
                        runs.push({ scores: deduped, total: deduped.reduce((a, s) => a + calcJudgeTotal(s), 0) });
                    }
                    chunk = [score];
                    seen.clear();
                    seen.add(score.judgeName);
                } else {
                    chunk.push(score);
                    seen.add(score.judgeName);
                }
            }
            if (chunk.length) {
                const deduped = deduplicateByJudge(chunk);
                runs.push({ scores: deduped, total: deduped.reduce((a, s) => a + calcJudgeTotal(s), 0) });
            }
            return runs;
        }

        function buildResults() {
            const byStarter = {};
            for (const s of allScores) {
                const n = s.startNumber;
                if (!byStarter[n]) byStarter[n] = [];
                byStarter[n].push(s);
            }

            const finalistNums = new Set(allFinalEntries.map(fe => fe.startNumber ?? fe.starter?.startNumber));

            const results = [];
            for (const [numStr, scores] of Object.entries(byStarter)) {
                const num = String(numStr);
                const starter = starters.find(s => String(s.startNumber) === num);

                if (starter?.status === 'disqualified' || starter?.status === 'removed') continue;
                if (filterGroup !== null && starter?.startGroup?.objectId !== filterGroup) continue;

                const phaseResult = scoreToPhaseRuns(scores);
                let qualiRuns, finalRuns;
                if (phaseResult.allRuns) {
                    // Legacy fallback: split by qualiRuns count
                    const qualiCount = CONFIG.qualiRuns ?? phaseResult.allRuns.length;
                    qualiRuns = phaseResult.allRuns.slice(0, qualiCount);
                    finalRuns = phaseResult.allRuns.slice(qualiCount);
                } else {
                    qualiRuns = phaseResult.qualiRuns;
                    finalRuns = phaseResult.finalRuns;
                }

                if (!qualiRuns.length && !finalRuns.length) continue;

                const qualiCount = CONFIG.qualiRuns ?? qualiRuns.length;
                const finalCount = CONFIG.finalRuns ?? 0;
                const isFinal = finalistNums.has(num);
                const finalEntry = allFinalEntries.find(fe => String(fe.startNumber ?? fe.starter?.startNumber) === num);
                const finalStartNumber = finalEntry?.finalStartNumber ?? null;

                const qualiComplete = qualiRuns.length >= qualiCount;
                const finalComplete = !isFinal || finalRuns.length >= finalCount;
                const complete = isFinal ? finalComplete : qualiComplete;

                const qualiTotal = qualiRuns.reduce((a, r) => a + r.total, 0);
                const qualiBest = qualiRuns.length ? Math.max(...qualiRuns.map(r => r.total)) : 0;
                const qualiScore = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? qualiBest : qualiTotal;
                const finalTotal = finalRuns.reduce((a, r) => a + r.total, 0);
                const finalBest = finalRuns.length ? Math.max(...finalRuns.map(r => r.total)) : 0;
                const finalScore = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? finalBest : finalTotal;
                const best = isFinal ? (finalRuns.length ? finalScore : qualiScore) : qualiScore;

                results.push({ num, starter, qualiRuns, finalRuns, qualiCount, finalCount, isFinal, finalStartNumber, qualiScore, finalScore, finalTotal, best, complete });
            }

            // Finalists with no final runs yet sort below finalists who have run,
            // regardless of their qualiScore.
            results.sort((a, b) => {
                const aHasFinal = a.isFinal && a.finalRuns.length > 0;
                const bHasFinal = b.isFinal && b.finalRuns.length > 0;
                if (aHasFinal !== bHasFinal) return aHasFinal ? -1 : 1;
                return b.best - a.best;
            });
            return results;
        }

        function buildExcluded(statusFilter) {
            const byStarter = {};
            for (const s of allScores) {
                const n = s.startNumber;
                if (!byStarter[n]) byStarter[n] = [];
                byStarter[n].push(s);
            }
            const results = [];
            for (const [numStr, scores] of Object.entries(byStarter)) {
                const num = String(numStr);
                const starter = starters.find(s => String(s.startNumber) === num);
                if ((starter?.status ?? 'active') !== statusFilter) continue;
                if (filterGroup !== null && starter?.startGroup?.objectId !== filterGroup) continue;
                const runs = scoreToRuns(scores);
                const best = runs.length ? Math.max(...runs.map(r => r.total)) : null;
                results.push({ num, starter, runs, best });
            }
            return results;
        }

        // Returns one of 6 states for a start group chip:
        // quali-idle / quali-running / quali-done / final-idle / final-running / final-done
        function groupMode(sg) {
            if (!sg) return 'quali-idle';
            const gid = sg.objectId;

            const groupStarters = starters.filter(s => s.startGroup?.objectId === gid && s.status !== 'removed');
            const countableStarters = groupStarters.filter(s => s.status !== 'disqualified');

            const phaseRunCounts = num => {
                const scores = allScores.filter(sc => String(sc.startNumber) === String(num));
                const r = scoreToPhaseRuns(scores);
                if (r.allRuns) {
                    const qc = CONFIG.qualiRuns ?? r.allRuns.length;
                    return { quali: Math.min(r.allRuns.length, qc), final: Math.max(0, r.allRuns.length - qc) };
                }
                return { quali: r.qualiRuns.length, final: r.finalRuns.length };
            };

            // --- QUALI phase (qualiClosed = false) ---
            if (!sg.qualiClosed) {
                const anyQualiRun = countableStarters.some(s => phaseRunCounts(s.startNumber).quali > 0);
                if (!anyQualiRun) return 'quali-idle';

                if (CONFIG.qualiRuns == null) return 'quali-running';
                const allQualiDone = countableStarters.length > 0 && countableStarters.every(s =>
                    phaseRunCounts(s.startNumber).quali >= CONFIG.qualiRuns
                );
                return allQualiDone ? 'quali-done' : 'quali-running';
            }

            // --- FINAL phase (qualiClosed = true) ---
            const finalistNums = new Set(
                allFinalEntries.filter(fe => fe.startGroup?.objectId === gid).map(fe => fe.startNumber ?? fe.starter?.startNumber)
            );

            if (!finalistNums.size) return 'final-idle';

            const anyFinalRun = [...finalistNums].some(num => phaseRunCounts(num).final > 0);
            if (!anyFinalRun) return 'final-idle';

            if (CONFIG.finalRuns == null) return 'final-running';
            const allFinalDone = [...finalistNums].every(num =>
                phaseRunCounts(num).final >= CONFIG.finalRuns
            );
            return allFinalDone ? 'final-done' : 'final-running';
        }

        function renderGroupChips() {
            const bar = document.getElementById('group-chips');
            const filterFieldset = document.getElementById('filter-fieldset');
            const groups = [];
            const seen = new Set();
            for (const s of starters) {
                if (s.startGroup && !seen.has(s.startGroup.objectId)) {
                    seen.add(s.startGroup.objectId);
                    groups.push({ id: s.startGroup.objectId, name: s.startGroup.name ?? s.startGroup.objectId });
                }
            }
            groups.sort((a, b) => a.name.localeCompare(b.name));
            groups.forEach((g, i) => groupColorMap.set(g.id, GROUP_COLORS[i % GROUP_COLORS.length]));

            filterFieldset.style.display = groups.length ? '' : 'none';
            bar.innerHTML = '';

            const modeLabels = {
                'quali-idle': 'Quali nicht gestartet',
                'quali-running': 'Quali gestartet',
                'quali-done': 'Quali beendet',
                'final-idle': 'Finale nicht gestartet',
                'final-running': 'Final gestartet',
                'final-done': 'Final beendet',
            };

            for (const g of groups) {
                const sg = startGroups.find(x => x.objectId === g.id);
                const mode = groupMode(sg);
                const color = groupColor(g.id);
                const chip = document.createElement('button');
                chip.className = 'fchip' + (filterGroup === g.id ? ' active' : '');
                chip.style.setProperty('--group-color', color);
                chip.innerHTML =
                    `<span class="group-color-dot" style="background:${color}"></span>` +
                    g.name +
                    `<span class="group-mode-badge ${mode}">${modeLabels[mode]}</span>`;
                chip.addEventListener('click', () => {
                    filterGroup = filterGroup === g.id ? null : g.id;
                    renderGroupChips();
                    render();
                });
                bar.appendChild(chip);
            }

            // Update header group indicator
            const groupHeader = document.getElementById('group-header');
            const groupHeaderValue = document.getElementById('group-header-value');
            if (filterGroup) {
                const sg = startGroups.find(x => x.objectId === filterGroup);
                const g = groups.find(x => x.id === filterGroup);
                const mode = groupMode(sg);
                groupHeader.style.display = '';
                groupHeaderValue.textContent = g?.name ?? '—';
                groupHeaderValue.style.color = {
                    'quali-idle': 'var(--muted)',
                    'quali-running': '#e3a007',
                    'quali-done': 'var(--green)',
                    'final-idle': 'var(--muted)',
                    'final-running': 'var(--accent)',
                    'final-done': '#ffd700',
                }[mode] ?? 'var(--text)';
                document.getElementById('group-header-label').textContent = modeLabels[mode];
            } else {
                groupHeader.style.display = 'none';
            }
        }

        function render() {
            renderGroupChips();
            const results = buildResults();
            const list = document.getElementById('results-list');
            const total = filterGroup !== null
                ? results.length + ' von ' + buildResultsAll().length
                : results.length;
            document.getElementById('starter-count').textContent = results.length;

            // Info fieldset: ranking mode + weights
            const modeEl = document.getElementById('ranking-mode-label');
            const weightEl = document.getElementById('weight-legend');
            const infoFieldset = document.getElementById('info-fieldset');
            const qualiMulti = CONFIG.qualiRuns === null || CONFIG.qualiRuns > 1;
            const finalMulti = CONFIG.finalRuns === null || CONFIG.finalRuns > 1;
            const modeParts = [];
            if (qualiMulti) {
                const mv = (CONFIG.qualiScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Summe';
                modeParts.push(`Quali <span class="mode-val">${mv}</span>`);
            }
            if (finalMulti) {
                const mv = (CONFIG.finalScoreMode ?? 'sum') === 'best' ? 'Bester Lauf' : 'Summe';
                modeParts.push(`Final <span class="mode-val">${mv}</span>`);
            }
            modeEl.innerHTML = modeParts.map(p => `<span class="ranking-mode-badge">${p}</span>`).join('');
            modeEl.style.display = modeParts.length ? '' : 'none';

            const hasWeights = CONFIG.criteria.some(c => c.weight != null);
            if (hasWeights) {
                weightEl.textContent = 'Gewichtung: ' + CONFIG.criteria.map(c => `${c.shortLabel} ${c.weight}%`).join(' · ');
                weightEl.style.display = '';
            } else {
                weightEl.style.display = 'none';
            }

            const hasCriteria = CONFIG.criteria.length > 0;
            document.getElementById('value-mode-row').style.display = hasCriteria ? '' : 'none';
            list.classList.toggle('mode-raw', valueMode === 'raw');
            list.classList.toggle('mode-weighted', valueMode === 'weighted');

            infoFieldset.style.display = (modeParts.length || hasWeights || hasCriteria) ? '' : 'none';

            if (!results.length) {
                list.innerHTML = '<div class="results-empty">Noch keine Wertungen</div>';
                return;
            }

            const openNums = new Set(
                [...list.querySelectorAll('.result-card.open')].map(el => String(el.dataset.num))
            );
            const openChips = new Set(
                [...list.querySelectorAll('.run-judge-chip.open')].map(el => el.dataset.chipKey)
            );
            const openQualiReveals = new Set(
                [...list.querySelectorAll('.quali-reveal.open')].map(el => el.dataset.num)
            );

            list.innerHTML = '';
            // Compute ranks: tied scores share the same rank, next rank skips (1,1,3,4…)
            // Finalists with no final runs yet get null rank (shown as —)
            const ranks = [];
            let rankCounter = 0;
            for (let i = 0; i < results.length; i++) {
                const r = results[i];
                const pending = r.isFinal && r.finalRuns.length === 0;
                if (pending) { ranks.push(null); continue; }
                rankCounter++;
                if (i > 0 && ranks[i - 1] !== null && results[i - 1].best === r.best) {
                    ranks.push(ranks[i - 1]);
                } else {
                    ranks.push(rankCounter);
                }
            }

            results.forEach(({ num, starter, qualiRuns, finalRuns, qualiCount, finalCount, isFinal, finalStartNumber, qualiScore, finalScore, finalTotal, best, complete }, i) => {
                const card = document.createElement('div');
                card.className = 'result-card' + (openNums.has(num) ? ' open' : '');
                card.dataset.num = num;

                const rank = ranks[i];
                const rankClass = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
                const rankDisplay = rank ?? '—';
                const firstName = starter?.firstName ?? '';
                const lastName = starter?.lastName ?? String(num);
                const groupName = starter?.startGroup?.name ?? '';
                const groupColorVal = groupColor(starter?.startGroup?.objectId);
                const groupBadgeStyle = groupColorVal
                    ? ` style="color:${groupColorVal};background:color-mix(in srgb, ${groupColorVal} 16%, transparent);border-color:color-mix(in srgb, ${groupColorVal} 35%, transparent)"`
                    : '';
                const qualiDone = qualiRuns.length >= qualiCount;
                const finalDone = isFinal && finalRuns.length >= finalCount;
                const phaseDone = isFinal ? finalDone : qualiDone;

                // Progress badge
                let badgeText, badgeClass;
                if (isFinal) {
                    badgeText = `${finalRuns.length}/${finalCount} Final`;
                    badgeClass = 'result-runs-badge ' + (finalDone ? 'final-done' : finalRuns.length > 0 ? 'final-partial' : 'final-none');
                } else {
                    badgeText = `${qualiRuns.length}/${qualiCount} Quali`;
                    badgeClass = 'result-runs-badge' + (qualiDone ? ' complete' : '');
                }

                // Quali score pill — only shown for finalists when there's an actual quali score
                const qualiPillHtml = (isFinal && qualiScore > 0)
                    ? `<span class="result-quali-pill">Q ${qualiScore.toFixed(1)}</span>`
                    : '';

                // Final start number chip — only for finalists
                const finalNumHtml = (isFinal && finalStartNumber)
                    ? `<span class="result-final-num">${finalStartNumber}</span>`
                    : '';

                // Run pills on the right
                const buildRunPills = (runs, totalExpected) => {
                    if (totalExpected <= 1 && runs.length <= 1) {
                        if (!runs.length) return '';
                        return `<div class="result-run-pills"><span class="result-run-pill best">1· ${runs[0].total.toFixed(1)}</span></div>`;
                    }
                    const bestTotal = runs.length ? Math.max(...runs.map(r => r.total)) : -Infinity;
                    let html = `<div class="result-run-pills">`;
                    for (let ri = 0; ri < totalExpected; ri++) {
                        const run = runs[ri];
                        if (run) {
                            const isBest = run.total === bestTotal;
                            html += `<span class="result-run-pill${isBest ? ' best' : ''}">${ri + 1}· ${run.total.toFixed(1)}</span>`;
                        } else {
                            html += `<span class="result-run-pill pending">${ri + 1}· —</span>`;
                        }
                    }
                    return html + `</div>`;
                };

                const pillsHtml = isFinal
                    ? buildRunPills(finalRuns, finalCount)
                    : buildRunPills(qualiRuns, qualiCount);

                const displayScore = isFinal ? finalScore : qualiScore;

                const header = document.createElement('div');
                header.className = 'result-header';
                header.innerHTML =
                    `<div class="result-rank-group">` +
                    `<div class="result-rank${rankClass}">${rankDisplay}</div>` +
                    finalNumHtml +
                    `</div>` +
                    `<div class="result-name">` +
                    `<div class="result-name-row">` +
                    `<span class="result-num">#${num}</span>` +
                    `<div class="result-fullname">` +
                    (firstName ? `<span class="result-first">${firstName}</span>` : '') +
                    `<span class="result-last">${lastName}</span>` +
                    `</div>` +
                    `</div>` +
                    `<div class="result-meta">` +
                    (groupName ? `<span class="result-group-badge"${groupBadgeStyle}>${groupName}</span>` : '') +
                    `<span class="${badgeClass}">${badgeText}</span>` +
                    `</div>` +
                    `</div>` +
                    `<div class="result-right">` +
                    `<div class="result-score-row">` +
                    qualiPillHtml +
                    `<div class="result-best${displayScore > 0 ? '' : ' incomplete'}">${displayScore.toFixed(1)}</div>` +
                    `</div>` +
                    pillsHtml +
                    `</div>`;
                header.addEventListener('click', () => card.classList.toggle('open'));
                card.appendChild(header);

                const runsDiv = document.createElement('div');
                runsDiv.className = 'result-runs';

                // Helper: render a phase block (quali or final) — always expanded, no header
                const renderPhase = (container, phaseRuns, totalExpected, isFinalPhase) => {
                    const bestRunTotal = phaseRuns.length > 1 ? Math.max(...phaseRuns.map(r => r.total)) : -Infinity;

                    for (let ri = 0; ri < totalExpected; ri++) {
                        const run = phaseRuns[ri];
                        const isBestRun = run && phaseRuns.length > 1 && run.total === bestRunTotal;
                        const isDimmed = run && phaseRuns.length > 1 && !isBestRun;
                        const row = document.createElement('div');
                        row.className = 'run-row' + (run ? '' : ' missing') + (isBestRun ? ' best-run' : '') + (isDimmed ? ' dim' : '') + (!isFinalPhase ? ' quali-row' : '');

                        if (!run) {
                            const labelWrap = document.createElement('div');
                            labelWrap.style.cssText = 'display:flex;flex-direction:column;gap:0.2rem';
                            labelWrap.innerHTML = `<span class="run-label">Lauf ${ri + 1}</span>`;
                            const missingDiv = document.createElement('div');
                            missingDiv.className = 'run-missing-text';
                            missingDiv.textContent = 'Ausstehend';
                            const emptyDiv = document.createElement('div');
                            row.appendChild(labelWrap);
                            row.appendChild(missingDiv);
                            row.appendChild(emptyDiv);
                        } else {
                            const labelWrap = document.createElement('div');
                            labelWrap.style.cssText = 'display:flex;flex-direction:column;gap:0.2rem';
                            labelWrap.innerHTML = `<span class="run-label">Lauf ${ri + 1}</span>`;

                            const judgesDiv = document.createElement('div');
                            judgesDiv.className = 'run-judges';

                            for (const score of run.scores) {
                                const hasCriteria = CONFIG.criteria.length > 0;
                                const chipKey = `${num}-${isFinalPhase ? 'final' : 'quali'}-r${ri}-${score.judgeName}`;
                                const chip = document.createElement('div');
                                chip.className = 'run-judge-chip' + (hasCriteria ? ' has-criteria' : '') + (openChips.has(chipKey) ? ' open' : '');
                                chip.dataset.chipKey = chipKey;
                                const critHtml = CONFIG.criteria.map(c => {
                                    const raw = score[c.key] ?? 0;
                                    const w = c.weight ?? (100 / CONFIG.criteria.length);
                                    const weighted = Math.round(raw * w / 100);
                                    return `<span class="run-judge-crit">` +
                                        `<span class="run-judge-crit-label">${c.shortLabel}</span>` +
                                        `<span class="run-judge-crit-raw">${raw}</span>` +
                                        `<span class="run-judge-crit-divider"></span>` +
                                        `<span class="run-judge-crit-w">${weighted}</span>` +
                                        `</span>`;
                                }).join('');
                                chip.innerHTML =
                                    `<span class="run-judge-name">${score.judgeName}</span>` +
                                    `<span class="run-judge-score-row">` +
                                    `<span class="run-judge-score">${calcJudgeTotal(score).toFixed(1)}</span>` +
                                    (hasCriteria ? `<span class="run-judge-chevron">▾</span>` : '') +
                                    `</span>` +
                                    (hasCriteria ? `<div class="run-judge-criteria">${critHtml}</div>` : '');
                                if (hasCriteria) {
                                    chip.addEventListener('click', () => {
                                        const nowOpen = !chip.classList.contains('open');
                                        judgesDiv.querySelectorAll('.run-judge-chip').forEach(c => c.classList.toggle('open', nowOpen));
                                    });
                                }
                                judgesDiv.appendChild(chip);
                            }

                            const totalDiv = document.createElement('div');
                            totalDiv.className = 'run-total' + (isBestRun ? ' best-run-total' : '');
                            totalDiv.textContent = run.total.toFixed(1);

                            row.appendChild(labelWrap);
                            row.appendChild(judgesDiv);
                            row.appendChild(totalDiv);
                        }
                        container.appendChild(row);
                    }
                };

                if (isFinal) {
                    // Final result up front, no header — it only repeats the score already shown in the card header.
                    renderPhase(runsDiv, finalRuns, finalCount, true);

                    if (qualiRuns.length) {
                        const revealWrap = document.createElement('div');
                        revealWrap.className = 'quali-reveal' + (openQualiReveals.has(num) ? ' open' : '');
                        revealWrap.dataset.num = num;

                        const revealBtn = document.createElement('button');
                        revealBtn.type = 'button';
                        revealBtn.className = 'quali-reveal-toggle';
                        const revealLabel = document.createElement('span');
                        const setRevealLabel = () => {
                            revealLabel.textContent = revealWrap.classList.contains('open')
                                ? 'Quali-Läufe verbergen'
                                : 'Quali-Läufe anzeigen';
                        };
                        revealBtn.innerHTML = `<span class="quali-reveal-chevron">▾</span>`;
                        revealBtn.appendChild(revealLabel);
                        setRevealLabel();
                        revealBtn.addEventListener('click', () => {
                            revealWrap.classList.toggle('open');
                            setRevealLabel();
                        });
                        revealWrap.appendChild(revealBtn);

                        const revealBody = document.createElement('div');
                        revealBody.className = 'quali-reveal-body';
                        renderPhase(revealBody, qualiRuns, qualiCount, false);
                        revealWrap.appendChild(revealBody);

                        runsDiv.appendChild(revealWrap);
                    }
                } else {
                    // Non-finalists: quali is the only phase — still no header, score is already in the card header.
                    renderPhase(runsDiv, qualiRuns, qualiCount, false);
                }

                card.appendChild(runsDiv);
                list.appendChild(card);
            });

            // Excluded panels — DSQ and Removed
            const renderExclPanel = (statusFilter, label, titleClass, icon) => {
                const excluded = buildExcluded(statusFilter);
                if (!excluded.length) return;

                const panelId = `excl-${statusFilter}`;
                const wasOpen = list.querySelector(`[data-excl="${statusFilter}"]`)?.classList.contains('open');

                const panel = document.createElement('div');
                panel.className = 'excl-panel' + (wasOpen ? ' open' : '');
                panel.dataset.excl = statusFilter;

                const hdr = document.createElement('div');
                hdr.className = 'excl-panel-header';
                hdr.innerHTML =
                    `<div class="excl-panel-title ${titleClass}">${icon} ${label}</div>` +
                    `<span class="excl-count">${excluded.length}</span>` +
                    `<span class="excl-chevron">▼</span>`;
                hdr.addEventListener('click', () => panel.classList.toggle('open'));
                panel.appendChild(hdr);

                const body = document.createElement('div');
                body.className = 'excl-body';

                for (const { num, starter, runs, best } of excluded) {
                    const item = document.createElement('div');
                    item.className = 'excl-item';
                    const firstName = starter?.firstName ?? '';
                    const lastName = starter?.lastName ?? String(num);
                    const groupName = starter?.startGroup?.name ?? '';
                    item.innerHTML =
                        `<span class="result-num">#${num}</span>` +
                        `<span class="result-name" style="flex:1">` +
                        `<span class="result-first">${firstName}</span>` +
                        `<span class="result-last">${lastName}</span>` +
                        `</span>` +
                        (groupName ? `<span class="result-group-badge">${groupName}</span>` : '') +
                        (best != null ? `<span style="font-size:0.95rem;font-weight:800;color:var(--muted)">${best.toFixed(1)}</span>` : '');
                    body.appendChild(item);
                }

                panel.appendChild(body);
                list.appendChild(panel);
            };

            renderExclPanel('disqualified', 'Disqualifiziert', 'dq', '⊘');
            renderExclPanel('removed', 'Entfernt', 'removed', '✕');
        }

        // Helper for unfiltered count used in label
        function buildResultsAll() {
            const saved = filterGroup;
            filterGroup = null;
            const r = buildResults();
            filterGroup = saved;
            return r;
        }

        async function refresh() {
            try {
                [allScores, starters, allFinalEntries] = await Promise.all([
                    ParseAPI.fetchAllJuryScores(),
                    ParseAPI.fetchStarters(),
                    ParseAPI.fetchAllFinalEntries().catch(() => []),
                ]);
                render();
            } catch (_) { }
        }

        document.querySelectorAll('#value-mode-row .value-mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                valueMode = btn.dataset.mode;
                document.querySelectorAll('#value-mode-row .value-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === valueMode));
                const list = document.getElementById('results-list');
                list.classList.toggle('mode-raw', valueMode === 'raw');
                list.classList.toggle('mode-weighted', valueMode === 'weighted');
            });
        });

        async function init() {
            await Promise.all([ParseAPI.fetchEvent(), ParseAPI.fetchJudges()]).catch(() => { });
            document.getElementById('event-name').textContent = CONFIG.eventName;
            document.title = `${CONFIG.eventName} – Ergebnisse`;

            [starters, startGroups] = await Promise.all([
                ParseAPI.fetchStarters().catch(() => []),
                ParseAPI.fetchStartGroups().catch(() => []),
            ]);
            renderGroupChips();
            await refresh();

            ParseAPI.subscribeAllJuryScores(refresh);
            ParseAPI.subscribeStartGroups(msg => {
                const sg = startGroups.find(g => g.objectId === msg.object?.objectId);
                if (sg && msg.object) { sg.qualiClosed = msg.object.qualiClosed; renderGroupChips(); }
            });
            ParseAPI.subscribeFinalEntries(async () => {
                allFinalEntries = await ParseAPI.fetchAllFinalEntries().catch(() => allFinalEntries);
                renderGroupChips();
            });
        }

        init();
    </script>
</body>

</html>
